<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <link rel="icon" href="/favicon.ico" type="image/x-icon">
    <link rel="shortcut icon" href="/favicon.ico" type="image/x-icon">
    <title>Contact Us - Skylinks Men's Golf Club</title>
    <link rel="stylesheet" href="/css/styles.css" />
</head>
<body>

    <!-- HEADER INJECTION -->
    <div id="header-placeholder"></div>

    <!-- Contact Page Section -->
    <section class="contact-page-section">
        <div class="container">
            <div class="contact-page-grid">
                <!-- Left side: Content and Form -->
                <div class="contact-page-content">
                    <h1>Contact Us</h1>
                    <p>Have questions regarding membership or a specific tournament? Fill out some info and we will be in touch shortly.</p>
                    <div class="contact-page-form">
                        <form id="contact-form">
                            <div class="form-group name-fields">
                                <label>Name * (First and Last)</label>
                                <div class="name-inputs">
                                    <input type="text" id="first-name" name="first-name" placeholder="First Name" required />
                                    <input type="text" id="last-name" name="last-name" placeholder="Last Name" required />
                                </div>
                            </div>
                            <div class="form-group">
                                <label for="email">Email *</label>
                                <input type="email" id="email" name="email" required />
                            </div>
                            <div class="form-group">
                                <label for="topic">Topic</label>
                                <select id="topic" name="topic">
                                    <option value="membership">Membership</option>
                                    <option value="tournament">Tournament</option>
                                    <option value="results">Results</option>
                                    <option value="other">Other</option>
                                </select>
                            </div>
                            <div class="form-group">
                                <label for="message">Message *</label>
                                <textarea id="message" name="message" required></textarea>
                            </div>
                            <button type="submit" class="submit-btn">Send</button>
                        </form>
                    </div>
                </div>
                
                <!-- Right side: Image (500px width, full height) -->
                <div class="contact-page-image">
                    <img 
                        alt="Skylinks Men's Golf Club" 
                        loading="lazy"
                        id="contact-page-image"
                    >
                </div>
            </div>
        </div>
    </section>

    <!-- FOOTER INJECTION -->
    <div id="footer-placeholder"></div>

    <!-- Scripts -->
    <script src="/js/contact.js"></script>  <!-- ADD THIS FIRST -->
    <script src="/js/menu.js"></script>
    <script src="/js/cart-count.js"></script>
    <script>
        // Load header + footer on page
        fetch("/header.html")
            .then(res => res.text())
            .then(html => {
                document.getElementById("header-placeholder").innerHTML = html;
                if (typeof initMenu === 'function') initMenu();
            });

        fetch("/footer.html")
            .then(res => res.text())
            .then(html => (document.getElementById("footer-placeholder").innerHTML = html));

        // Load contact page image
        async function loadContactImage() {
            try {
                const response = await fetch('/api/images');
                const images = await response.json();
                const contactImage = images.find(img => img.id === 'contact');
                
                const contactImg = document.getElementById('contact-page-image');
                if (contactImg && contactImage && contactImage.imageUrl) {
                    contactImg.src = contactImage.imageUrl;
                }
            } catch (error) {
                console.error('Error loading contact image:', error);
            }
        }

        // REMOVE THE ENTIRE CONFLICTING FORM HANDLER (lines 93-134)
        // Let contact.js handle form submission
        
        // Load contact image when page is ready
        document.addEventListener('DOMContentLoaded', loadContactImage);
    </script>

</body>
</html>
