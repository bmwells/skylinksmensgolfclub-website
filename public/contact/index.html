<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <link rel="icon" href="/favicon.ico" type="image/x-icon">
    <link rel="shortcut icon" href="/favicon.ico" type="image/x-icon">
    <title>Contact Us - Skylinks Men's Golf Club</title>
    <link rel="stylesheet" href="/css/styles.css" />

</head>
<body>

    <!-- HEADER INJECTION -->
    <div id="header-placeholder"></div>

    <!-- Contact Page Section -->
    <section class="contact-page-section">
        <div class="container">
            <div class="contact-page-grid">
                <!-- Left side: Content and Form -->
                <div class="contact-page-content">
                    <h1>Contact Us</h1>
                    <p>Have questions regarding membership or a specific tournament? Fill out some info and we will be in touch shortly.</p>
                    <div class="contact-page-form">
                        <form>
                            <div class="form-group name-fields">
                                <label>Name *</label>
                                <div class="name-inputs">
                                    <input type="text" id="first-name" name="first-name" placeholder="First Name" required />
                                    <input type="text" id="last-name" name="last-name" placeholder="Last Name" required />
                                </div>
                            </div>
                            <div class="form-group">
                                <label for="email">Email *</label>
                                <input type="email" id="email" name="email" required />
                            </div>
                            <div class="form-group">
                                <label for="topic">Topic</label>
                                <select id="topic" name="topic">
                                    <option value="membership">Membership</option>
                                    <option value="tournament">Tournament</option>
                                    <option value="results">Results</option>
                                    <option value="other">Other</option>
                                </select>
                            </div>
                            <div class="form-group">
                                <label for="message">Message *</label>
                                <textarea id="message" name="message" required></textarea>
                            </div>
                            <button type="submit" class="submit-btn">Send</button>
                        </form>
                    </div>
                </div>
                
                <!-- Right side: Image (500px width, full height) -->
                <div class="contact-page-image">
                    <img 
                        src="https://images.squarespace-cdn.com/content/v1/678d4161123ed24a1ff89f0e/1737310568234-IEFCFMC1A0MNK2XDY7X1/IMG_0613.JPG?format=2500w" 
                        alt="Skylinks Men's Golf Club" 
                        loading="lazy"
                    >
                </div>
            </div>
        </div>
    </section>

    <!-- FOOTER INJECTION -->
    <div id="footer-placeholder"></div>

    <!-- Scripts -->
    <script src="/js/menu.js"></script>
    <script src="/js/cart-count.js"></script>
    <script>
        // Load header + footer on page
        fetch("/header.html")
            .then(res => res.text())
            .then(html => {
                document.getElementById("header-placeholder").innerHTML = html;
                // Initialize menu if the function exists
                if (typeof initMenu === 'function') {
                    initMenu();
                }
            });

        fetch("/footer.html")
            .then(res => res.text())
            .then(html => (document.getElementById("footer-placeholder").innerHTML = html));

        // Form submission handling - matching home page
        document.querySelector('.contact-page-form form')?.addEventListener('submit', function(e) {
            e.preventDefault();
            
            // Basic form validation
            const firstName = document.getElementById('first-name').value.trim();
            const lastName = document.getElementById('last-name').value.trim();
            const email = document.getElementById('email').value.trim();
            const message = document.getElementById('message').value.trim();
            
            if (!firstName || !lastName || !email || !message) {
                alert('Please fill in all required fields.');
                return;
            }
            
            // Email validation
            const emailRegex = /^[^\s@]+@[^\s@]+\.[^\s@]+$/;
            if (!emailRegex.test(email)) {
                alert('Please enter a valid email address.');
                return;
            }
            
            // Simulate form submission
            const submitBtn = this.querySelector('.submit-btn');
            const originalText = submitBtn.textContent;
            submitBtn.textContent = 'Sending...';
            submitBtn.disabled = true;
            
            // In a real implementation, you would send this data to a server
            setTimeout(() => {
                alert('Thank you! Your message has been sent.');
                this.reset();
                submitBtn.textContent = originalText;
                submitBtn.disabled = false;
            }, 1500);
        });

        // Add focus effects to form fields
        document.querySelectorAll('.contact-page-form input, .contact-page-form select, .contact-page-form textarea').forEach(field => {
            field.addEventListener('focus', function() {
                this.style.borderColor = '#333';
                this.style.outline = 'none';
            });
            
            field.addEventListener('blur', function() {
                this.style.borderColor = '#ddd';
            });
        });
    </script>

</body>
</html>
