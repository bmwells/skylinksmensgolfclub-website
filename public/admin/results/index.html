<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<title>Results Editor - Skylinks Admin</title>
<link rel="stylesheet" href="/css/admin.css">
<script src="/js/admin-common.js"></script>
</head>
<body>

<div class="header">
  <h1>Results Editor</h1>
  <div>
    <button onclick="AdminCommon.checkUnsavedChanges()">← Back to Admin</button>
  </div>
</div>

<div class="edit-buttons">
  <button onclick="addRow()">✏️ Add Row</button>
  <button onclick="AdminCommon.toggleReorder()">↕️ Rearrange Rows</button>
  <button onclick="AdminCommon.saveWithAlert()" style="background: #28a745;">💾 Save Changes</button>
</div>

<div id="reorderNotice" class="reorder-notice" style="display:none;">
  <span>Drag rows to reorder. Click "Save Order" when done.</span>
  <div class="reorder-actions">
    <button class="save-order" onclick="AdminCommon.saveOrder('rows')">💾 Save Order</button>
    <button onclick="AdminCommon.toggleReorder()">❌ Cancel</button>
  </div>
</div>

<div id="rows"></div>

<script>
function init() {
    if (AdminCommon.init('results', [])) {
        loadResults();
    }
}

function loadResults() {
    AdminCommon.load().then(() => {
        render();
        // Setup drag and drop container
        document.getElementById('rows').addEventListener('dragover', (e) => {
            e.preventDefault();
        });
    }).catch(err => {
        alert('Error loading results: ' + err.message);
    });
}

function render() {
    const rowsContainer = document.getElementById('rows');
    rowsContainer.innerHTML = '';
    
    AdminCommon.data.forEach((r, i) => {
        const rowDiv = AdminCommon.createElement('div', 'row', '', {
            'data-index': i,
            'draggable': AdminCommon.isReorderMode ? 'true' : 'false'
        });
        
        if (AdminCommon.isReorderMode) {
            // Minimal view for reordering
            rowDiv.innerHTML = AdminCommon.templates.minimalRow(
                r.title || 'Untitled Result',
                (r.dateText || '') + ' ' + (r.timeText || '')
            );
            
            // Add drag events (using the original drag-and-drop logic)
            AdminCommon.addDragEvents(rowDiv, i);
        } else {
            // Full edit view
            rowDiv.innerHTML = AdminCommon.templates.textInput('Title', r.title, `updateResult(${i}, 'title', this.value)`, 'Result title') +
                AdminCommon.templates.formRow(`
                    <div style="flex: 1;">
                        ${AdminCommon.templates.textInput('Date', r.dateText, `updateResult(${i}, 'dateText', this.value)`, 'e.g., Saturday, October 18, 2025', '')}
                    </div>
                    <div style="flex: 1;">
                        ${AdminCommon.templates.textInput('Time', r.timeText, `updateResult(${i}, 'timeText', this.value)`, 'e.g., 1:00 PM', '')}
                    </div>
                `) +
                AdminCommon.templates.formRow(`
                    <div style="flex: 1;">
                        ${AdminCommon.templates.textInput('Month', r.month, `updateResult(${i}, 'month', this.value)`, 'e.g., Oct', '')}
                    </div>
                    <div style="flex: 1;">
                        ${AdminCommon.templates.textInput('Day', r.day, `updateResult(${i}, 'day', this.value)`, 'e.g., 18', '')}
                    </div>
                `) +
                AdminCommon.templates.textInput('Image URL', r.image, `updateResult(${i}, 'image', this.value)`, 'https://example.com/image.jpg') +
                AdminCommon.templates.textInput('Results Link URL', r.link, `updateResult(${i}, 'link', this.value)`, 'https://example.com/details') +
                AdminCommon.templates.deleteButton(`deleteRow(${i})`, 'Delete');
        }
        
        rowsContainer.appendChild(rowDiv);
    });
}

function updateResult(index, field, value) {
    AdminCommon.updateItem(index, field, value);
}

function deleteRow(index) {
    if (AdminCommon.deleteItem(index, 'Are you sure you want to delete this result?')) {
        render();
    }
}

function addRow() {
    if (AdminCommon.isReorderMode) {
        alert('Please exit reorder mode before adding new rows.');
        return;
    }
    
    AdminCommon.addItem({
        title: '',
        dateText: '',
        timeText: '',
        month: '',
        day: '',
        image: '',
        link: ''
    });
    render();
}

window.onload = init;
</script>
</body>
</html>
