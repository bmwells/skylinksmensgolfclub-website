<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<title>Results Editor - Skylinks Admin</title>
<link rel="stylesheet" href="/css/admin.css">
<script src="/js/admin-common.js"></script>
</head>
<body>

<div class="header">
  <h1>Results Editor</h1>
  <div>
    <button onclick="AdminCommon.checkUnsavedChanges()">← Back to Admin</button>
  </div>
</div>

<div class="edit-buttons">
  <button onclick="addRow()">✏️ Add Row</button>
  <button onclick="AdminCommon.saveWithAlert()" style="background: #28a745;">💾 Save Changes</button>
</div>

<div id="rows"></div>

<script>
function init() {
    if (AdminCommon.init('results', [])) {
        loadResults();
    }
}

function loadResults() {
    AdminCommon.load().then(() => {
        // Sort results by date (most recent first - DESCENDING)
        sortResultsByDateDescending();
        render();
    }).catch(err => {
        alert('Error loading results: ' + err.message);
    });
}

function sortResultsByDateDescending() {
    // Sort results by date (most recent first - DESCENDING)
    AdminCommon.data.sort((a, b) => {
        const dateA = parseDateFromResult(a);
        const dateB = parseDateFromResult(b);
        
        // Sort descending (most recent first)
        return dateB - dateA;
    });
}

function parseDateFromResult(result) {
    // Extract year from dateText
    let year = new Date().getFullYear(); // Default to current year
    
    if (result.dateText) {
        // Look for 4-digit year in dateText
        const yearMatch = result.dateText.match(/\b(20\d{2})\b/);
        if (yearMatch) {
            year = parseInt(yearMatch[1]);
        }
    }
    
    // Get month and day
    const monthAbbr = result.month ? result.month.substring(0, 3).toLowerCase() : '';
    const dayText = result.day || '1';
    
    // Handle date ranges (e.g., "16-17")
    let day = 1;
    if (dayText.includes('-')) {
        // If it's a range, use the first day
        day = parseInt(dayText.split('-')[0]) || 1;
    } else {
        day = parseInt(dayText) || 1;
    }
    
    // Month mapping (3-letter abbreviations)
    const monthMap = {
        'jan': 0, 'feb': 1, 'mar': 2, 'apr': 3, 'may': 4, 'jun': 5,
        'jul': 6, 'aug': 7, 'sep': 8, 'oct': 9, 'nov': 10, 'dec': 11
    };
    
    const monthIndex = monthMap[monthAbbr] !== undefined ? monthMap[monthAbbr] : 0;
    
    // Create date object for comparison
    return new Date(year, monthIndex, day);
}

function render() {
    const rowsContainer = document.getElementById('rows');
    rowsContainer.innerHTML = '';
    
    AdminCommon.data.forEach((r, i) => {
        const rowDiv = AdminCommon.createElement('div', 'row', '', {
            'data-index': i
        });
        
        // Full edit view
        rowDiv.innerHTML = AdminCommon.templates.textInput('Title', r.title, `updateResult(${i}, 'title', this.value)`, 'Result title') +
            AdminCommon.templates.formRow(`
                <div style="flex: 1;">
                    ${AdminCommon.templates.textInput('Date', r.dateText, `updateResult(${i}, 'dateText', this.value)`, 'e.g., Saturday, October 18, 2025', '')}
                </div>
                <div style="flex: 1;">
                    ${AdminCommon.templates.textInput('Time', r.timeText, `updateResult(${i}, 'timeText', this.value)`, 'e.g., 1:00 PM', '')}
                </div>
            `) +
            AdminCommon.templates.formRow(`
                <div style="flex: 1;">
                    ${AdminCommon.templates.textInput('Month (3 letters)', r.month, `updateResult(${i}, 'month', this.value)`, 'e.g., Oct', '')}
                </div>
                <div style="flex: 1;">
                    ${AdminCommon.templates.textInput('Day', r.day, `updateResult(${i}, 'day', this.value)`, 'e.g., 18 or 16-17 for ranges', '')}
                </div>
            `) +
            AdminCommon.templates.textInput('Image URL', r.image, `updateResult(${i}, 'image', this.value)`, 'https://example.com/image.jpg') +
            AdminCommon.templates.textInput('Results Link URL', r.link, `updateResult(${i}, 'link', this.value)`, 'https://example.com/details') +
            AdminCommon.templates.deleteButton(`deleteRow(${i})`, 'Delete');
        
        rowsContainer.appendChild(rowDiv);
    });
}

function updateResult(index, field, value) {
    AdminCommon.updateItem(index, field, value);
    // Resort after update if any date-related field was changed
    if (field === 'month' || field === 'day' || field === 'dateText') {
        sortResultsByDateDescending();
        render();
    }
}

function deleteRow(index) {
    if (AdminCommon.deleteItem(index, 'Are you sure you want to delete this result?')) {
        render();
    }
}

function addRow() {
    AdminCommon.addItem({
        title: '',
        dateText: '',
        timeText: '',
        month: '',
        day: '',
        image: '',
        link: ''
    });
    render();
}

window.onload = init;
</script>
</body>
</html>
