<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<title>Monthly Tournament Editor - Skylinks Admin</title>
<link rel="stylesheet" href="/css/admin.css">
<script src="/js/admin-common.js"></script>
</head>
<body>

<div class="header">
  <h1>Monthly Tournament Editor</h1>
  <div>
    <button onclick="AdminCommon.checkUnsavedChanges()">← Back to Admin</button>
  </div>
</div>

<div class="controls">
  <button onclick="saveAllTournaments()" style="background: #28a745;">💾 Save Changes</button>
</div>

<div id="main-content"></div>

<script>
// Make render globally accessible
window.render = render;

// Store tournament data
let tournament1Data = {};
let tournament2Data = {};

function init() {
    if (AdminCommon.init('monthly-tournament', {})) {
        loadMonthlyTournament();
        loadMonthlyTournament2();
    }
}

function loadMonthlyTournament() {
    fetch('/api/monthly-tournament')
        .then(res => {
            if (!res.ok) throw new Error(`Failed to load: ${res.statusText}`);
            return res.json();
        })
        .then(data => {
            tournament1Data = data || {};
            render();
        })
        .catch(err => {
            console.error('Error loading monthly tournament 1:', err);
            tournament1Data = {};
            render();
        });
}

function loadMonthlyTournament2() {
    fetch('/api/monthly-tournament2')
        .then(res => {
            if (!res.ok) throw new Error(`Failed to load: ${res.statusText}`);
            return res.json();
        })
        .then(data => {
            tournament2Data = data || {};
            render();
        })
        .catch(err => {
            console.error('Error loading monthly tournament 2:', err);
            tournament2Data = {};
            render();
        });
}

function render() {
    const mainContentContainer = document.getElementById('main-content');
    
    // Clear container
    mainContentContainer.innerHTML = '';
    
    // Helper function to get live/hidden text with color
    const getLiveHiddenText = (isChecked) => {
        if (isChecked) {
            return '<span style="color: #28a745; font-weight: 600;"> (LIVE)</span>';
        } else {
            return '<span style="color: #dc3545; font-weight: 600;"> (HIDDEN)</span>';
        }
    };
    
    // Create main content section
    const mainContentDiv = document.createElement('div');
    mainContentDiv.className = 'row';
    mainContentDiv.innerHTML = `
        <h3>Monthly Tournament 1 Content</h3>
        ${AdminCommon.templates.textInput('Image URL', tournament1Data?.imageUrl || '', `updateTournament1('imageUrl', this.value)`, 'https://example.com/image.jpg')}
        ${AdminCommon.templates.textInput('Title', tournament1Data?.title || '', `updateTournament1('title', this.value)`, 'Christmas Schamble')}
        <div class="form-row">
            <div style="flex: 1;">
                ${AdminCommon.templates.textInput('Tournament Price (numbers only)', tournament1Data?.price || '', `updateTournament1('price', this.value)`, '84')}
            </div>
            <div style="flex: 1; display: flex; align-items: center; padding-top: 25px;">
                <label style="display: flex; align-items: center; gap: 8px; cursor: pointer;">
                    <input type="checkbox" ${tournament1Data?.cartOption === true ? 'checked' : ''} onchange="updateTournament1('cartOption', this.checked)">
                    <span>Show Cart Option</span>
                </label>
            </div>
        </div>
        <div class="form-row">
            <div style="flex: 1;">
                ${AdminCommon.templates.textInput('Roulette Price ($)', tournament1Data?.roulette || '', `updateTournament1('roulette', this.value)`, '30')}
            </div>
            <div style="flex: 1;">
                ${AdminCommon.templates.textInput('Side Pot Price ($)', tournament1Data?.sidePot || '', `updateTournament1('sidePot', this.value)`, '25')}
            </div>
        </div>
        <div class="form-row">
            <div style="flex: 1; display: flex; align-items: center; padding-top: 25px;">
                <label style="display: flex; align-items: center; gap: 8px; cursor: pointer;">
                    <input type="checkbox" ${tournament1Data?.active !== false ? 'checked' : ''} onchange="updateTournament1('active', this.checked)">
                    <span>Tournament Entry is Open</span>
                </label>
            </div>
            <div style="flex: 1; display: flex; align-items: center; padding-top: 25px;">
                <label id="activePageLabel1" style="display: flex; align-items: center; gap: 8px; cursor: pointer;">
                    <input type="checkbox" id="activePage1" ${tournament1Data?.activePage === true ? 'checked' : ''} onchange="updateTournament1('activePage', this.checked); updateLiveHiddenText('activePage1', this.checked)">
                    Show on Tournament Entry Page${getLiveHiddenText(tournament1Data?.activePage === true)}
                </label>
            </div>
        </div>
        ${AdminCommon.templates.textareaInput('Description', tournament1Data?.description || '', `updateTournament1('description', this.value)`, 'December 14, 2025\\n7:00 AM - 8:00 AM\\n4-Man Shamble (SHOTGUN START)', 'description-textarea')}
        
        <h3 style="margin-top: 40px; border-top: 2px solid #eee; padding-top: 20px;">Monthly Tournament 2 Content</h3>
        ${AdminCommon.templates.textInput('Image URL', tournament2Data?.imageUrl || '', `updateTournament2('imageUrl', this.value)`, 'https://example.com/image2.jpg')}
        ${AdminCommon.templates.textInput('Title', tournament2Data?.title || '', `updateTournament2('title', this.value)`, 'Summer Scramble')}
        <div class="form-row">
            <div style="flex: 1;">
                ${AdminCommon.templates.textInput('Tournament Price (numbers only)', tournament2Data?.price || '', `updateTournament2('price', this.value)`, '90')}
            </div>
            <div style="flex: 1; display: flex; align-items: center; padding-top: 25px;">
                <label style="display: flex; align-items: center; gap: 8px; cursor: pointer;">
                    <input type="checkbox" ${tournament2Data?.cartOption === true ? 'checked' : ''} onchange="updateTournament2('cartOption', this.checked)">
                    <span>Show Cart Option</span>
                </label>
            </div>
        </div>
        <div class="form-row">
            <div style="flex: 1;">
                ${AdminCommon.templates.textInput('Roulette Price ($)', tournament2Data?.roulette || '', `updateTournament2('roulette', this.value)`, '30')}
            </div>
            <div style="flex: 1;">
                ${AdminCommon.templates.textInput('Side Pot Price ($)', tournament2Data?.sidePot || '', `updateTournament2('sidePot', this.value)`, '25')}
            </div>
        </div>
        <div class="form-row">
            <div style="flex: 1; display: flex; align-items: center; padding-top: 25px;">
                <label style="display: flex; align-items: center; gap: 8px; cursor: pointer;">
                    <input type="checkbox" ${tournament2Data?.active !== false ? 'checked' : ''} onchange="updateTournament2('active', this.checked)">
                    <span>Tournament Entry is Open</span>
                </label>
            </div>
            <div style="flex: 1; display: flex; align-items: center; padding-top: 25px;">
                <label id="activePageLabel2" style="display: flex; align-items: center; gap: 8px; cursor: pointer;">
                    <input type="checkbox" id="activePage2" ${tournament2Data?.activePage === true ? 'checked' : ''} onchange="updateTournament2('activePage', this.checked); updateLiveHiddenText('activePage2', this.checked)">
                    Show on Tournament Entry Page${getLiveHiddenText(tournament2Data?.activePage === true)}
                </label>
            </div>
        </div>
        ${AdminCommon.templates.textareaInput('Description', tournament2Data?.description || '', `updateTournament2('description', this.value)`, 'June 15, 2025\\n8:00 AM - 9:00 AM\\n4-Man Scramble', 'description-textarea')}
    `;
    mainContentContainer.appendChild(mainContentDiv);
    
    // Setup input listeners
    AdminCommon.setupInputListeners();
}

function updateTournament1(field, value) {
    tournament1Data[field] = value;
    AdminCommon.markUnsaved();
}

function updateTournament2(field, value) {
    tournament2Data[field] = value;
    AdminCommon.markUnsaved();
}

// Function to update the live/hidden text when checkbox changes
function updateLiveHiddenText(checkboxId, isChecked) {
    const checkbox = document.getElementById(checkboxId);
    if (checkbox && checkbox.parentNode) {
        const label = checkbox.parentNode;
        // Clear the label content and rebuild it
        while (label.firstChild) {
            label.removeChild(label.firstChild);
        }
        
        // Recreate the checkbox
        const newCheckbox = document.createElement('input');
        newCheckbox.type = 'checkbox';
        newCheckbox.id = checkboxId;
        newCheckbox.checked = isChecked;
        newCheckbox.onchange = function() {
            const tournamentNum = checkboxId === 'activePage1' ? 1 : 2;
            if (tournamentNum === 1) {
                updateTournament1('activePage', this.checked);
            } else {
                updateTournament2('activePage', this.checked);
            }
            updateLiveHiddenText(checkboxId, this.checked);
        };
        
        // Create the text
        const text = document.createTextNode('Show on Tournament Entry Page');
        const statusSpan = document.createElement('span');
        statusSpan.style.color = isChecked ? '#28a745' : '#dc3545';
        statusSpan.style.fontWeight = '600';
        statusSpan.textContent = isChecked ? ' (LIVE)' : ' (HIDDEN)';
        
        // Append everything back to the label
        label.appendChild(newCheckbox);
        label.appendChild(document.createTextNode(' ')); // Add space
        label.appendChild(text);
        label.appendChild(statusSpan);
    }
}

// Save both tournaments
async function saveAllTournaments() {
    try {
        // Get token from localStorage
        const token = localStorage.getItem('adminToken');
        if (!token) {
            alert('Session expired. Please login again.');
            window.location.href = '/admin';
            return;
        }
        
        // Save tournament 1
        const save1Promise = fetch('/api/monthly-tournament', {
            method: 'POST',
            headers: {
                'Content-Type': 'application/json',
                'Authorization': `Bearer ${token}`
            },
            body: JSON.stringify(tournament1Data)
        });
        
        // Save tournament 2
        const save2Promise = fetch('/api/monthly-tournament2', {
            method: 'POST',
            headers: {
                'Content-Type': 'application/json',
                'Authorization': `Bearer ${token}`
            },
            body: JSON.stringify(tournament2Data)
        });
        
        // Wait for both to complete
        const [response1, response2] = await Promise.all([save1Promise, save2Promise]);
        
        // Check responses
        if (!response1.ok) {
            throw new Error(`Tournament 1 save failed: ${response1.statusText}`);
        }
        
        if (!response2.ok) {
            throw new Error(`Tournament 2 save failed: ${response2.statusText}`);
        }
        
        // Clear unsaved changes flag
        AdminCommon.hasUnsavedChanges = false;
        
        alert('Both tournaments saved successfully!');
        
    } catch (error) {
        console.error('Save error:', error);
        alert('Error saving tournaments: ' + error.message);
        
        // Handle token expiration
        if (error.message.includes('403') || error.message.includes('Unauthorized') || error.message.includes('expired')) {
            localStorage.removeItem('adminToken');
            window.location.href = '/admin';
        }
    }
}

window.onload = init;
</script>

<style>
.description-textarea textarea {
    min-height: 200px;
    font-family: monospace;
    line-height: 1.4;
}

.form-row label input[type="checkbox"] {
    width: 18px;
    height: 18px;
    margin: 0;
}

.form-row {
    display: flex;
    gap: 20px;
    margin-bottom: 15px;
}

.form-row > div {
    flex: 1;
}

.input-group {
    margin-bottom: 15px;
}

.input-group label {
    display: block;
    margin-bottom: 5px;
    font-weight: 600;
    color: #333;
}

.input-group input,
.input-group textarea,
.input-group select {
    width: 100%;
    padding: 8px 12px;
    border: 1px solid #ddd;
    border-radius: 4px;
    font-size: 14px;
    box-sizing: border-box;
}

.input-group textarea {
    min-height: 100px;
    resize: vertical;
    font-family: monospace;
}
</style>

</body>
</html>
