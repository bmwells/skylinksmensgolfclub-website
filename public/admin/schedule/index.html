<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<title>Schedule Editor - Skylinks Admin</title>
<link rel="stylesheet" href="/css/admin.css">
<script src="/js/admin-common.js"></script>
<style>
    .status-selector {
        display: flex;
        gap: 10px;
        margin-bottom: 15px;
    }
    
    .status-selector button {
        background: #e9ecef;
        color: #495057;
        flex: 1;
    }
    
    .status-selector button:hover {
        background: #dee2e6;
    }
    
    .status-selector button.active {
        background: #0066cc;
        color: white;
    }
    
    .status-upcoming-btn.active {
        background: #28a745 !important;
    }
    
    .status-past-btn.active {
        background: #ff8c00 !important; /* Orange instead of gray */
        color: white !important;
    }
    
    .event-preview {
        background: #f8f9fa;
        padding: 15px;
        border-radius: 8px;
        margin-top: 20px;
        border: 1px solid #dee2e6;
    }
    
    /* Dark mode styles for event preview */
    @media (prefers-color-scheme: dark) {
        .event-preview {
            background: #2d3748;
            border-color: #4a5568;
            color: #e2e8f0;
        }
        
        .event-preview h4 {
            color: #e2e8f0;
        }
        
        .event-preview div {
            color: #cbd5e0;
        }
        
        /* Fix text input readability in dark mode */
        .input-group label {
            color: #e2e8f0;
        }
        
        .form-row {
            border-bottom-color: #4a5568;
        }
        
        .section-header h3 {
            color: #e2e8f0;
        }
        
        /* Status selector buttons in dark mode */
        .status-selector button {
            background: #4a5568;
            color: #e2e8f0;
            border: 1px solid #718096;
        }
        
        .status-selector button:hover {
            background: #718096;
        }
        
        .status-upcoming-btn.active {
            background: #38a169 !important;
            border-color: #38a169;
        }
        
        .status-past-btn.active {
            background: #ed8936 !important; /* Dark mode orange */
            border-color: #ed8936;
        }
        
        /* Text input styles for dark mode */
        input[type="text"], textarea {
            background: #2d3748;
            border-color: #4a5568;
            color: #e2e8f0;
        }
        
        input[type="text"]:focus, textarea:focus {
            border-color: #63b3ed;
            background: #2d3748;
            color: #e2e8f0;
        }
        
        input[type="text"]::placeholder, textarea::placeholder {
            color: #a0aec0;
        }
        
        /* Delete button in dark mode */
        .delete-btn {
            background: #c53030;
            color: white;
        }
        
        .delete-btn:hover {
            background: #e53e3e;
        }
        
        /* Bullet point buttons in dark mode */
        .bullet-point-btn {
            background: #4a5568;
            color: #e2e8f0;
            border: 1px solid #718096;
        }
        
        .bullet-point-btn:hover {
            background: #718096;
        }
        
        /* Select dropdown in dark mode */
        select {
            background: #2d3748;
            border-color: #4a5568;
            color: #e2e8f0;
        }
        
        select option {
            background: #2d3748;
            color: #e2e8f0;
        }
    }
    
    .event-preview h4 {
        margin-top: 0;
        color: #495057;
    }
    
    .bullet-point-btn {
        background: #6c757d;
        color: white;
        border: none;
        border-radius: 4px;
        padding: 4px 12px;
        cursor: pointer;
        font-size: 0.9rem;
        margin-right: 5px;
    }
    
    .bullet-point-btn:hover {
        background: #5a6268;
    }
    
    .details-list {
        background: white;
        border: 1px solid #ddd;
        border-radius: 4px;
        padding: 10px;
        min-height: 200px;
        max-height: 400px;
        overflow-y: auto;
        font-family: monospace;
        font-size: 0.9rem;
        line-height: 1.4;
    }
    
    .details-list div {
        margin-bottom: 5px;
        padding: 2px 0;
    }
    
    .details-list .bullet-line {
        margin-left: 20px;
    }
    
    .date-inputs {
        display: flex;
        gap: 10px;
        margin-bottom: 15px;
    }
    
    .date-inputs input {
        flex: 1;
    }
</style>
</head>
<body>

<div class="header">
  <h1>Schedule Editor</h1>
  <div>
    <button onclick="AdminCommon.checkUnsavedChanges()">← Back to Admin</button>
  </div>
</div>

<div class="controls">
  <button onclick="addEvent()">📅 Add New Event</button>
  <button onclick="AdminCommon.saveWithAlert()" style="background: #28a745;">💾 Save Changes</button>
</div>

<!-- Schedule Section -->
<div id="events"></div>

<script>
// Make render globally accessible
window.render = render;

function init() {
  if (AdminCommon.init('schedule', [])) {
    loadEvents();
  }
}

function loadEvents() {
  AdminCommon.load().then((data) => {
    // Store events in AdminCommon.data
    AdminCommon.data = Array.isArray(data) ? data : [];
    AdminCommon.originalData = JSON.parse(JSON.stringify(AdminCommon.data));
    
    // Sort events when loading
    sortEventsByDate();
    render();
    // Setup input listeners after render
    AdminCommon.setupInputListeners();
  }).catch(err => {
    alert('Error loading schedule: ' + err.message);
  });
}

function sortEventsByDate() {
  AdminCommon.data.sort((a, b) => {
    const dateA = parseDateForSorting(a);
    const dateB = parseDateForSorting(b);
    const now = new Date();
    
    // Both events are upcoming
    if (a.status === 'upcoming' && b.status === 'upcoming') {
      // Sort by date ascending (closest future first)
      return dateA - dateB;
    }
    
    // Both events are past
    if (a.status === 'past' && b.status === 'past') {
      // Sort by date descending (most recent past first)
      return dateB - dateA;
    }
    
    // One is upcoming, one is past - upcoming should come first
    if (a.status === 'upcoming' && b.status === 'past') {
      return -1;
    }
    if (a.status === 'past' && b.status === 'upcoming') {
      return 1;
    }
    
    // Default fallback (sort by date for same status)
    return dateA - dateB;
  });
}

// Helper function to extract day number from display day (handles ranges like "16-17")
function getSortingDay(displayDay) {
  if (!displayDay) return 0;
  
  // If it's a range like "16-17" or "9-10", take the first number
  const rangeMatch = displayDay.match(/^(\d+)/);
  if (rangeMatch) {
    return parseInt(rangeMatch[1], 10);
  }
  
  // If it's just a single number
  const singleMatch = displayDay.match(/\d+/);
  return singleMatch ? parseInt(singleMatch[0], 10) : 0;
}

// Improved getMonthIndex to handle full month names
function getMonthIndex(monthAbbr) {
  if (!monthAbbr) return 0;
  
  const monthMap = {
    'jan': 0, 'january': 0,
    'feb': 1, 'february': 1,
    'mar': 2, 'march': 2,
    'apr': 3, 'april': 3,
    'may': 4,
    'jun': 5, 'june': 5,
    'jul': 6, 'july': 6,
    'aug': 7, 'august': 7,
    'sep': 8, 'september': 8,
    'oct': 9, 'october': 9,
    'nov': 10, 'november': 10,
    'dec': 11, 'december': 11
  };
  
  const shortMonth = monthAbbr.toLowerCase().substring(0, 3);
  return monthMap[shortMonth] !== undefined ? monthMap[shortMonth] : 0;
}

// Simpler, more robust parseDateForSorting function
function parseDateForSorting(event) {
  // Try to get year from date string first
  let year = new Date().getFullYear();
  const yearMatch = event.date?.match(/\b(\d{4})\b/);
  if (yearMatch) {
    year = parseInt(yearMatch[1]);
  }
  
  // Get month index from displayDate.month or date string
  let monthIndex = 0;
  if (event.displayDate?.month) {
    monthIndex = getMonthIndex(event.displayDate.month);
  } else if (event.date) {
    // Extract month from date string
    const monthMatch = event.date.match(/^(\w+)/i);
    if (monthMatch) {
      monthIndex = getMonthIndex(monthMatch[1]);
    }
  }
  
  // Get day from displayDate.day or date string
  let dayNum = 1;
  if (event.displayDate?.day) {
    dayNum = getSortingDay(event.displayDate.day);
  } else if (event.date) {
    // Extract first day number from date string
    const dayMatch = event.date.match(/\b(\d+)(?:-\d+)?\b/);
    if (dayMatch) {
      dayNum = parseInt(dayMatch[1]);
    }
  }
  
  // For upcoming events that appear to be in the past, check if they should be next year
  const now = new Date();
  const parsedDate = new Date(year, monthIndex, dayNum);
  
  if (event.status === 'upcoming' && parsedDate < now) {
    // Check if this is likely the same event next year
    // (e.g., it's currently December and we have a January event)
    if (parsedDate.getMonth() < now.getMonth() || 
        (parsedDate.getMonth() === now.getMonth() && parsedDate.getDate() < now.getDate())) {
      return new Date(year + 1, monthIndex, dayNum);
    }
  }
  
  return parsedDate;
}

function render() {
  const eventsContainer = document.getElementById('events');
  eventsContainer.innerHTML = '';
  
  const noteDiv = document.createElement('div');
  eventsContainer.appendChild(noteDiv);
  
  AdminCommon.data.forEach((event, eventIndex) => {
    const eventDiv = document.createElement('div');
    eventDiv.className = 'row';
    eventDiv.setAttribute('data-index', eventIndex);
    
    // Full edit view
    eventDiv.draggable = false;
    
    // Parse display date
    const displayMonth = event.displayDate?.month || '';
    const displayDay = event.displayDate?.day || '';
    
    // Parse details array into text
    const detailsText = event.details ? event.details.join('\n') : '';
    
    // Full edit view
    const html = `
      <div class="section-header">
        <h3>${event.title} - ${event.date}</h3>
        <div>
          ${AdminCommon.templates.deleteButton(`deleteEvent(${eventIndex})`, 'Delete', true)}
        </div>
      </div>
      
      <div class="form-row">
        <div style="flex: 2;">
          ${AdminCommon.templates.textInput('Event Title', event.title, `updateEvent(${eventIndex}, 'title', this.value)`, 'e.g., Christmas Schamble')}
        </div>
        <div style="flex: 1;">
          ${AdminCommon.templates.textInput('Full Date', event.date, `updateEvent(${eventIndex}, 'date', this.value)`, 'e.g., December 14, 2025')}
        </div>
      </div>
      
      <div class="form-row">
        <div style="flex: 1;">
          ${AdminCommon.templates.textInput('Display Month (Short)', displayMonth, `updateDisplayDate(${eventIndex}, 'month', this.value)`, 'e.g., Dec')}
        </div>
        <div style="flex: 1;">
          ${AdminCommon.templates.textInput('Display Day', displayDay, `updateDisplayDate(${eventIndex}, 'day', this.value)`, 'e.g., 14 or 16-17')}
        </div>
        <div style="flex: 2;">
          ${AdminCommon.templates.textInput('Time Range', event.timeRange, `updateEvent(${eventIndex}, 'timeRange', this.value)`, 'e.g., 7:00 AM - 8:00 AM (Shotgun Start)')}
        </div>
      </div>
      
      <div class="form-row">
        <div style="flex: 1;">
          ${AdminCommon.templates.textInput('Image URL', event.imageUrl, `updateEvent(${eventIndex}, 'imageUrl', this.value)`, 'URL for event thumbnail')}
        </div>
        <div style="flex: 1;">
          ${AdminCommon.templates.textInput('Entry Fee', event.entryFee, `updateEvent(${eventIndex}, 'entryFee', this.value)`, 'e.g., $84 + $25 side pots')}
        </div>
        <div style="flex: 1;">
          ${AdminCommon.templates.textInput('Format', event.format, `updateEvent(${eventIndex}, 'format', this.value)`, 'e.g., 4-Man Shamble')}
        </div>
      </div>
      
      <div class="input-group">
        <div class="status-selector">
          <button onclick="setEventStatus(${eventIndex}, 'upcoming')" class="status-upcoming-btn ${event.status === 'upcoming' ? 'active' : ''}">
            🟢 Upcoming Event
          </button>
          <button onclick="setEventStatus(${eventIndex}, 'past')" class="status-past-btn ${event.status === 'past' ? 'active' : ''}">
            ⚫ Past Event
          </button>
        </div>
      </div>
      
      <div class="input-group">
        <label>Event Details (One per line, use • for bullet points)</label>
        <div style="margin-bottom: 10px;">
          <button onclick="addBulletLine(${eventIndex})" class="bullet-point-btn">• Add Bullet Point</button>
          <button onclick="addSubBulletLine(${eventIndex})" class="bullet-point-btn">  • Add Sub-bullet</button>
          <button onclick="addEmptyLine(${eventIndex})" class="bullet-point-btn">📝 Add Empty Line</button>
        </div>
        <textarea 
          oninput="updateDetails(${eventIndex}, this.value)"
          placeholder="Enter event details here. Each line will be displayed separately. Use • for bullet points."
          style="min-height: 300px; font-family: monospace; line-height: 1.4; white-space: pre;"
        >${AdminCommon.escapeHtml(detailsText)}</textarea>
      </div>
      
      <div class="form-row">
        <div style="flex: 2;">
          ${AdminCommon.templates.textInput('Google Calendar Link', event.googleCalendarLink, `updateEvent(${eventIndex}, 'googleCalendarLink', this.value)`, 'Full Google Calendar URL')}
        </div>
      </div>
      
      <div class="form-row">
        <div style="flex: 2;">
          ${AdminCommon.templates.textInput('Signup Deadline Text', event.signupDeadline, `updateEvent(${eventIndex}, 'signupDeadline', this.value)`, 'e.g., midnight Wednesday December 3rd, 2025')}
        </div>
        <div style="flex: 1;">
          <div class="input-group">
            <label>Deadline Status</label>
            <select onchange="updateEvent(${eventIndex}, 'isPastDeadline', this.value === 'true')">
              <option value="false" ${!event.isPastDeadline ? 'selected' : ''}>Open / Upcoming</option>
              <option value="true" ${event.isPastDeadline ? 'selected' : ''}>Past Deadline</option>
            </select>
          </div>
        </div>
      </div>
      
      <div class="event-preview">
        <h4>Preview:</h4>
        <div><strong>${event.title}</strong> - ${event.date}</div>
        <div>Status: ${event.status === 'upcoming' ? '🟢 Upcoming' : '⚫ Past'}</div>
        <div>Display: ${displayMonth} ${displayDay}</div>
        <div>Time: ${event.timeRange}</div>
      </div>
    `;
    
    eventDiv.innerHTML = html;
    eventsContainer.appendChild(eventDiv);
  });
  
  // Re-setup input listeners after rendering new inputs
  AdminCommon.setupInputListeners();
}

function updateEvent(eventIndex, field, value) {
  AdminCommon.updateItem(eventIndex, field, value);
  // Resort if date or status changed
  if (field === 'date' || field === 'status' || field === 'displayDate') {
    sortEventsByDate();
    render();
  }
}

function updateDisplayDate(eventIndex, field, value) {
  if (!AdminCommon.data[eventIndex].displayDate) {
    AdminCommon.data[eventIndex].displayDate = {};
  }
  AdminCommon.data[eventIndex].displayDate[field] = value;
  AdminCommon.markUnsaved();
  sortEventsByDate();
  render();
}

function updateDetails(eventIndex, value) {
  // Split by newlines to create array
  const detailsArray = value.split('\n').map(line => line.trimEnd());
  AdminCommon.data[eventIndex].details = detailsArray;
  AdminCommon.markUnsaved();
}

function setEventStatus(eventIndex, status) {
  AdminCommon.data[eventIndex].status = status;
  AdminCommon.markUnsaved();
  sortEventsByDate();
  render();
}

function addBulletLine(eventIndex) {
  const textarea = document.querySelector(`.row[data-index="${eventIndex}"] textarea`);
  if (!textarea) return;
  
  const cursorPos = textarea.selectionStart;
  const currentValue = textarea.value;
  const newValue = currentValue.substring(0, cursorPos) + '• ' + currentValue.substring(cursorPos);
  
  textarea.value = newValue;
  updateDetails(eventIndex, newValue);
  
  // Set cursor position after bullet
  setTimeout(() => {
    textarea.focus();
    textarea.setSelectionRange(cursorPos + 2, cursorPos + 2);
  }, 10);
}

function addSubBulletLine(eventIndex) {
  const textarea = document.querySelector(`.row[data-index="${eventIndex}"] textarea`);
  if (!textarea) return;
  
  const cursorPos = textarea.selectionStart;
  const currentValue = textarea.value;
  const newValue = currentValue.substring(0, cursorPos) + '  • ' + currentValue.substring(cursorPos);
  
  textarea.value = newValue;
  updateDetails(eventIndex, newValue);
  
  // Set cursor position after bullet
  setTimeout(() => {
    textarea.focus();
    textarea.setSelectionRange(cursorPos + 4, cursorPos + 4);
  }, 10);
}

function addEmptyLine(eventIndex) {
  const textarea = document.querySelector(`.row[data-index="${eventIndex}"] textarea`);
  if (!textarea) return;
  
  const cursorPos = textarea.selectionStart;
  const currentValue = textarea.value;
  const newValue = currentValue.substring(0, cursorPos) + '\n' + currentValue.substring(cursorPos);
  
  textarea.value = newValue;
  updateDetails(eventIndex, newValue);
  
  // Set cursor position on new line
  setTimeout(() => {
    textarea.focus();
    textarea.setSelectionRange(cursorPos + 1, cursorPos + 1);
  }, 10);
}

function addEvent() {
  const currentDate = new Date();
  const monthNames = ['Jan', 'Feb', 'Mar', 'Apr', 'May', 'Jun', 'Jul', 'Aug', 'Sep', 'Oct', 'Nov', 'Dec'];
  const monthName = monthNames[currentDate.getMonth()];
  
  AdminCommon.addItem({
    id: 'new-event-' + Date.now(),
    title: 'New Tournament',
    date: `${monthName} ${currentDate.getDate()}, ${currentDate.getFullYear()}`,
    displayDate: {
      month: monthName,
      day: currentDate.getDate().toString()
    },
    timeRange: '6:00 AM - 3:00 PM',
    imageUrl: '',
    status: 'upcoming',
    details: ['Event details go here...'],
    googleCalendarLink: '',
    signupDeadline: 'midnight Tuesday before the event',
    isPastDeadline: false,
    entryFee: '$84 + $25 side pots',
    format: 'Individual Stroke Play'
  });
  sortEventsByDate();
  render();
}

function deleteEvent(eventIndex) {
  if (AdminCommon.deleteItem(eventIndex, 'Are you sure you want to delete this event?')) {
    render();
  }
}

window.onload = init;
</script>
</body>
</html>
