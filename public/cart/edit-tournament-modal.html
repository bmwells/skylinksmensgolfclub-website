<!-- edit-tournament-modal.html -->
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="/css/product.css" />

    <script>
        // Store tooltip state globally
        let activeTooltip = null;
        let activeTooltipButton = null;
        
        // Store tournament data for this modal
        let tournamentData = null;

        function formatPhoneNumber(value) {
            const numbers = value.replace(/\D/g, '');
            if (numbers.length === 0) return '';
            if (numbers.length <= 3) return `(${numbers}`;
            if (numbers.length <= 6) return `(${numbers.slice(0, 3)}) ${numbers.slice(3)}`;
            return `(${numbers.slice(0, 3)}) ${numbers.slice(3, 6)}-${numbers.slice(6, 10)}`;
        }

        function setupPhoneFormatting() {
            document.querySelectorAll('input[id*="phone"]').forEach(input => {
                if (input.value) input.value = formatPhoneNumber(input.value);
                input.addEventListener('input', function(e) {
                    const cursorPosition = this.selectionStart;
                    const originalLength = this.value.length;
                    
                    this.value = formatPhoneNumber(this.value);
                    
                    const newLength = this.value.length;
                    const lengthDifference = newLength - originalLength;
                    const newCursorPosition = cursorPosition + lengthDifference;
                    
                    this.setSelectionRange(newCursorPosition, newCursorPosition);
                });
                
                // Only allow numbers and navigation keys
                input.addEventListener('keydown', function(e) {
                    // Allow navigation keys, delete, backspace, tab
                    if ([8, 9, 13, 37, 38, 39, 40, 46].includes(e.keyCode)) {
                        return;
                    }
                    
                    // Allow numbers only
                    if (!/\d/.test(e.key)) {
                        e.preventDefault();
                    }
                });
            });
        }

        function setupGHINFormatting() {
            document.querySelectorAll('input[id*="ghin"]').forEach(input => {
                if (input.value) input.value = input.value.replace(/\D/g, '').slice(0, 8);
                input.addEventListener('input', () => {
                    input.value = input.value.replace(/\D/g, '').slice(0, 8);
                });
                
                // Only allow numbers and navigation keys
                input.addEventListener('keydown', function(e) {
                    // Allow navigation keys, delete, backspace, tab
                    if ([8, 9, 13, 37, 38, 39, 40, 46].includes(e.keyCode)) {
                        return;
                    }
                    
                    // Allow numbers only
                    if (!/\d/.test(e.key)) {
                        e.preventDefault();
                    }
                });
            });
        }
        
        // Enhanced name validation for all name inputs in edit modal
        function setupEditModalNameValidation() {
            const nameInputs = document.querySelectorAll('#edit-modal-form input[id*="name"]');
            
            nameInputs.forEach(input => {
                // Real-time character filtering
                input.addEventListener('input', function(e) {
                    // Get current value and cursor position
                    const cursorPos = this.selectionStart;
                    const originalValue = this.value;
                    
                    // Remove any characters that aren't allowed
                    // Allow: letters, spaces, hyphens, apostrophes
                    let newValue = originalValue.replace(/[^A-Za-zÀ-ÖØ-öø-ÿ'\-\s]/g, '');
                    
                    // Remove extra spaces (only allow single spaces between words)
                    newValue = newValue.replace(/\s+/g, ' ').trim();
                    
                    // Limit to two words maximum
                    const words = newValue.split(' ');
                    if (words.length > 2) {
                        newValue = words.slice(0, 2).join(' ');
                    }
                    
                    // Update value if changed
                    if (newValue !== originalValue) {
                        this.value = newValue;
                        
                        // Restore cursor position (adjust for removed characters)
                        const diff = newValue.length - originalValue.length;
                        this.setSelectionRange(cursorPos + diff, cursorPos + diff);
                    }
                });
                
                // Prevent typing invalid characters
                input.addEventListener('keydown', function(e) {
                    // Allow control keys
                    if (e.ctrlKey || e.metaKey || 
                        e.key === 'Backspace' || e.key === 'Delete' || 
                        e.key === 'Tab' || e.key === 'Enter' || 
                        e.key === 'ArrowLeft' || e.key === 'ArrowRight' ||
                        e.key === 'ArrowUp' || e.key === 'ArrowDown' ||
                        e.key === 'Home' || e.key === 'End') {
                        return;
                    }
                    
                    // Only allow: letters, space, hyphen, apostrophe
                    const allowedChars = /^[A-Za-zÀ-ÖØ-öø-ÿ'\- ]$/;
                    if (!allowedChars.test(e.key)) {
                        e.preventDefault();
                    }
                    
                    // Prevent more than one space in a row
                    if (e.key === ' ') {
                        const cursorPos = this.selectionStart;
                        const beforeCursor = this.value.substring(0, cursorPos);
                        if (beforeCursor.endsWith(' ') || beforeCursor.length === 0) {
                            e.preventDefault();
                        }
                    }
                });
                
                // For required name fields, enforce exactly two words on blur
                if (input.hasAttribute('required')) {
                    input.addEventListener('blur', function() {
                        const words = this.value.trim().split(/\s+/);
                        
                        if (words.length !== 2) {
                            // Show error
                            this.style.borderColor = '#ff4444';
                            
                            // Create or update error message
                            let errorMsg = this.parentNode.querySelector('.name-error');
                            if (!errorMsg) {
                                errorMsg = document.createElement('div');
                                errorMsg.className = 'name-error';
                                errorMsg.style.color = '#ff4444';
                                errorMsg.style.fontSize = '0.85rem';
                                errorMsg.style.marginTop = '5px';
                                this.parentNode.appendChild(errorMsg);
                            }
                            
                            if (words.length === 1) {
                                errorMsg.textContent = 'Please enter both first and last name';
                            } else if (words.length > 2) {
                                errorMsg.textContent = 'Please enter only first and last name';
                            } else if (words.length === 0) {
                                errorMsg.textContent = 'Name is required';
                            }
                        } else {
                            // Clear error
                            this.style.borderColor = '#ddd';
                            const errorMsg = this.parentNode.querySelector('.name-error');
                            if (errorMsg) {
                                errorMsg.remove();
                            }
                        }
                    });
                    
                    // Clear error on focus
                    input.addEventListener('focus', function() {
                        this.style.borderColor = '#ddd';
                        const errorMsg = this.parentNode.querySelector('.name-error');
                        if (errorMsg) {
                            errorMsg.remove();
                        }
                    });
                }
            });
        }

        // Function to create and show tooltip
        function showTooltip(event, text) {
            const button = event.currentTarget;
            
            // If clicking the same button again, close the tooltip
            if (activeTooltipButton === button && activeTooltip) {
                activeTooltip.remove();
                activeTooltip = null;
                activeTooltipButton = null;
                return;
            }
            
            // Remove any existing tooltips
            const existingTooltips = document.querySelectorAll('.tooltip-popup');
            existingTooltips.forEach(tooltip => tooltip.remove());
            
            // Create new tooltip
            const tooltip = document.createElement('div');
            tooltip.className = 'tooltip-popup';
            tooltip.textContent = text;
            
            // Get the button that was clicked
            const rect = button.getBoundingClientRect(); // Viewport-relative position
            
            // Position tooltip relative to viewport (ignores scroll)
            // Place tooltip below the button
            const topPosition = rect.bottom + 10; // 10px below button (viewport coordinates)
            
            // Adjust horizontal positioning to center tooltip under button
            const tooltipWidth = 300; // max-width
            const buttonCenter = rect.left + (rect.width / 2);
            const adjustedLeft = Math.max(
                10, 
                Math.min(
                    buttonCenter - (tooltipWidth / 2), 
                    window.innerWidth - tooltipWidth - 10
                )
            );
            
            tooltip.style.top = `${topPosition}px`;
            tooltip.style.left = `${adjustedLeft}px`;
            
            document.body.appendChild(tooltip);
            
            // Store references to active tooltip
            activeTooltip = tooltip;
            activeTooltipButton = button;
            
            // Function to close tooltip
            function closeTooltip() {
                if (tooltip.parentNode) {
                    tooltip.remove();
                    activeTooltip = null;
                    activeTooltipButton = null;
                }
                // Remove event listeners
                document.removeEventListener('pointerdown', handleOutsideClick, true);
                document.removeEventListener('keydown', handleEscapeKey);
            }
            
            // Handle click outside
            function handleOutsideClick(e) {
                if (!tooltip.contains(e.target) && e.target !== button) {
                    closeTooltip();
                }
            }
            
            // Handle escape key
            function handleEscapeKey(e) {
                if (e.key === 'Escape') {
                    closeTooltip();
                }
            }
            
            // Add event listeners
            document.addEventListener('pointerdown', handleOutsideClick, true);
            document.addEventListener('keydown', handleEscapeKey);
            
            // Auto-close after 5 seconds
            setTimeout(closeTooltip, 5000);
            
            // Prevent the button click from closing the tooltip immediately
            event.stopPropagation();
        }

        function setupEditModalTooltips() {
            // Add click handlers to info icons in the edit modal
            document.querySelectorAll('.info-icon').forEach(icon => {
                // Remove existing listeners by cloning
                const newIcon = icon.cloneNode(true);
                icon.parentNode.replaceChild(newIcon, icon);
                
                // Add click listener
                newIcon.addEventListener('click', function(e) {
                    e.preventDefault();
                    e.stopPropagation();
                    const tooltipText = this.getAttribute('data-tooltip');
                    if (tooltipText) {
                        showTooltip(e, tooltipText);
                    }
                });
            });
        }
        
        // Update modal display based on tournament options
        function updateEditModalBasedOnTournament() {
            if (!tournamentData) return;
            
            // Show/hide cart option dropdown based on tournament data
            const cartOptionContainer = document.getElementById('cart-option-container');
            const cartOptionSelect = document.getElementById('cart-option');
            
            if (cartOptionContainer && cartOptionSelect) {
                if (tournamentData.cartOption === true) {
                    cartOptionContainer.style.display = 'block';
                } else {
                    cartOptionContainer.style.display = 'none';
                }
            }
            
            // Show/hide addon options container based on tournament options
            const addonContainer = document.getElementById('addon-options-container');
            if (addonContainer) {
                const hasSidePotOption = tournamentData.sidePotOption !== false; // Default to true if not set
                const hasRouletteOption = tournamentData.rouletteOption !== false; // Default to true if not set
                
                if (hasSidePotOption || hasRouletteOption) {
                    addonContainer.style.display = 'block';
                    
                    // Show/hide individual options
                    const sidePotContainer = document.getElementById('side-pot-option-container');
                    const rouletteContainer = document.getElementById('roulette-option-container');
                    
                    if (sidePotContainer) {
                        sidePotContainer.style.display = hasSidePotOption ? 'flex' : 'none';
                    }
                    if (rouletteContainer) {
                        rouletteContainer.style.display = hasRouletteOption ? 'flex' : 'none';
                    }
                } else {
                    addonContainer.style.display = 'none';
                }
            }
        }
        
        // Update prices in edit modal
        function updateEditModalPrices() {
            // Update price displays in modal with dynamic data
            const roulettePriceEl = document.getElementById('roulette-price');
            const sidePotPriceEl = document.getElementById('side-pot-price');
            
            if (tournamentData) {
                const roulettePrice = parseFloat(tournamentData.roulette) || 30;
                const sidePotPrice = parseFloat(tournamentData.sidePot) || 25;
                
                if (roulettePriceEl) {
                    roulettePriceEl.textContent = '$' + roulettePrice.toFixed(2);
                }
                if (sidePotPriceEl) {
                    sidePotPriceEl.textContent = '$' + sidePotPrice.toFixed(2);
                }
            }
        }
        
        // Set tournament data for edit modal
        function setTournamentDataForEditModal(data) {
            tournamentData = data;
            updateEditModalPrices();
            updateEditModalBasedOnTournament();
        }

        document.addEventListener('DOMContentLoaded', function() {
            setupPhoneFormatting();
            setupGHINFormatting();
            setupEditModalNameValidation();
            setupEditModalTooltips();
            
            if (typeof initMemberAutocomplete === 'function') {
                initMemberAutocomplete();
            }
            
            // Fix for top save button - prevent double submission
            const topSaveBtn = document.getElementById('modal-save-top');
            const bottomSaveBtn = document.getElementById('modal-save');
            const form = document.getElementById('edit-modal-form');
            
            if (topSaveBtn && bottomSaveBtn && form) {
                // Change top button to type="button" to prevent form submission
                topSaveBtn.type = 'button';
                
                // When top button is clicked, trigger form validation and submission
                topSaveBtn.addEventListener('click', function (e) {
                    e.preventDefault();
                    
                    // First, trigger form validation
                    if (form.checkValidity()) {
                        // If form is valid, submit it programmatically
                        form.requestSubmit(bottomSaveBtn);
                    } else {
                        // If form is invalid, show validation messages
                        form.reportValidity();
                    }
                });
                
                // Add form submission handler
                form.addEventListener('submit', function(e) {
                    e.preventDefault();
                    // Handle the form submission
                    console.log('Form submitted with data:', {
                        name: document.getElementById('modal-name').value,
                        email: document.getElementById('modal-email').value,
                        phone: document.getElementById('modal-phone').value,
                        ghin: document.getElementById('modal-ghin').value,
                    });
                });
            }
            
            // Add cancel button handler
            const cancelBtn = document.getElementById('modal-close-2');
            if (cancelBtn) {
                cancelBtn.addEventListener('click', function() {
                    // Close the modal - in a real implementation, you would have a modal close function
                    console.log('Modal cancelled');
                    // document.getElementById('edit-modal').style.display = 'none';
                });
            }
            
            // Check if tournament data is passed from parent window
            if (window.opener && window.opener.tournamentData) {
                setTournamentDataForEditModal(window.opener.tournamentData);
            }
        });
        
        // Make the setTournamentData function available globally
        window.setTournamentDataForEditModal = setTournamentDataForEditModal;
    </script>
    
    <style>
        /* Name error styling */
        .name-error {
            color: #ff4444;
            font-size: 0.85rem;
            margin-top: 5px;
        }
        
        /* Top save button styling */
        .top-save-button {
            position: absolute;
            top: 20px;
            right: 20px;
            background: black;
            color: white;
            border: none;
            padding: 10px 20px;
            border-radius: 6px;
            cursor: pointer;
            font-weight: 600;
            z-index: 10;
        }
        
        .top-save-button:hover {
            background: #45a049;
        }
    </style>
</head>

<body>
<div class="edit-modal-backdrop" id="edit-modal">
<div class="edit-modal" role="dialog" aria-modal="true">

<form id="edit-modal-form">

    <button id="modal-save-top" class="top-save-button" type="button">
        Save Changes
    </button>

    <div style="display:flex; align-items:center; margin-bottom: 25px;">
        <h3 style="margin:0;">Edit Tournament Details</h3>
    </div>

    <!-- Primary Player -->
    <h4 style="margin: 0 0 15px 0; font-size: 1.1rem;">Primary Player</h4>
    <div class="row">
        <div class="col">
            <label for="modal-name">Player 1 Name *</label>
            <div class="input-wrapper">
                <input id="modal-name" placeholder="First and Last Name" required autocomplete="off" 
                       pattern="^[A-Za-zÀ-ÖØ-öø-ÿ'\-]{2,30}\s+[A-Za-zÀ-ÖØ-öø-ÿ'\-]{2,30}$"
                       title="Enter exactly two names (first and last). Only letters, hyphens, and apostrophes allowed. Each name must be 2-30 characters." />

                    <div class="spinner"></div>
                </div>
            </div>
        </div>
    </div>
    
    <div class="row">
        <div class="col">
            <label for="modal-email">Email *</label>
            <input id="modal-email" type="email" required />
        </div>
        <div class="col">
            <label for="modal-phone">Phone</label>
            <input id="modal-phone" maxlength="14" />
        </div>
    </div>

    <div class="row">
        <div class="col">
            <label for="modal-ghin">GHIN # *</label>
            <input id="modal-ghin" required maxlength="8" pattern="\d{1,8}" />
        </div>
    </div>
    
    <!-- Optional Add-ons - CONDITIONAL -->
    <div class="row" id="addon-options-container" style="display: block;">
        <div class="col" style="display: flex; gap: 30px; align-items: center; margin-top: 15px; flex-wrap: wrap;">
            <!-- Side Pot Option (Conditional) -->
            <div id="side-pot-option-container" style="display: flex; align-items: center;">
                <input type="checkbox" id="side-pots" name="side-pots" style="width: 18px; height: 18px;">
                <label for="side-pots" style="margin-left: 8px; font-weight: normal; font-size: 0.95rem;">
                    Side Pots (<span id="side-pot-price">$25</span>)
                </label>
                <!-- ADDED INFO BUTTON -->
                <button type="button" class="info-icon" data-tooltip="Gross, Net Skins & Polies" aria-label="Side pots information">
                    &#9432;
                </button>
            </div>
            
            <!-- Roulette Option (Conditional) -->
            <div id="roulette-option-container" style="display: flex; align-items: center;">
                <input type="checkbox" id="roulette" name="roulette" style="width: 18px; height: 18px;">
                <label for="roulette" style="margin-left: 8px; font-weight: normal; font-size: 0.95rem;">
                    Roulette (<span id="roulette-price">$30</span>)
                </label>
                <!-- ADDED INFO BUTTON -->
                <button type="button" class="info-icon" data-tooltip="Holes 1-3, 4-6, 7-9, 10-12, 13-15, 16-18. First 6, Middle 6, Last 6, Front 9, Back 9, Easiest 4 Holes, and Hardest 4 Holes." aria-label="Roulette information">
                    &#9432;
                </button>
            </div>
        </div>
    </div>
    
    <!-- Cart Option Dropdown (Conditional) -->
    <div id="cart-option-container" style="margin-top: 15px;">
        <div class="row">
            <div class="col">
                <label for="cart-option">Cart Option</label>
                <select id="cart-option" style="width: 100%; padding: 12px 15px; border: 1px solid #ddd; border-radius: 6px; font-size: 1rem;">
                    <option value="" disabled selected>Select cart option</option>
                    <option value="Walking">Walking</option>
                    <option value="Cart">Cart ($9.00)</option>
                </select>
            </div>
        </div>
    </div>
    <!-- /Cart Option Dropdown -->
    
    <!-- Additional Players -->
    <h4 style="margin: 30px 0 15px 0; font-size: 1.1rem;">Additional Players (Optional)</h4>
    
    <!-- Player 2 -->
    <div class="additional-player-section">
        <h5 style="margin: 0 0 10px 0; font-size: 1rem; color: #555;">Player #2</h5>
        <div class="row">
            <div class="col">
                <label for="modal-name2">Name</label>
                <div class="input-wrapper">
                    <input id="modal-name2" placeholder="First and Last Name" autocomplete="off" 
                           pattern="^[A-Za-zÀ-ÖØ-öø-ÿ'\-]{2,30}\s+[A-Za-zÀ-ÖØ-öø-ÿ'\-]{2,30}$"
                           title="Enter exactly two names (first and last). Only letters, hyphens, and apostrophes allowed. Each name must be 2-30 characters." />
                    <div class="loading-spinner" id="name2-loading" style="display: none;">
                        <div class="spinner"></div>
                    </div>
                </div>
            </div>
        </div>
        
        <div class="row">
            <div class="col">
                <label for="modal-email2">Email</label>
                <input id="modal-email2" type="email" />
            </div>
            <div class="col">

        </div>

        <div class="row">
            <div class="col">
                <label for="modal-ghin2">GHIN #</label>
                <input id="modal-ghin2" maxlength="8" pattern="\d{1,8}" />
            </div>
        </div>
    </div>
    
    <!-- Player 3 -->
    <div class="additional-player-section">
        <h5 style="margin: 0 0 10px 0; font-size: 1rem; color: #555;">Player #3</h5>
        <div class="row">
            <div class="col">
                <label for="modal-name3">Name</label>
                <div class="input-wrapper">
                    <input id="modal-name3" placeholder="First and Last Name" autocomplete="off" 
                           pattern="^[A-Za-zÀ-ÖØ-öø-ÿ'\-]{2,30}\s+[A-Za-zÀ-ÖØ-öø-ÿ'\-]{2,30}$"

        <div class="row">

            </div>
            <div class="col">
                <label for="modal-phone3">Phone</label>
                <input id="modal-phone3" maxlength="14" />
            </div>
        </div>

        <div class="row">
            <div class="col">
                <label for="modal-ghin3">GHIN #</label>

    <!-- Player 4 -->
    <div class="additional-player-section">
        <h5 style="margin: 0 0 10px 0; font-size: 1rem; color: #555;">Player #4</h5>
        <div class="row">
            <div class="col">
                <label for="modal-name4">Name</label>
                <div class="input-wrapper">
                    <input id="modal-name4" placeholder="First and Last Name" autocomplete="off" 
                           pattern="^[A-Za-zÀ-ÖØ-öø-ÿ'\-]{2,30}\s+[A-Za-zÀ-ÖØ-öø-ÿ'\-]{2,30}$"
                           title="Enter exactly two names (first and last). Only letters, hyphens, and apostrophes allowed. Each name must be 2-30 characters." />
                    <div class="loading-spinner" id="name4-loading" style="display: none;">
                        <div class="spinner"></div>
                    </div>
                </div>
            </div>
        </div>
        
        <div class="row">
            <div class="col">
                <label for="modal-email4">Email</label>
                <input id="modal-email4" type="email" />
            </div>
            <div class="col">
                <label for="modal-phone4">Phone</label>
                                <input id="modal-phone4" maxlength="14" />
            </div>
        </div>

        <div class="row">
            <div class="col">
                <label for="modal-ghin4">GHIN #</label>
                <input id="modal-ghin4" maxlength="8" pattern="\d{1,8}" />

    </div>
    
    <!-- Starting Time Selection -->
    <div class="row" style="margin-top: 20px;">
        <div class="col">
            <label for="starting-time">Requested Starting Time *</label>
            <select id="starting-time" required>
                <option value="">Select a starting time</option>
                <option value="6am">6am</option>
                <option value="7am">7am</option>
                <option value="8am">8am</option>
                <option value="9am">9am</option>
                <option value="10am">10am</option>
                <option value="11am">11am</option>
                <option value="Doesn't Matter">Doesn't Matter</option>
            </select>
        </div>
    </div>
    
    <div class="modal-footer">
        <p class="required-note">* Required fields</p>
        <div class="actions">
            <button id="modal-close-2" class="btn ghost" type="button">Cancel</button>
            <button id="modal-save" class="btn primary" type="submit">Save Changes</button>
        </div>
    </div>

</form>
</div>
</div>
</body>
</html>
