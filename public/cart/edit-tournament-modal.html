<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Edit Tournament Details</title>
    <link rel="stylesheet" href="/css/product.css" />
    <style>
        .edit-modal-backdrop {
            position: fixed;
            inset: 0;
            background: rgba(0,0,0,0.45);
            display: flex;
            align-items: center;
            justify-content: center;
            z-index: 2000;
            padding-top: 80px;
        }
        
        .edit-modal {
            width: 680px;
            max-width: 95%;
            max-height: 80vh;
            overflow-y: auto;
            background: #fff;
            border-radius: 12px;
            padding: 30px;
            box-shadow: 0 15px 50px rgba(0,0,0,.25);
        }
        
        .edit-modal h3 {
            margin-top: 0;
            margin-bottom: 25px;
            font-size: 1.5rem;
            font-weight: 600;
            color: #000;
        }
        
        .edit-modal label {
            display: block;
            margin-bottom: 8px;
            font-weight: 600;
            color: #333;
            font-size: 0.95rem;
        }
        
        .edit-modal input,
        .edit-modal textarea,
        .edit-modal select {
            width: 100%;
            padding: 12px 15px;
            border: 1px solid #ddd;
            border-radius: 6px;
            margin-bottom: 5px;
            box-sizing: border-box;
            font-size: 1rem;
            transition: border-color 0.2s, box-shadow 0.2s;
        }
        
        .edit-modal .row {
            display: flex;
            gap: 20px;
            margin-bottom: 5px;
        }
        
        .edit-modal .row .col {
            flex: 1;
            position: relative;
            align-items: center;
        }
        
        .edit-modal .modal-footer {
            margin-top: 25px;
            padding-top: 20px;
            border-top: 1px solid #eee;
        }
        
        .edit-modal .actions {
            display: flex;
            gap: 12px;
            justify-content: flex-end;
        }
        
        .additional-player-section {
            margin-bottom: 25px;
            padding: 15px;
            border: 1px solid #eee;
            border-radius: 8px;
            background: #fafafa;
        }
        
        /* Autocomplete styles */
        .autocomplete-container {
            position: fixed;
            background: white;
            border: 1px solid #ddd;
            border-radius: 6px;
            max-height: 300px;
            overflow-y: auto;
            box-shadow: 0 10px 30px rgba(0,0,0,.15);
            z-index: 999999;
        }
        
        .autocomplete-item {
            padding: 12px 15px;
            cursor: pointer;
            border-bottom: 1px solid #f0f0f0;
        }
        
        .autocomplete-item:hover {
            background-color: #f8f9fa;
        }
        
        .autocomplete-item .name {
            font-weight: 500;
            color: #333;
        }
        
        .autocomplete-item .ghin-badge {
            margin-left: 8px;
            font-size: 0.85em;
            color: #666;
            background: #f0f0f0;
            padding: 2px 6px;
            border-radius: 4px;
        }
        
        .no-results {
            padding: 12px 15px;
            color: #999;
            font-style: italic;
            text-align: center;
        }
        
        /* Input wrapper for loading spinner */
        .input-wrapper {
            position: relative;
        }
        
        .loading-spinner {
            position: absolute;
            right: 15px;
            top: 50%;
            transform: translateY(-50%);
            display: none;
        }
        
        .spinner {
            width: 16px;
            height: 16px;
            border: 2px solid #f3f3f3;
            border-top: 2px solid #3498db;
            border-radius: 50%;
            animation: spin 1s linear infinite;
        }
        
        @keyframes spin {
            0% { transform: rotate(0deg); }
            100% { transform: rotate(360deg); }
        }
        
        @media (max-width: 768px) {
            .edit-modal {
                padding: 25px 20px;
                width: 95%;
            }
            
            .edit-modal .row {
                flex-direction: column;
                gap: 0;
            }
        }
    </style>
    <script>
        // Phone number formatting function (same as in product.js and cart.js)
        function formatPhoneNumber(value) {
            // Remove all non-numeric characters
            const numbers = value.replace(/\D/g, '');
            
            if (numbers.length === 0) return '';
            
            if (numbers.length <= 3) {
                return `(${numbers}`;
            }
            
            if (numbers.length <= 6) {
                return `(${numbers.slice(0, 3)}) ${numbers.slice(3)}`;
            }
            
            return `(${numbers.slice(0, 3)}) ${numbers.slice(3, 6)}-${numbers.slice(6, 10)}`;
        }
        
        // Setup phone formatting for this modal
        function setupPhoneFormatting() {
            const phoneInputs = document.querySelectorAll('input[id*="phone"]');
            phoneInputs.forEach(input => {
                // Format existing value on load
                if (input.value) {
                    input.value = formatPhoneNumber(input.value);
                }
                
                // Add input event listener for real-time formatting
                input.addEventListener('input', function(e) {
                    const cursorPosition = this.selectionStart;
                    const originalLength = this.value.length;
                    
                    this.value = formatPhoneNumber(this.value);
                    
                    const newLength = this.value.length;
                    const lengthDifference = newLength - originalLength;
                    const newCursorPosition = cursorPosition + lengthDifference;
                    
                    this.setSelectionRange(newCursorPosition, newCursorPosition);
                });
                
                // Only allow numbers and navigation keys
                input.addEventListener('keydown', function(e) {
                    // Allow navigation keys, delete, backspace, tab
                    if ([8, 9, 13, 37, 38, 39, 40, 46].includes(e.keyCode)) {
                        return;
                    }
                    
                    // Allow numbers only
                    if (!/\d/.test(e.key)) {
                        e.preventDefault();
                    }
                });
            });
        }

        // GHIN formatting function - limit to 8 digits only
        function setupGHINFormatting() {
            const ghinInputs = document.querySelectorAll('input[id*="ghin"]');
            ghinInputs.forEach(input => {
                // Format existing value on load - remove non-numeric and limit to 8
                if (input.value) {
                    input.value = input.value.replace(/\D/g, '').slice(0, 8);
                }
                
                // Add input event listener for real-time formatting
                input.addEventListener('input', function(e) {
                    // Remove non-numeric characters and limit to 8 digits
                    this.value = this.value.replace(/\D/g, '').slice(0, 8);
                });
                
                // Only allow numbers and navigation keys
                input.addEventListener('keydown', function(e) {
                    // Allow navigation keys, delete, backspace, tab
                    if ([8, 9, 13, 37, 38, 39, 40, 46].includes(e.keyCode)) {
                        return;
                    }
                    
                    // Allow numbers only
                    if (!/\d/.test(e.key)) {
                        e.preventDefault();
                    }
                });
            });
        }

    // Initialize when DOM is loaded
    document.addEventListener('DOMContentLoaded', function() {
        setupPhoneFormatting();
        setupGHINFormatting();
        
        // Initialize member autocomplete if the function exists
        if (typeof initMemberAutocomplete === 'function') {
            initMemberAutocomplete();
        }
    });
    </script>
</head>
