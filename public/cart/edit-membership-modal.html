<!-- edit-membership-modal.html -->
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="/css/product.css" />
    <style>
        .edit-modal-backdrop {
            position: fixed;
            inset: 0;
            background: rgba(0,0,0,0.45);
            display: flex;
            align-items: center;
            justify-content: center;
            z-index: 2000;
        }
        
        .edit-modal {
            width: 680px;
            max-width: 95%;
            max-height: 90vh;
            overflow-y: auto;
            background: #fff;
            border-radius: 12px;
            padding: 30px;
            box-shadow: 0 15px 50px rgba(0,0,0,.25);
        }
        
        .edit-modal h3 {
            margin-top: 0;
            margin-bottom: 25px;
            font-size: 1.5rem;
            font-weight: 600;
            color: #000;
        }
        
        .edit-modal label {
            display: block;
            margin-bottom: 8px;
            font-weight: 600;
            color: #333;
            font-size: 0.95rem;
        }
        
        .edit-modal input,
        .edit-modal textarea {
            width: 100%;
            padding: 12px 15px;
            border: 1px solid #ddd;
            border-radius: 6px;
            margin-bottom: 5px;
            box-sizing: border-box;
            font-size: 1rem;
            transition: border-color 0.2s, box-shadow 0.2s;
        }
        
        .edit-modal .row {
            display: flex;
            gap: 20px;
            margin-bottom: 5px;
        }
        
        .edit-modal .row .col {
            flex: 1;
            position: relative;
        }
        
        .edit-modal .modal-footer {
            margin-top: 25px;
            padding-top: 20px;
            border-top: 1px solid #eee;
        }
        
        .edit-modal .actions {
            display: flex;
            gap: 12px;
            justify-content: flex-end;
        }
        
        @media (max-width: 768px) {
            .edit-modal {
                padding: 25px 20px;
                width: 95%;
            }
            
            .edit-modal .row {
                flex-direction: column;
                gap: 0;
            }
        }
        
        /* Name error styling */
        .name-error {
            color: #ff4444;
            font-size: 0.85rem;
            margin-top: 5px;
        }
        
        /* Membership type indicator */
        .membership-type-badge {
            background-color: #f0f0f0;
            padding: 4px 12px;
            border-radius: 20px;
            font-size: 0.85rem;
            color: #666;
            margin-left: 10px;
            font-weight: normal;
        }
    </style>
</head>
<body>
    <div class="edit-modal-backdrop" id="edit-modal">
        <div class="edit-modal" role="dialog" aria-modal="true">
            <div style="display:flex; justify-content:space-between; align-items:center; margin-bottom: 25px;">
                <h3 style="margin:0;">
                    Edit Membership Details
                    <span id="membership-type-badge" class="membership-type-badge"></span>
                </h3>
                <button id="modal-close" style="background:transparent; border:none; font-size:24px; cursor:pointer; color: #666;">×</button>
            </div>
            
            <div class="row">
                <div class="col">
                    <label for="modal-name">Name *</label>
                    <input id="modal-name" required 
                           pattern="^[A-Za-zÀ-ÖØ-öø-ÿ'\-]{2,30}\s+[A-Za-zÀ-ÖØ-öø-ÿ'\-]{2,30}$"
                           title="Enter exactly two names (first and last). Only letters, hyphens, and apostrophes allowed. Each name must be 2-30 characters." />
                </div>
            </div>
            
            <div class="row">
                <div class="col">
                    <label for="modal-email">Email *</label>
                    <input id="modal-email" type="email" required />
                </div>
                <div class="col">
                    <label for="modal-phone">Phone *</label>
                    <input id="modal-phone" required maxlength="14" />
                </div>
            </div>

            <!-- GHIN Row - Will be shown/hidden based on membership type -->
            <div class="row" id="ghin-row">
                <div class="col">
                    <label for="modal-ghin" id="ghin-label">GHIN Number *</label>
                    <input id="modal-ghin" maxlength="8" pattern="\d{1,8}" />
                    <div class="field-hint" id="ghin-hint" style="display: none; color: #666; font-size: 0.85rem; margin-top: 5px;">
                        GHIN is not required for new memberships
                    </div>
                </div>
            </div>
            
            <div class="modal-footer">
                <p class="required-note">* Required fields</p>
                <div class="actions">
                    <button id="modal-close-2" class="btn ghost">Cancel</button>
                    <button id="modal-save" class="btn primary">Save Changes</button>
                </div>
            </div>
        </div>
    </div>

    <script>
        // Phone number formatting function
        function formatPhoneNumber(value) {
            // Remove all non-numeric characters
            const numbers = value.replace(/\D/g, '');
            
            if (numbers.length === 0) return '';
            
            if (numbers.length <= 3) {
                return `(${numbers}`;
            }
            
            if (numbers.length <= 6) {
                return `(${numbers.slice(0, 3)}) ${numbers.slice(3)}`;
            }
            
            return `(${numbers.slice(0, 3)}) ${numbers.slice(3, 6)}-${numbers.slice(6, 10)}`;
        }
        
        // Setup phone formatting for this modal
        function setupPhoneFormatting() {
            const phoneInputs = document.querySelectorAll('input[id*="phone"]');
            phoneInputs.forEach(input => {
                // Format existing value on load
                if (input.value) {
                    input.value = formatPhoneNumber(input.value);
                }
                
                // Add input event listener for real-time formatting
                input.addEventListener('input', function(e) {
                    const cursorPosition = this.selectionStart;
                    const originalLength = this.value.length;
                    
                    this.value = formatPhoneNumber(this.value);
                    
                    const newLength = this.value.length;
                    const lengthDifference = newLength - originalLength;
                    const newCursorPosition = cursorPosition + lengthDifference;
                    
                    this.setSelectionRange(newCursorPosition, newCursorPosition);
                });
                
                // Only allow numbers and navigation keys
                input.addEventListener('keydown', function(e) {
                    // Allow navigation keys, delete, backspace, tab
                    if ([8, 9, 13, 37, 38, 39, 40, 46].includes(e.keyCode)) {
                        return;
                    }
                    
                    // Allow numbers only
                    if (!/\d/.test(e.key) && e.key !== '(' && e.key !== ')' && e.key !== '-' && e.key !== ' ') {
                        e.preventDefault();
                    }
                });
            });
        }

        // GHIN formatting function - limit to 8 digits only
        function setupGHINFormatting() {
            const ghinInput = document.getElementById('modal-ghin');
            if (!ghinInput) return;
            
            // Format existing value on load - remove non-numeric and limit to 8
            if (ghinInput.value) {
                ghinInput.value = ghinInput.value.replace(/\D/g, '').slice(0, 8);
            }
            
            // Add input event listener for real-time formatting
            ghinInput.addEventListener('input', function(e) {
                // Remove non-numeric characters and limit to 8 digits
                this.value = this.value.replace(/\D/g, '').slice(0, 8);
            });
            
            // Only allow numbers and navigation keys
            ghinInput.addEventListener('keydown', function(e) {
                // Allow navigation keys, delete, backspace, tab
                if ([8, 9, 13, 37, 38, 39, 40, 46].includes(e.keyCode)) {
                    return;
                }
                
                // Allow numbers only
                if (!/\d/.test(e.key)) {
                    e.preventDefault();
                }
            });
        }
        
        // Enhanced name validation for edit modal
        function setupEditModalNameValidation() {
            const nameInput = document.getElementById('modal-name');
            
            if (!nameInput) return;
            
            // Real-time character filtering
            nameInput.addEventListener('input', function(e) {
                // Get current value and cursor position
                const cursorPos = this.selectionStart;
                const originalValue = this.value;
                
                // Remove any characters that aren't allowed
                // Allow: letters, spaces, hyphens, apostrophes
                let newValue = originalValue.replace(/[^A-Za-zÀ-ÖØ-öø-ÿ'\-\s]/g, '');
                
                // Remove extra spaces (only allow single spaces between words)
                newValue = newValue.replace(/\s+/g, ' ').trim();
                
                // Limit to two words maximum
                const words = newValue.split(' ');
                if (words.length > 2) {
                    newValue = words.slice(0, 2).join(' ');
                }
                
                // Update value if changed
                if (newValue !== originalValue) {
                    this.value = newValue;
                    
                    // Restore cursor position (adjust for removed characters)
                    const diff = newValue.length - originalValue.length;
                    this.setSelectionRange(cursorPos + diff, cursorPos + diff);
                }
            });
            
            // Prevent typing invalid characters
            nameInput.addEventListener('keydown', function(e) {
                // Allow control keys
                if (e.ctrlKey || e.metaKey || 
                    e.key === 'Backspace' || e.key === 'Delete' || 
                    e.key === 'Tab' || e.key === 'Enter' || 
                    e.key === 'ArrowLeft' || e.key === 'ArrowRight' ||
                    e.key === 'ArrowUp' || e.key === 'ArrowDown' ||
                    e.key === 'Home' || e.key === 'End') {
                    return;
                }
                
                // Only allow: letters, space, hyphen, apostrophe
                const allowedChars = /^[A-Za-zÀ-ÖØ-öø-ÿ'\- ]$/;
                if (!allowedChars.test(e.key)) {
                    e.preventDefault();
                }
                
                // Prevent more than one space in a row
                if (e.key === ' ') {
                    const cursorPos = this.selectionStart;
                    const beforeCursor = this.value.substring(0, cursorPos);
                    if (beforeCursor.endsWith(' ') || beforeCursor.length === 0) {
                        e.preventDefault();
                    }
                }
            });
            
            // On blur, enforce exactly two words
            nameInput.addEventListener('blur', function() {
                const words = this.value.trim().split(/\s+/);
                
                if (words.length !== 2) {
                    // Show error
                    this.style.borderColor = '#ff4444';
                    
                    // Create or update error message
                    let errorMsg = this.parentNode.querySelector('.name-error');
                    if (!errorMsg) {
                        errorMsg = document.createElement('div');
                        errorMsg.className = 'name-error';
                        errorMsg.style.color = '#ff4444';
                        errorMsg.style.fontSize = '0.85rem';
                        errorMsg.style.marginTop = '5px';
                        this.parentNode.appendChild(errorMsg);
                    }
                    
                    if (words.length === 1) {
                        errorMsg.textContent = 'Please enter both first and last name';
                    } else if (words.length > 2) {
                        errorMsg.textContent = 'Please enter only first and last name';
                    } else if (words.length === 0) {
                        errorMsg.textContent = 'Name is required';
                    }
                } else {
                    // Clear error
                    this.style.borderColor = '#ddd';
                    const errorMsg = this.parentNode.querySelector('.name-error');
                    if (errorMsg) {
                        errorMsg.remove();
                    }
                }
            });
            
            // Clear error on focus
            nameInput.addEventListener('focus', function() {
                this.style.borderColor = '#ddd';
                const errorMsg = this.parentNode.querySelector('.name-error');
                if (errorMsg) {
                    errorMsg.remove();
                }
            });
        }

        // Function to configure GHIN field based on membership type
        function configureGHINField(membershipType) {
            const ghinRow = document.getElementById('ghin-row');
            const ghinInput = document.getElementById('modal-ghin');
            const ghinLabel = document.getElementById('ghin-label');
            const ghinHint = document.getElementById('ghin-hint');
            const membershipBadge = document.getElementById('membership-type-badge');
            
            if (!ghinRow || !ghinInput || !ghinLabel) return;
            
            if (membershipType === 'new-membership') {
                // New membership - hide GHIN field (not required)
                ghinRow.style.display = 'none';
                ghinInput.required = false;
                if (membershipBadge) {
                    membershipBadge.textContent = 'New Membership';
                }
            } else {
                // Membership renewal - show GHIN field (required)
                ghinRow.style.display = 'flex';
                ghinInput.required = true;
                if (membershipBadge) {
                    membershipBadge.textContent = 'Renewal';
                }
            }
            
            // Show/hide hint
            if (ghinHint) {
                ghinHint.style.display = membershipType === 'new-membership' ? 'block' : 'none';
            }
        }

        // Initialize when DOM is loaded
        document.addEventListener('DOMContentLoaded', function() {
            setupPhoneFormatting();
            setupGHINFormatting();
            setupEditModalNameValidation();
            
            // Check URL or data attribute to determine membership type
            // This will be set when opening the modal
        });
    </script>
</body>
</html>
