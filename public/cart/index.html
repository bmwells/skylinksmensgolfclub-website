<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1" />
  <title>Cart - Skylinks Men's Golf Club</title>
  <link rel="stylesheet" href="/css/styles.css" />
  <style>
    body { font-family: system-ui, sans-serif; margin:0; background:#fff; }
    .cart-page-section { padding: 120px 1rem 4rem; }
    .cart-container { max-width:1000px; margin:0 auto; }
    .cart-title { font-size:2.2rem; font-weight:500; text-align:center; margin-bottom:24px; color:var(--primary); } 
    .cart-row { display:grid; grid-template-columns: 120px 1fr 160px 100px; gap:18px; align-items:center; padding:18px 0; border-bottom:1px solid #eee; }
    @media (max-width:768px) { .cart-row { grid-template-columns: 100%; gap:8px; } }
    .cart-row-img { width:120px; height:90px; background-size:cover; background-position:center; border-radius:6px; }
    .cart-row-title { font-size:1.05rem; font-weight:600; color:#111; text-decoration:none; }
    .cart-sm-label { font-size:0.9rem; color:#666; margin-top:6px; }
    .cart-row-price { text-align:right; font-weight:400; font-size:1.05rem; }
    .cart-actions { display:flex; flex-direction:column; gap:6px; }
    .cart-action-btn { background:none; border:none; color:#333; text-decoration:underline; cursor:pointer; font-size:0.9rem; padding:0; }
    .cart-edit-details-btn { background: none; border: none; color: #333; text-decoration: underline; cursor: pointer; font-size: 0.9rem; padding: 0; margin-top: 6px; text-align: left; display: inline-block; }
    .cart-summary { margin-top:24px; text-align:right; }
    .checkout-btn { margin-top:12px; padding:12px 36px; background:#000; color:#fff; border-radius:40px; border:none; cursor:pointer; }
    .empty-message { text-align:center; color:#666; padding:40px 0; }
    .empty-message p { font-size:1.1rem; margin-bottom:40px; }

    /* Mobile-specific cart row layout*/
    @media (max-width: 768px) {
    .cart-row {
        grid-template-columns: 150px 1fr;
        grid-template-areas:
        "image title"
        "image details"
        "price actions"; 
        gap: 12px;
        padding: 20px 0;
        position: relative;
        border: 1px solid #eee;
        border-radius: 8px;
        margin-bottom: 12px;
        padding: 16px;
    }
    
    .cart-row-img {
        grid-area: image;
        width: 150px;
        height: 100px;
    }
    
    .cart-row-title {
        grid-area: title;
        font-size: 1rem;
        line-height: 1.3;
        margin-bottom: 8px;
        padding-right: 80px; 
    }
    
    .cart-row-details {
        grid-area: details;
        font-size: 0.85rem;
        color: #666;
        line-height: 1.4;
        margin-bottom: 4px;
    }
    
    
    .cart-row-price {
        grid-area: price;
        text-align: left; 
        font-size: 1.1rem;
        font-weight: 600;
        margin-top: 8px;
        align-self: center;
    }
    
    .cart-actions {
        grid-area: actions;
        flex-direction: row;
        justify-content: flex-end;
        gap: 20px;
        margin-top: 8px;
        padding-top: 0;
        border-top: none;
        align-self: center;
    }
    
    .cart-edit-details-btn {
        margin-top: 12px;
    }
    
    .cart-sm-label {
        display: none;
    }
    
    /* Hide the original label in mobile */
    .cart-row > div:nth-child(3) {
        display: none;
    }
        
    /* Position remove button inline with product name */
    .cart-actions .cart-action-btn:first-child {
        position: absolute;
        top: 16px;
        right: 16px;
        margin: 0;
    }
    }

    /* Add a container for item details in mobile view */
    .cart-row-details {
    display: none;
    }

    @media (max-width: 768px) {
    .cart-row-details {
        display: block;
    }
    }

        
    </style>
</head>
<body>

    <!-- HEADER INJECTION -->
    <div id="header-placeholder"></div>

    <section class="cart-page-section">
      <div class="cart-container">
        <h1 class="cart-title">Shopping Cart</h1>

        <div id="cart-rows"></div>

        <div id="cart-empty" class="empty-message" style="display:none;">
          <p>You have nothing in your shopping cart.</p>
          <a class="checkout-btn" href="/tournament-entry">Continue Shopping</a>
        </div>

        <div id="cart-summary" class="cart-summary" style="display:none;">
          <div>Subtotal: <strong id="cart-subtotal">$0.00</strong></div>
          <button id="checkout-button" class="checkout-btn">Checkout</button>
        </div>
      </div>
    </section>

    <!-- Edit modal (used for editing cart item details) -->
    <div id="edit-modal" style="display:none; position:fixed; inset:0; background:rgba(0,0,0,0.45); align-items:center; justify-content:center; z-index:2000;">
      <div style="width:720px; max-width:95%; background:#fff; border-radius:8px; padding:20px; box-shadow:0 10px 30px rgba(0,0,0,.2);">
        <div style="display:flex; justify-content:space-between; align-items:center;">
          <h3 style="margin:0;">Edit Item Details</h3>
          <button id="modal-close" style="background:transparent; border:none; font-size:18px; cursor:pointer;">✕</button>
        </div>

        <div style="margin-top:12px;">
          <label for="modal-name">Name</label>
          <input id="modal-name" type="text" style="width:100%; padding:8px; margin-bottom:8px;" />

          <label for="modal-email">Email</label>
          <input id="modal-email" type="email" style="width:100%; padding:8px; margin-bottom:8px;" />

          <label for="modal-phone">Phone</label>
          <input id="modal-phone" type="text" style="width:100%; padding:8px; margin-bottom:8px;" />

          <label for="modal-ghin">GHIN Number</label>
          <input id="modal-ghin" type="text" style="width:100%; padding:8px; margin-bottom:8px;" />

          <div style="display:flex; gap:8px; justify-content:flex-end; margin-top:8px;">
            <button id="modal-close-2" class="btn" style="border-radius:24px; padding:8px 14px; background:transparent; border:1px solid #ddd;">Cancel</button>
            <button id="modal-save" class="btn" style="border-radius:24px; padding:8px 14px; background:#000; color:#fff;">Save</button>
          </div>
        </div>
      </div>
    </div>

    <!-- FOOTER INJECTION -->
    <div id="footer-placeholder"></div>

    <!-- Scripts -->
    <script src="/js/menu.js"></script>
    <script src="/js/cart.js"></script>

    <script>
      // Load header + footer on page
      fetch("/header.html")
          .then(res => res.text())
          .then(html => {
              document.getElementById("header-placeholder").innerHTML = html;
              if (typeof initMenu === "function") initMenu();
          });

      fetch("/footer.html")
          .then(res => res.text())
          .then(html => (document.getElementById("footer-placeholder").innerHTML = html));

      // Expose helper to render cart when DOM is ready
      document.addEventListener('DOMContentLoaded', function() {
        // renderCart is defined in /js/cart.js
        if (typeof renderCart === 'function') {
          renderCart();
        } else {
          // cart.js defines its own DOMContentLoaded rendering; nothing necessary here
        }
      });
    </script>
</body>
</html>
