<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1" />
  <link rel="icon" href="/favicon.ico" type="image/x-icon">
  <link rel="shortcut icon" href="/favicon.ico" type="image/x-icon">
  <title>Cart - Skylinks Men's Golf Club</title>
  <link rel="stylesheet" href="/css/styles.css" />
  
</head>
<body>

    <!-- HEADER INJECTION -->
    <div id="header-placeholder"></div>

    <section class="cart-page-section">
      <div class="cart-container">
        <h1 class="cart-title">Shopping Cart</h1>

        <div id="cart-rows"></div>

        <div id="cart-empty" class="empty-message" style="display:none;">
          <p>You have nothing in your shopping cart.</p>
          <a class="checkout-btn" href="/tournament-entry">Continue Shopping</a>
        </div>

        <div id="cart-summary" class="cart-summary" style="display:none;">
          <div>Subtotal: <strong id="cart-subtotal">$0.00</strong></div>
          <button id="checkout-button" class="checkout-btn">Checkout</button>
        </div>
      </div>
    </section>

    <!-- Edit modal (used for editing cart item details) -->
    <div id="edit-modal" style="display:none; position:fixed; inset:0; background:rgba(0,0,0,0.45); align-items:center; justify-content:center; z-index:2000;">
      <div style="width:720px; max-width:95%; background:#fff; border-radius:8px; padding:20px; box-shadow:0 10px 30px rgba(0,0,0,.2);">
        <div style="display:flex; justify-content:space-between; align-items:center;">
          <h3 style="margin:0;">Edit Item Details</h3>
          <button id="modal-close" style="background:transparent; border:none; font-size:18px; cursor:pointer;">✕</button>
        </div>

        <div style="margin-top:12px;">
          <label for="modal-name">Name</label>
          <input id="modal-name" type="text" style="width:100%; padding:8px; margin-bottom:8px;" />

          <label for="modal-email">Email</label>
          <input id="modal-email" type="email" style="width:100%; padding:8px; margin-bottom:8px;" />

          <label for="modal-phone">Phone</label>
          <input id="modal-phone" type="text" style="width:100%; padding:8px; margin-bottom:8px;" />

          <label for="modal-ghin">GHIN Number</label>
          <input id="modal-ghin" type="text" style="width:100%; padding:8px; margin-bottom:8px;" />

          <div style="display:flex; gap:8px; justify-content:flex-end; margin-top:8px;">
            <button id="modal-close-2" class="btn" style="border-radius:24px; padding:8px 14px; background:transparent; border:1px solid #ddd;">Cancel</button>
            <button id="modal-save" class="btn" style="border-radius:24px; padding:8px 14px; background:#000; color:#fff;">Save</button>
          </div>
        </div>
      </div>
    </div>

    <!-- FOOTER INJECTION -->
    <div id="footer-placeholder"></div>

    <!-- Scripts -->
    <script src="/js/menu.js"></script>
    <script src="/js/member-autocomplete.js"></script>
    <script src="/js/cart.js"></script>
    <script src="/js/cart-count.js"></script>



    <script>
      // Load header + footer on page
      fetch("/header.html")
          .then(res => res.text())
          .then(html => {
              document.getElementById("header-placeholder").innerHTML = html;
              if (typeof initMenu === "function") initMenu();
          });

      fetch("/footer.html")
          .then(res => res.text())
          .then(html => (document.getElementById("footer-placeholder").innerHTML = html));


      // Expose helper to render cart when DOM is ready
      document.addEventListener('DOMContentLoaded', function() {
        // renderCart is defined in /js/cart.js
        if (typeof renderCart === 'function') {
          renderCart();
        } else {
          // cart.js defines its own DOMContentLoaded rendering; nothing necessary here
        }
      });
    </script>
</body>
</html>
