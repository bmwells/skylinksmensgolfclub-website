<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <link rel="icon" href="/favicon.ico" type="image/x-icon">
    <link rel="shortcut icon" href="/favicon.ico" type="image/x-icon">
    <title>Constitution & Bylaws - Skylinks Men's Golf Club</title>
    <link rel="stylesheet" href="/css/styles.css" />
    <style>
        /* Ensure no space between header and first section */
        body {
            margin-top: 40px;
            padding: 0;
        }

        #header-placeholder + main {
            margin-top: 0;
        }

        /* Fix for header spacing */
        .constitution-page {
            margin-top: 0;
        }
        
        /* Loading state */
        .loading {
            text-align: center;
            padding: 4rem;
            color: #666;
        }

        /* Tab navigation – centered, clean */
        .tab-bar {
            display: flex;
            justify-content: center;
            gap: 0.5rem;
            margin: 2rem 0 3rem 0;
            border-bottom: 1px solid #ddd;
            padding-bottom: 0;
        }

        .tab-btn {
            background: transparent;
            border: none;
            padding: 0.8rem 2.5rem;
            font-size: 1.2rem;
            font-weight: 400;
            color: #666;
            cursor: pointer;
            position: relative;
            transition: color 0.2s;
            font-family: 'Manrope', sans-serif;
            letter-spacing: 0.3px;
            border-bottom: 2px solid transparent;
            margin-bottom: -1px;
        }

        .tab-btn.active {
            color: #000;
            font-weight: 500;
            border-bottom: 2px solid #000;
        }

        .tab-btn:hover {
            color: #000;
        }

        /* document card / paper style */
        .document-card {
            background: #fff;
            border-radius: 12px;
            padding: 2.5rem;
            box-shadow: 0 4px 20px rgba(0,0,0,0.03);
            border: 1px solid #eee;
        }

        .document-header {
            text-align: center;
            margin-bottom: 2.5rem;
            padding-bottom: 1.5rem;
            border-bottom: 1px solid #eaeaea;
        }

        .document-header h1 {
            font-size: 2.2rem;
            font-weight: 400;
            color: var(--primary);
            margin-bottom: 0.5rem;
            line-height: 1.3;
        }

        .last-amended {
            color: #666;
            font-size: 0.95rem;
            font-weight: 300;
            display: inline-block;
            background: #f1f1f1;
            padding: 0.2rem 1rem;
            border-radius: 30px;
        }

        /* article styling */
        .article {
            margin-bottom: 2.2rem;
        }

        .article-title {
            font-size: 1.4rem;
            font-weight: 400;
            color: #000;
            margin-bottom: 1rem;
            border-left: 4px solid #2a5c3d;
            padding-left: 1rem;
        }

        .article-content {
            font-size: 1rem;
            line-height: 1.6;
            color: #333;
            padding-left: 1.5rem;
            margin-top: 0.5rem;
        }

        .article-content p {
            margin-bottom: 0.8rem;
        }

        .bullet-list {
            list-style: none;
            padding-left: 1.8rem;
            margin: 0.8rem 0;
        }

        .bullet-list li {
            margin-bottom: 0.5rem;
            position: relative;
        }

        .bullet-list li::before {
            content: "•";
            color: #2a5c3d;
            font-weight: bold;
            position: absolute;
            left: -1.2rem;
        }

        .section-block {
            margin: 1.2rem 0 1.2rem 1rem;
            padding-left: 1rem;
            border-left: 2px solid #f0f0f0;
        }

        .section-title {
            font-weight: 600;
            font-size: 1.1rem;
            margin-bottom: 0.5rem;
            color: #111;
        }

        .member-class {
            margin: 0.8rem 0 1.2rem 1rem;
            font-style: italic;
        }

        .member-class strong {
            font-style: normal;
            color: #2a5c3d;
        }

        .provision-list {
            list-style: none;
            padding-left: 1.8rem;
        }

        .provision-list li {
            margin-bottom: 0.3rem;
            position: relative;
            font-size: 0.95rem;
        }

        .provision-list li::before {
            content: "−";
            color: #666;
            position: absolute;
            left: -1.2rem;
        }

        .officer-duties, .committee-duties {
            margin: 1rem 0;
        }

        .duty-item {
            margin-bottom: 1rem;
            padding-bottom: 0.5rem;
            border-bottom: 1px dashed #eee;
        }

        .duty-item strong {
            color: #2a5c3d;
            font-weight: 600;
            display: inline-block;
            min-width: 130px;
        }

        .order-list {
            list-style: none;
            counter-reset: order-counter;
            padding-left: 1.5rem;
        }

        .order-list li {
            counter-increment: order-counter;
            margin-bottom: 0.3rem;
            position: relative;
        }

        .order-list li::before {
            content: counter(order-counter) ".";
            position: absolute;
            left: -1.5rem;
            color: #2a5c3d;
            font-weight: 500;
        }

        /* responsive */
        @media (max-width: 768px) {
            .content-width--narrow {
                padding: 2rem 1rem;
            }
            .tab-btn {
                padding: 0.6rem 1.2rem;
                font-size: 1rem;
            }
            .document-header h1 {
                font-size: 1.6rem;
            }
            .article-title {
                font-size: 1.2rem;
            }
            .article-content {
                padding-left: 0.5rem;
            }
            .document-card {
                padding: 1.5rem;
            }
        }

        .clause-letter {
            font-weight: 600;
            color: #2a5c3d;
            margin-right: 0.5rem;
        }

        .content-width--narrow {
            max-width: 1000px;
            margin: 0 auto;
            padding: 2rem;
        }
    </style>
</head>

        let activeType = 'constitution'; // default

        function renderDocument(type) {
            const doc = documentData.find(d => d.documentType === type);
            if (!doc) return;

            let html = `
                <div class="document-card">
                    <div class="document-header">
                        <h1>${doc.title}</h1>
                        <span class="last-amended">Last amended: ${doc.lastAmended}</span>
                    </div>
                    <div class="document-body">
            `;

            doc.articles.forEach(article => {
                html += `<div class="article">`;
                html += `<div class="article-title">ARTICLE ${article.number}: ${article.title}</div>`;

                // handle content if exists
                if (article.content) {
                    html += `<div class="article-content"><p>${article.content.replace(/\n/g, '<br>')}</p></div>`;
                }

                // bulletPoints (used in objects, dues)
                if (article.bulletPoints && article.bulletPoints.length) {
                    html += `<ul class="bullet-list">`;
                    article.bulletPoints.forEach(bp => {
                        html += `<li>${bp}</li>`;
                    });
                    html += `</ul>`;
                }

                // orderOfBusiness (bylaws article I)
                if (article.orderOfBusiness && article.orderOfBusiness.length) {
                    html += `<ol class="order-list">`;
                    article.orderOfBusiness.forEach(item => {
                        html += `<li>${item}</li>`;
                    });
                    html += `</ol>`;
                }

                // handle sections
                if (article.sections) {
                    article.sections.forEach(section => {
                        html += `<div class="section-block">`;
                        html += `<div class="section-title">Section ${section.number || section.letter || ''}. ${section.title || ''}</div>`;
                        if (section.content) {
                            html += `<p>${section.content}</p>`;
                        }

                        // memberClasses (article IV, section 1)
                        if (section.memberClasses) {
                            section.memberClasses.forEach(mc => {
                                html += `<div class="member-class"><strong>${mc.className}</strong>`;
                                if (mc.provisions) {
                                    html += `<ul class="provision-list">`;
                                    mc.provisions.forEach(p => html += `<li>${p}</li>`);
                                    html += `</ul>`;
                                }
                                html += `</div>`;
                            });
                        }

                        // officerDuties (article VII, section 2)
                        if (section.officerDuties) {
                            html += `<div class="officer-duties">`;
                            section.officerDuties.forEach(od => {
                                html += `<div class="duty-item"><strong>${od.position}:</strong> ${od.duties}</div>`;
                            });
                            html += `</div>`;
                        }

                        // committees (bylaws V.1)
                        if (section.committees) {
                            section.committees.forEach(c => {
                                if (c.fromDirectors) {
                                    html += `<p><strong>From Directors:</strong> ${c.fromDirectors.join(', ')}</p>`;
                                }
                                if (c.pastPresident) {
                                    html += `<p><em>${c.pastPresident}</em></p>`;
                                }
                            });
                        }

                        // committeeDuties (bylaws V.2)
                        if (section.committeeDuties) {
                            html += `<div class="committee-duties">`;
                            section.committeeDuties.forEach(cd => {
                                html += `<div class="duty-item"><strong>${cd.chairman}:</strong> ${cd.duties}</div>`;
                            });
                            html += `</div>`;
                        }

                        // subpoints (article VII, section 1)
                        if (section.subpoints) {
                            html += `<ul class="bullet-list" style="margin-top:0.5rem;">`;
                            section.subpoints.forEach(sp => html += `<li>${sp}</li>`);
                            html += `</ul>`;
                        }

                        // handle lettered sections (bylaws VI)
                        if (section.letter && section.content) {
                            html += `<p><span class="clause-letter">${section.letter}.</span> ${section.content}</p>`;
                        }

                        html += `</div>`;
                    });
                }

                html += `</div>`;
            });

            html += `</div></div>`; // close document-body & card
            container.innerHTML = html;
        }

        // tab switching
        function setActiveTab(type) {
            if (type === 'constitution') {
                tabConstitution.classList.add('active');
                tabBylaws.classList.remove('active');
            } else {
                tabBylaws.classList.add('active');
                tabConstitution.classList.remove('active');
            }
            activeType = type;
            renderDocument(type);
        }

        tabConstitution.addEventListener('click', (e) => {
            e.preventDefault();
            setActiveTab('constitution');
        });

        tabBylaws.addEventListener('click', (e) => {
            e.preventDefault();
            setActiveTab('bylaws');
        });

        // initial render
        renderDocument('constitution');
    </script>

</body>
</html>
