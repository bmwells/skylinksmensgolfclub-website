<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <link rel="icon" href="/favicon.ico" type="image/x-icon">
    <link rel="shortcut icon" href="/favicon.ico" type="image/x-icon">
    <title>President's Letter - Skylinks Men's Golf Club</title>
    <link rel="stylesheet" href="/css/styles.css" />
    <style>
        /* Main page styling */
        .presidents-letter-page {
            margin-top: 80px;
        }

        .full-bleed-section {
            width: 100%;
            position: relative;
        }

        .content-width--wide {
            max-width: 1200px;
            margin: 0 auto;
            padding: 0 2rem;
        }

        .section-height--custom {
            padding: 4rem 0;
        }

        .letter-section {
            padding: 4.4rem 0 0 0;
            margin-top: 0;
            min-height: calc(100vh - 80px);
            display: flex;
            align-items: flex-start;
        }

        .letter-grid {
            display: grid;
            grid-template-columns: 2fr 1fr;
            gap: 4rem;
            align-items: start;
            height: 100%;
        }

        .letter-text-container {
            padding: 3rem 0;
            padding-right: 2rem;
            display: flex;
            flex-direction: column;
        }

        .letter-content {
            font-size: 1.1rem;
            line-height: 1.6;
            color: #333;
        }

        .letter-content h2 {
            color: var(--primary);
            font-size: 1.8rem;
            margin: 0 0 1rem 0;
            font-weight: 500;
            padding-top: 0;
        }

        .letter-content p {
            margin-bottom: 1.2rem;
            white-space: pre-line;
        }

        .letter-content ul {
            margin-left: 2rem;
            margin-bottom: 1.5rem;
        }

        .letter-content li {
            margin-bottom: 0.5rem;
        }

        .letter-image-container {
            width: 100%;
            height: 550px;
            min-height: 500px;
            overflow: hidden;
            margin-top: 7.4rem;
            padding-top: 30px;
        }

        .letter-image {
            width: 100%;
            height: 100%;
            object-fit: cover;
            object-position: center top;
            display: block;
            border-radius: 8px;
        }

        .signature {
            margin-top: 3rem;
            padding-top: 2rem;
            border-top: 2px solid #e0e0e0;
        }

        .signature-name {
            font-size: 1.4rem;
            color: var(--primary);
            font-weight: 500;
            margin-bottom: 0.5rem;
        }

        .signature-role {
            color: #666;
            font-size: 1.1rem;
            font-weight: 400;
        }

        @media (max-width: 992px) {
            .letter-grid {
                gap: 3rem;
            }
        }

        @media (max-width: 768px) {
            .letter-section {
                min-height: auto;
                padding: 0 0;
                margin-top: 0;
            }
            
            .letter-grid {
                grid-template-columns: 1fr;
                gap: 2rem;
                position: relative;
                margin-bottom: 4rem;
            }
            
            .letter-text-container {
                padding: 3rem 0 2rem 0;
                order: 1;
                position: relative;
                min-height: 200px;
            }
            
            .letter-image-container {
                height: 200px;
                min-height: 150px;
                width: 150px;
                margin-top: 0;
                padding-top: 0;
                position: absolute;
                bottom: -30px;
                right: 0;
                border-radius: 8px;
                order: 2;
                z-index: 1;
            }
            
            .letter-image {
                height: 100%;
                object-fit: cover;
                object-position: center top;
            }
            
            .signature {
                margin-top: 3rem;
                padding-top: 2rem;
                padding-right: 170px;
                border-top: none;
                position: relative;
            }
            
            .letter-section {
                padding: 4rem 0;
            }
        }

        @media (max-width: 480px) {
            .letter-content {
                font-size: 1rem;
            }
            
            .letter-image-container {
                height: 120px;
                min-height: 120px;
                width: 120px;
                bottom: 20px;
            }
            
            .signature {
                padding-right: 140px;
            }
            
            .letter-grid {
                margin-bottom: 3rem;
            }
        }

        /* Ensure no space between header and first section */
        body {
            margin: 0;
            padding: 0;
        }

        #header-placeholder + main {
            margin-top: 0;
        }

        /* Fix for header spacing */
        .presidents-letter-page {
            margin-top: 0;
        }
        
        /* Loading state */
        .loading {
            text-align: center;
            padding: 4rem;
            color: #666;
        }
    </style>
</head>
<body>

    <!-- HEADER INJECTION -->
    <div id="header-placeholder"></div>

    <main class="presidents-letter-page">
    <!-- President's Letter Section -->
    <section class="full-bleed-section letter-section">
        <div class="content-width--wide" id="letters-container">
            <!-- Letters will be loaded dynamically here -->
            <div class="loading" id="loading">Loading president's letters...</div>
        </div>
    </section>
</main>

    <!-- FOOTER INJECTION -->
    <div id="footer-placeholder"></div>

    <!-- Scripts -->
    <script src="/js/menu.js"></script>
    <script src="/js/cart-count.js"></script>

    <script>
        // Load header + footer on page
        fetch("/header.html")
            .then(res => res.text())
            .then(html => {
                document.getElementById("header-placeholder").innerHTML = html;
                if (typeof initMenu === 'function') {
                    initMenu();
                }
            });

        fetch("/footer.html")
            .then(res => res.text())
            .then(html => (document.getElementById("footer-placeholder").innerHTML = html));

        // Load president's letters from API
        async function loadPresidentsLetters() {
            try {
                const response = await fetch('/api/presidents-letter');
                const data = await response.json();
                
                const container = document.getElementById('letters-container');
                container.innerHTML = '';
                
                if (!data.letters || data.letters.length === 0) {
                    container.innerHTML = '<p>No president\'s letters available.</p>';
                    return;
                }
                
                // Store president info
                const president = data.president || {
                    name: 'Ted Lewandowski',
                    imageUrl: 'https://images.squarespace-cdn.com/content/v1/678d4161123ed24a1ff89f0e/c0a0f4c2-8cde-45f4-8d75-fbd3bc318ce8/PresidentTed2.jpg',
                    role: 'President, Skylinks Men\'s Golf Club'
                };
                
                // Create each letter
                data.letters.forEach(letter => {
                    const letterElement = createLetterElement(letter, president);
                    container.appendChild(letterElement);
                });
            } catch (error) {
                console.error('Error loading president\'s letters:', error);
                document.getElementById('letters-container').innerHTML = 
                    '<p>Error loading president\'s letters. Please try again later.</p>';
            }
        }

        function createLetterElement(letter, president) {
            const letterGrid = document.createElement('div');
            letterGrid.className = 'letter-grid';
            
            // Parse content - handle bullet points and new lines
            const content = parseLetterContent(letter.content || '');
            
            // Create letter HTML
            letterGrid.innerHTML = `
                <div class="letter-text-container">                        
                    <div class="letter-content">
                        <h2><strong>President's Letter – ${letter.month || ''} ${letter.year || ''}</strong></h2>
                        ${content}
                        
                        <div class="signature">
                            <div class="signature-name">${president.name}</div>
                            <div class="signature-role">President, Skylinks Men's Golf Club</div>
                        </div>
                    </div>
                </div>
                <div class="letter-image-container">
                    <img src="${president.imageUrl}" 
                         alt="${president.name} - President of Skylinks Men's Golf Club" 
                         class="letter-image"
                         loading="lazy">
                </div>
            `;
            
            return letterGrid;
        }

        function parseLetterContent(content) {
            if (!content) return '';
            
            // Split by lines
            const lines = content.split('\n');
            let html = '';
            let inList = false;
            
            lines.forEach(line => {
                const trimmed = line.trim();
                
                // Check if line starts with a bullet point
                if (trimmed.startsWith('* ')) {
                    if (!inList) {
                        html += '<ul>';
                        inList = true;
                    }
                    html += `<li>${trimmed.substring(2)}</li>`;
                } else {
                    // Close list if we were in one
                    if (inList) {
                        html += '</ul>';
                        inList = false;
                    }
                    
                    // Add paragraph (skip empty lines)
                    if (trimmed) {
                        html += `<p>${line}</p>`;
                    } else if (line === '') {
                        // Add empty paragraph for spacing
                        html += '<p>&nbsp;</p>';
                    }
                }
            });
            
            // Close list if still open
            if (inList) {
                html += '</ul>';
            }
            
            return html;
        }

        // Load president's letters when page is ready
        document.addEventListener('DOMContentLoaded', loadPresidentsLetters);
    </script>

</body>
</html>
