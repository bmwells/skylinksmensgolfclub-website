<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <link rel="icon" href="/favicon.ico" type="image/x-icon">
    <link rel="shortcut icon" href="/favicon.ico" type="image/x-icon">
    <title>President's Letter - Skylinks Men's Golf Club</title>
    <link rel="stylesheet" href="/css/styles.css" />
    <style>        
        /* Ensure no space between header and first section */
        body {
            margin: 0;
            padding: 0;
        }

        #header-placeholder + main {
            margin-top: 0;
        }

        /* Fix for header spacing */
        .presidents-letter-page {
            margin-top: 0;
        }
        
        /* Loading state */
        .loading {
            text-align: center;
            padding: 4rem;
            color: #666;
        }
    </style>
</head>
<body>

    <!-- HEADER INJECTION -->
    <div id="header-placeholder"></div>

    <main class="presidents-letter-page">
    <!-- President's Letter Section -->
    <section class="full-bleed-section letter-section">
        <div class="content-width--wide" id="letters-container">
            <!-- Letters will be loaded dynamically here -->
            <div class="loading" id="loading">Loading president's letters...</div>
        </div>
    </section>
</main>

    <!-- FOOTER INJECTION -->
    <div id="footer-placeholder"></div>

    <!-- Scripts -->
    <script src="/js/menu.js"></script>
    <script src="/js/cart-count.js"></script>

    <script>
        // Load header + footer on page
        fetch("/header.html")
            .then(res => res.text())
            .then(html => {
                document.getElementById("header-placeholder").innerHTML = html;
                if (typeof initMenu === 'function') {
                    initMenu();
                }
            });

        fetch("/footer.html")
            .then(res => res.text())
            .then(html => (document.getElementById("footer-placeholder").innerHTML = html));

        // Load president's letters from API
        async function loadPresidentsLetters() {
            try {
                const response = await fetch('/api/presidents-letter');
                const data = await response.json();
                
                const container = document.getElementById('letters-container');
                container.innerHTML = '';
                
                if (!data.letters || data.letters.length === 0) {
                    container.innerHTML = '<p>No president\'s letters available.</p>';
                    return;
                }
                
                // Store president info
                const president = data.president || {
                    name: 'Ted Lewandowski',
                    imageUrl: 'https://images.squarespace-cdn.com/content/v1/678d4161123ed24a1ff89f0e/c0a0f4c2-8cde-45f4-8d75-fbd3bc318ce8/PresidentTed2.jpg',
                    role: 'President, Skylinks Men\'s Golf Club'
                };
                
                // Create each letter
                data.letters.forEach(letter => {
                    const letterElement = createLetterElement(letter, president);
                    container.appendChild(letterElement);
                });
            } catch (error) {
                console.error('Error loading president\'s letters:', error);
                document.getElementById('letters-container').innerHTML = 
                    '<p>Error loading president\'s letters. Please try again later.</p>';
            }
        }

        function createLetterElement(letter, president) {
            const letterGrid = document.createElement('div');
            letterGrid.className = 'letter-grid';
            
            // Parse content - handle bullet points and new lines
            const content = parseLetterContent(letter.content || '');
            
            // Create letter HTML
            letterGrid.innerHTML = `
                <div class="letter-text-container">                        
                    <div class="letter-content">
                        <h2><strong>President's Letter – ${letter.month || ''} ${letter.year || ''}</strong></h2>
                        ${content}
                        
                        <div class="signature">
                            <div class="signature-name">${president.name}</div>
                            <div class="signature-role">President, Skylinks Men's Golf Club</div>
                        </div>
                    </div>
                </div>
                <div class="letter-image-container">
                    <img src="${president.imageUrl}" 
                         alt="${president.name} - President of Skylinks Men's Golf Club" 
                         class="letter-image"
                         loading="lazy">
                </div>
            `;
            
            return letterGrid;
        }

        function parseLetterContent(content) {
            if (!content) return '';
            
            // Split by lines
            const lines = content.split('\n');
            let html = '';
            let inList = false;
            
            lines.forEach(line => {
                const trimmed = line.trim();
                
                // Check if line starts with a bullet point
                if (trimmed.startsWith('* ')) {
                    if (!inList) {
                        html += '<ul>';
                        inList = true;
                    }
                    html += `<li>${trimmed.substring(2)}</li>`;
                } else {
                    // Close list if we were in one
                    if (inList) {
                        html += '</ul>';
                        inList = false;
                    }
                    
                    // Add paragraph (skip empty lines)
                    if (trimmed) {
                        html += `<p>${line}</p>`;
                    } else if (line === '') {
                        // Add empty paragraph for spacing
                        html += '<p>&nbsp;</p>';
                    }
                }
            });
            
            // Close list if still open
            if (inList) {
                html += '</ul>';
            }
            
            return html;
        }

        // Load president's letters when page is ready
        document.addEventListener('DOMContentLoaded', loadPresidentsLetters);
    </script>

</body>
</html>
