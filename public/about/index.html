<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <link rel="icon" href="/favicon.ico" type="image/x-icon">
    <link rel="shortcut icon" href="/favicon.ico" type="image/x-icon">
    <title>Who We Are - Skylinks Men's Golf Club</title>
    <link rel="stylesheet" href="/css/styles.css" />
    <style>
        /* Additional styles specific to the About page */
        .about-page {
            margin-top: 80px;
        }
        
        .full-bleed-section {
            width: 100%;
            position: relative;
        }
        
        .content-width--wide {
            max-width: 1200px;
            margin: 0 auto;
            padding: 0 2rem;
        }
        
        .section-height--custom {
            padding: 4rem 0;
        }
        
        .about-section {
            padding: 4.4rem 0 0 0;
            margin-top: 0;
            min-height: calc(100vh - 80px);
            display: flex;
            align-items: flex-start;
        }

        .about-grid {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 4rem;
            align-items: stretch;
            height: 100%;
        }

        .about-text-container {
            padding: 3rem 0;
            padding-right: 2rem;
        }

        .about-title{
            font-size: 4.5rem;
            color: var(--primary);
            font-weight: 400;
        }

        .about-image-container {
            width: 100%;
            height: 100%;
            min-height: 500px;
            overflow: hidden;
        }

        .about-image {
            width: 100%;
            height: 100%;
            object-fit: cover;
            object-position: center;
            display: block;
        }
        
        .board-section {
            background-color: #f8f9fa;
            padding: 6rem 0;
        }
        
        .section-title {
            text-align: center;
            font-size: 2.5rem;
            color: var(--primary);
            margin-bottom: 4rem;
            font-weight: 400;
        }
        
        .board-grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(300px, 1fr));
            gap: 2rem;
            align-items: start;
        }
        
        .board-member {
            text-align: left;
        }
        
        .board-member-image {
            width: 100%;
            height: auto;
            aspect-ratio: auto;
            object-fit: contain;
            border-radius: 8px;
            margin-bottom: 1.5rem;
        }
        
        .board-member-name {
            font-size: 1.5rem;
            color: var(--primary);
            margin-bottom: 0rem;
            font-weight: 400;
        }
        
        .board-member-role {
            color: #666;
            font-weight: 500;
            margin-bottom: 1rem;
            font-size: 1rem;
        }
        
        .board-member-bio {
            color: #555;
            line-height: 1.2;
            font-size: 0.9rem;
            font-weight: 300;
            max-width: none;
            margin: 0 auto;
        }
        
        .loading, .error {
            text-align: center;
            padding: 4rem;
            color: #666;
        }
        
        .error {
            color: #dc3545;
        }
        
        @media (max-width: 768px) {
            .about-section {
                min-height: auto;
                padding: 0 0;
                margin-top: 0;
            }
            
            .about-grid {
                grid-template-columns: 1fr;
                gap: 2rem;
            }
            
            .about-image-container {
                height: 300px;
                min-height: 300px;
                order: 2;
                border-radius: 8px;
            }
            
            .about-text-container {
                padding: 3rem 0 2rem 0;
                order: 1;
            }
            
            .about-title {
                font-size: 3rem;
                margin-top: 0;
                padding: 0 0 1rem 0;
            }
            
            .board-grid {
                grid-template-columns: 1fr;
                gap: 3rem;
            }
            
            .about-section, .board-section {
                padding: 4rem 0;
            }
        }
        
        /* Ensure no space between header and first section */
        body {
            margin: 0;
            padding: 0;
        }
        
        #header-placeholder + main {
            margin-top: 0;
        }
        
        /* Fix for header spacing */
        .about-page {
            margin-top: 0;
        }
    </style>
</head>
<body>

    <!-- HEADER INJECTION -->
    <div id="header-placeholder"></div>

    <main class="about-page" id="about-content">
        <div class="loading">Loading content...</div>
    </main>

    <!-- FOOTER INJECTION -->
    <div id="footer-placeholder"></div>

    <!-- Scripts -->
    <script src="/js/menu.js"></script>
    <script src="/js/cart-count.js"></script>

    <script>
        // Load header + footer on page
        fetch("/header.html")
            .then(res => res.text())
            .then(html => {
                document.getElementById("header-placeholder").innerHTML = html;
                if (typeof initMenu === 'function') {
                    initMenu();
                }
            });

        fetch("/footer.html")
            .then(res => res.text())
            .then(html => (document.getElementById("footer-placeholder").innerHTML = html));

        // Load Who We Are content from API
        async function loadWhoWeAre() {
            try {
                const response = await fetch('/api/who-we-are');
                const data = await response.json();
                
                const container = document.getElementById('about-content');
                
                if (!data || Object.keys(data).length === 0) {
                    container.innerHTML = '<div class="error">No content available.</div>';
                    return;
                }
                
                container.innerHTML = createWhoWeAreHTML(data);
            } catch (error) {
                console.error('Error loading who we are content:', error);
                document.getElementById('about-content').innerHTML = 
                    '<div class="error">Error loading content. Please try again later.</div>';
            }
        }

        function createWhoWeAreHTML(data) {
            return `
                <!-- Who We Are Section -->
                <section class="full-bleed-section about-section">
                    <div class="content-width--wide">
                        <div class="about-grid">
                            <div class="about-text-container">
                                <h1 class="about-title">${data.title || 'Who we are'}</h1>
                                <div class="about-text">
                                    <p>${data.content || ''}</p>
                                </div>
                            </div>
                            <div class="about-image-container">
                                <img src="${data.imageUrl || ''}" 
                                     alt="Golf swing at Skylinks" 
                                     class="about-image"
                                     loading="lazy">
                            </div>
                        </div>
                    </div>
                </section>

                <!-- Board of Directors Section -->
                ${data.boardMembers && data.boardMembers.length > 0 ? `
                <section class="full-bleed-section board-section">
                    <div class="content-width--wide">
                        <h2 class="section-title">${data.boardYear || '2025'} Board of Directors</h2>
                        
                        <div class="board-grid">
                            ${data.boardMembers.map(member => `
                                <div class="board-member">
                                    ${member.imageUrl ? `
                                    <img src="${member.imageUrl}" 
                                         alt="${member.name || ''} - ${member.title || ''}" 
                                         class="board-member-image"
                                         loading="lazy">
                                    ` : ''}
                                    <h3 class="board-member-name">${member.name || ''}</h3>
                                    ${member.title ? `<div class="board-member-role">${member.title}</div>` : ''}
                                    ${member.description ? `<p class="board-member-bio">${member.description}</p>` : ''}
                                </div>
                            `).join('')}
                        </div>
                    </div>
                </section>
                ` : ''}
            `;
        }

        // Load content when page is ready
        document.addEventListener('DOMContentLoaded', loadWhoWeAre);
    </script>

</body>
</html>
