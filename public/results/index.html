<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <link rel="icon" href="/favicon.ico" type="image/x-icon">
    <link rel="shortcut icon" href="/favicon.ico" type="image/x-icon">
    <title>Tournament Results - Skylinks Men's Golf Club</title>
    <link rel="stylesheet" href="/css/styles.css" />
    <link rel="stylesheet" href="/css/results.css" />

</head>

<body class="results-page">

    <!-- HEADER -->
    <div id="header-placeholder"></div>

    <!-- HERO -->
    <section class="hero-section">
        <div class="hero-background"></div>
        <div class="hero-content">
            <h1>Tournament Results</h1>
        </div>
    </section>

    <!-- RESULTS -->
    <section class="results-section">
        <div class="results-container">
            <div class="event-list"></div>
        </div>
    </section>

    <!-- FOOTER -->
    <div id="footer-placeholder"></div>

    <!-- HIDDEN ADMIN ACCESS -->
    <div id="admin-access" onclick="location.href='/admin/'"></div>

    <!-- SCRIPTS -->
    <script src="/js/menu.js"></script>
    <script src="/js/image.js"></script>
    <script src="/js/cart-count.js"></script>

    <script>
        fetch("/header.html")
            .then(r => r.text())
            .then(html => {
                document.getElementById("header-placeholder").innerHTML = html;
                initMenu();
            });

        fetch("/footer.html")
            .then(r => r.text())
            .then(html => {
                document.getElementById("footer-placeholder").innerHTML = html;
            });

        function toggleEvent(index) {
            document.querySelectorAll('.event-item')[index].classList.toggle('expanded');
            document.querySelectorAll('.expand-btn')[index].classList.toggle('expanded');
            document.querySelectorAll('.event-details')[index].classList.toggle('expanded');
        }

        fetch('/api/results')
            .then(res => res.json())
            .then(results => {
                const list = document.querySelector('.event-list');
                list.innerHTML = '';

                results.forEach((r, i) => {
                    list.innerHTML += `
                        <div class="event-item">
                            <div class="event-main" onclick="toggleEvent(${i})">
                                <div class="event-image" style="background-image:url('${r.image}')"></div>
                                <div class="event-date">
                                    <span class="event-month">${r.month}</span>
                                    <span class="event-day">${r.day}</span>
                                </div>
                                <div class="event-info">
                                    <h3 class="event-title">${r.title}</h3>
                                    <div class="event-meta">
                                        <span>📅 ${r.dateText}</span>
                                        <span>⏰ ${r.timeText}</span>
                                    </div>
                                </div>
                                <div class="event-actions">
                                    <button class="expand-btn">▼</button>
                                </div>
                            </div>
                            <div class="event-details">
                                <div class="details-content">
                                    <div class="results-link-container">
                                        <a href="${r.link}" target="_blank">${r.link}</a>
                                    </div>
                                </div>
                            </div>
                        </div>
                    `;
                });
            });
    </script>

</body>
</html>
