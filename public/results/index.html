<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />

    <link rel="icon" href="/favicon.ico" type="image/x-icon">
    <link rel="shortcut icon" href="/favicon.ico" type="image/x-icon">

    <title>Tournament Results - Skylinks Men's Golf Club</title>

    <link rel="stylesheet" href="/css/styles.css" />

    <style>
        body.results-page {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
        }

        /* ---------------- HERO ---------------- */
        .hero-section {
            position: relative;
            height: 50vh;
            min-height: 400px;
            margin-top: 60px;
            overflow: hidden;
        }

        .hero-background {
            position: absolute;
            inset: 0;
            background-image: url('https://images.squarespace-cdn.com/content/v1/678d4161123ed24a1ff89f0e/9cdae476-9d68-45a9-87e9-80615a519e47/202501+Results.jpg');
            background-size: cover;
            background-position: 28% 50%;
            background-color: rgba(0,0,0,0.25);
            background-blend-mode: multiply;
        }

        .hero-content {
            position: relative;
            height: 100%;
            display: flex;
            align-items: center;
            justify-content: center;
            text-align: center;
        }

        .hero-content h1 {
            color: white;
            font-size: 3rem;
            font-weight: 400;
        }

        /* ---------------- RESULTS ---------------- */
        .results-container {
            max-width: 1200px;
            margin: 0 auto;
            padding: 3rem 2rem;
        }

        .event-list {
            display: flex;
            flex-direction: column;
            gap: 1.5rem;
        }

        .event-item {
            background: #fff;
            border-radius: 12px;
            box-shadow: 0 4px 20px rgba(0,0,0,0.08);
            border: 1px solid #e9ecef;
            overflow: hidden;
            transition: box-shadow 0.3s ease;
        }

        .event-item.expanded {
            box-shadow: 0 8px 30px rgba(0,0,0,0.12);
        }

        .event-main {
            display: flex;
            align-items: center;
            padding: 1rem;
            cursor: pointer;
            min-height: 120px;
        }

        .event-image {
            width: 160px;
            height: 90px;
            border-radius: 8px;
            background-size: cover;
            background-position: center;
            margin-right: 1.5rem;
            flex-shrink: 0;
        }

        .event-date {
            background: #2c3e50;
            color: white;
            border-radius: 8px;
            padding: 0.75rem;
            min-width: 80px;
            text-align: center;
            margin-right: 1.5rem;
        }

        .event-month {
            font-size: 1.4rem;
            font-weight: 600;
            text-transform: uppercase;
        }

        .event-day {
            font-size: 1.4rem;
            font-weight: bold;
            line-height: 1;
        }

        .event-info {
            flex: 1;
        }

        .event-title {
            font-size: 1.7rem;
            font-weight: 400;
            color: #2c3e50;
            margin-bottom: 0.5rem;
        }

        .event-meta {
            display: flex;
            flex-wrap: wrap;
            gap: 1rem;
            font-size: 0.9rem;
            color: #6c757d;
        }

        .event-actions {
            margin-left: 1rem;
        }

        .expand-btn {
            width: 36px;
            height: 36px;
            border-radius: 50%;
            border: none;
            background: #f8f9fa;
            cursor: pointer;
            transition: transform 0.3s ease;
            font-size: 1.1rem;
        }

        .expand-btn.expanded {
            transform: rotate(180deg);
        }

        .event-details {
            display: none;
            background: #f8f9fa;
            border-top: 1px solid #e9ecef;
        }

        .event-details.expanded {
            display: block;
        }

        .details-content {
            padding: 2rem;
            text-align: center;
        }

        .results-link-container a {
            font-weight: 400;
            color: #2c3e50;
            text-decoration: none;
            border-bottom: 2px solid #2c3e50;
        }

        /* ---------------- ADMIN ACCESS ---------------- */
        #admin-access {
            position: absolute;
            top: calc(60px + 50vh); 
            left: 40px;
            width: 30px;
            height: 80px;
            background: transparent;
            cursor: pointer;
            z-index: 9999;
        }


        #admin-access:hover {
            opacity: 0.5;
        }

        /* ---------------- MOBILE ---------------- */
        @media (max-width: 768px) {
            .hero-section {
                height: 20vh;
                min-height: 200px;
            }

            .hero-content h1 {
                font-size: 2.5rem;
            }

            .event-main {
                flex-direction: column;
            }

            .event-image {
                width: 100%;
                height: 220px;
                margin-bottom: 1rem;
            }

            .event-date {
                width: 100%;
                margin-bottom: 1rem;
            }

            .results-link-container a {
                font-size: 0.8rem;
                max-width: 250px; 
                line-height: 2.5;
                padding: 8px 12px;
                white-space: nowrap;
                overflow: hidden;
                text-overflow: ellipsis;
                display: inline-block;
                text-decoration: none;
                border-radius: 4px;
                transition: background-color 0.2s;
            }


        }
    </style>
</head>

<body class="results-page">

    <!-- HEADER -->
    <div id="header-placeholder"></div>

    <!-- HERO -->
    <section class="hero-section">
        <div class="hero-background"></div>
        <div class="hero-content">
            <h1>Tournament Results</h1>
        </div>
    </section>

    <!-- RESULTS -->
    <section class="results-section">
        <div class="results-container">
            <div class="event-list"></div>
        </div>
    </section>

    <!-- FOOTER -->
    <div id="footer-placeholder"></div>

    <!-- HIDDEN ADMIN ACCESS -->
    <div id="admin-access" onclick="location.href='/admin/'"></div>

    <!-- SCRIPTS -->
    <script src="/js/menu.js"></script>
    <script src="/js/image.js"></script>
    <script src="/js/cart-count.js"></script>

    <script>
        fetch("/header.html")
            .then(r => r.text())
            .then(html => {
                document.getElementById("header-placeholder").innerHTML = html;
                initMenu();
            });

        fetch("/footer.html")
            .then(r => r.text())
            .then(html => {
                document.getElementById("footer-placeholder").innerHTML = html;
            });

        function toggleEvent(index) {
            document.querySelectorAll('.event-item')[index].classList.toggle('expanded');
            document.querySelectorAll('.expand-btn')[index].classList.toggle('expanded');
            document.querySelectorAll('.event-details')[index].classList.toggle('expanded');
        }

        fetch('/api/results')
            .then(res => res.json())
            .then(results => {
                const list = document.querySelector('.event-list');
                list.innerHTML = '';

                results.forEach((r, i) => {
                    list.innerHTML += `
                        <div class="event-item">
                            <div class="event-main" onclick="toggleEvent(${i})">
                                <div class="event-image" style="background-image:url('${r.image}')"></div>
                                <div class="event-date">
                                    <span class="event-month">${r.month}</span>
                                    <span class="event-day">${r.day}</span>
                                </div>
                                <div class="event-info">
                                    <h3 class="event-title">${r.title}</h3>
                                    <div class="event-meta">
                                        <span>📅 ${r.dateText}</span>
                                        <span>⏰ ${r.timeText}</span>
                                    </div>
                                </div>
                                <div class="event-actions">
                                    <button class="expand-btn">▼</button>
                                </div>
                            </div>
                            <div class="event-details">
                                <div class="details-content">
                                    <div class="results-link-container">
                                        <a href="${r.link}" target="_blank">${r.link}</a>
                                    </div>
                                </div>
                            </div>
                        </div>
                    `;
                });
            });
    </script>

</body>
</html>
