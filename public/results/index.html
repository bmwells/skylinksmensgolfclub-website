<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <link rel="icon" href="/favicon.ico" type="image/x-icon">
    <link rel="shortcut icon" href="/favicon.ico" type="image/x-icon">
    <title>Tournament Results - Skylinks Men's Golf Club</title>
    <link rel="stylesheet" href="/css/styles.css" />
    <link rel="stylesheet" href="/css/results.css" />

</head>

<body class="results-page">

    <!-- HEADER -->
    <div id="header-placeholder"></div>

    <!-- HERO -->
    <section class="hero-section">
        <div class="hero-background" id="hero-background"></div>
        <div class="hero-content">
            <h1>Tournament Results</h1>
        </div>
    </section>

    <!-- RESULTS -->
    <section class="results-section">
        <div class="results-container">
            <div class="event-list"></div>
        </div>
    </section>

    <!-- FOOTER -->
    <div id="footer-placeholder"></div>

    <!-- HIDDEN ADMIN ACCESS -->
    <div id="admin-access" onclick="location.href='/admin/'"></div>

    <!-- SCRIPTS -->
    <script src="/js/menu.js"></script>
    <script src="/js/cart-count.js"></script>

    <script>
        fetch("/header.html")
            .then(r => r.text())
            .then(html => {
                document.getElementById("header-placeholder").innerHTML = html;
                initMenu();
            });

        fetch("/footer.html")
            .then(r => r.text())
            .then(html => {
                document.getElementById("footer-placeholder").innerHTML = html;
            });

        // Load results banner image
        async function loadResultsBanner() {
            try {
                const response = await fetch('/api/images');
                const images = await response.json();
                const resultsImage = images.find(img => img.id === 'results');
                
                const heroBackground = document.getElementById('hero-background');
                if (heroBackground && resultsImage && resultsImage.imageUrl) {
                    heroBackground.style.backgroundImage = `url('${resultsImage.imageUrl}')`;
                }
            } catch (error) {
                console.error('Error loading results banner:', error);
                const heroBackground = document.getElementById('hero-background');
            }
        }

        function toggleEvent(index) {
            document.querySelectorAll('.event-item')[index].classList.toggle('expanded');
            document.querySelectorAll('.expand-btn')[index].classList.toggle('expanded');
            document.querySelectorAll('.event-details')[index].classList.toggle('expanded');
        }

        // Function to sort results by month and day (most recent first)
        function sortResultsByDate(results) {
            // Create a copy to avoid mutating the original array
            const sortedResults = [...results];
            
            // Month mapping for sorting (3-letter abbreviations)
            const monthOrder = {
                'jan': 1, 'feb': 2, 'mar': 3, 'apr': 4, 'may': 5, 'jun': 6,
                'jul': 7, 'aug': 8, 'sep': 9, 'oct': 10, 'nov': 11, 'dec': 12
            };
            
            sortedResults.sort((a, b) => {
                // Get month abbreviations (first 3 letters, lowercase)
                const monthA = a.month ? a.month.substring(0, 3).toLowerCase() : '';
                const monthB = b.month ? b.month.substring(0, 3).toLowerCase() : '';
                
                // Get day numbers
                const dayA = parseInt(a.day) || 0;
                const dayB = parseInt(b.day) || 0;
                
                // Get month order numbers
                const monthOrderA = monthOrder[monthA] || 0;
                const monthOrderB = monthOrder[monthB] || 0;
                
                // If same month, compare by day (higher day = more recent)
                if (monthOrderA === monthOrderB) {
                    return dayB - dayA; // Descending day order
                }
                
                // Compare by month order (descending - higher month number = more recent)
                return monthOrderB - monthOrderA;
            });
            
            return sortedResults;
        }

        fetch('/api/results')
            .then(res => res.json())
            .then(results => {
                // Sort the results before displaying
                const sortedResults = sortResultsByDate(results);
                
                const list = document.querySelector('.event-list');
                list.innerHTML = '';

                sortedResults.forEach((r, i) => {
                    list.innerHTML += `
                        <div class="event-item">
                            <div class="event-main" onclick="toggleEvent(${i})">
                                <div class="event-image" style="background-image:url('${r.image}')"></div>
                                <div class="event-date">
                                    <span class="event-month">${r.month}</span>
                                    <span class="event-day">${r.day}</span>
                                </div>
                                <div class="event-info">
                                    <h3 class="event-title">${r.title}</h3>
                                    <div class="event-meta">
                                        <span>📅 ${r.dateText}</span>
                                        <span>⏰ ${r.timeText}</span>
                                    </div>
                                </div>
                                <div class="event-actions">
                                    <button class="expand-btn">▼</button>
                                </div>
                            </div>
                            <div class="event-details">
                                <div class="details-content">
                                    <div class="results-link-container">
                                        <a href="${r.link}" target="_blank">${r.link}</a>
                                    </div>
                                </div>
                            </div>
                        </div>
                    `;
                });
            });

        // Load banner when page is ready
        document.addEventListener('DOMContentLoaded', loadResultsBanner);
    </script>

</body>
</html>
