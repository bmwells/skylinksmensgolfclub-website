<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <link rel="icon" href="/favicon.ico" type="image/x-icon">
    <link rel="shortcut icon" href="/favicon.ico" type="image/x-icon">
    <title>Tournament Results - Skylinks Men's Golf Club</title>
    <link rel="stylesheet" href="/css/styles.css" />
    <link rel="stylesheet" href="/css/results.css" />

</head>

<body class="results-page">

    <!-- HEADER -->
    <div id="header-placeholder"></div>

    <!-- HERO -->
    <section class="hero-section">
        <div class="hero-background" id="hero-background"></div>
        <div class="hero-content">
            <h1>Tournament Results</h1>
        </div>
    </section>

    <!-- RESULTS -->
    <section class="results-section">
        <div class="results-container">
            <div class="event-list"></div>
        </div>
    </section>

    <!-- FOOTER -->
    <div id="footer-placeholder"></div>

    <!-- HIDDEN ADMIN ACCESS -->
    <div id="admin-access" onclick="location.href='/admin/'"></div>

    <!-- SCRIPTS -->
    <script src="/js/menu.js"></script>
    <script src="/js/cart-count.js"></script>

    <script>
        fetch("/header.html")
            .then(r => r.text())
            .then(html => {
                document.getElementById("header-placeholder").innerHTML = html;
                initMenu();
            });

        fetch("/footer.html")
            .then(r => r.text())
            .then(html => {
                document.getElementById("footer-placeholder").innerHTML = html;
            });

        // Load results banner image
        async function loadResultsBanner() {
            try {
                const response = await fetch('/api/images');
                const images = await response.json();
                const resultsImage = images.find(img => img.id === 'results');
                
                const heroBackground = document.getElementById('hero-background');
                if (heroBackground && resultsImage && resultsImage.imageUrl) {
                    heroBackground.style.backgroundImage = `url('${resultsImage.imageUrl}')`;
                }
            } catch (error) {
                console.error('Error loading results banner:', error);
                const heroBackground = document.getElementById('hero-background');
            }
        }

        function toggleEvent(index) {
            document.querySelectorAll('.event-item')[index].classList.toggle('expanded');
            document.querySelectorAll('.expand-btn')[index].classList.toggle('expanded');
            document.querySelectorAll('.event-details')[index].classList.toggle('expanded');
        }

        // Function to parse date from result object
        function parseDateFromResult(result) {
            // Extract year from dateText
            let year = new Date().getFullYear(); // Default to current year
            
            if (result.dateText) {
                // Look for 4-digit year in dateText
                const yearMatch = result.dateText.match(/\b(20\d{2})\b/);
                if (yearMatch) {
                    year = parseInt(yearMatch[1]);
                }
            }
            
            // Get month and day
            const monthAbbr = result.month ? result.month.substring(0, 3).toLowerCase() : '';
            const dayText = result.day || '1';
            
            // Handle date ranges (e.g., "16-17")
            let day = 1;
            if (dayText.includes('-')) {
                // If it's a range, use the first day for sorting
                day = parseInt(dayText.split('-')[0]) || 1;
            } else {
                day = parseInt(dayText) || 1;
            }
            
            // Month mapping (3-letter abbreviations)
            const monthMap = {
                'jan': 0, 'feb': 1, 'mar': 2, 'apr': 3, 'may': 4, 'jun': 5,
                'jul': 6, 'aug': 7, 'sep': 8, 'oct': 9, 'nov': 10, 'dec': 11
            };
            
            const monthIndex = monthMap[monthAbbr] !== undefined ? monthMap[monthAbbr] : 0;
            
            // Create date object for comparison
            return new Date(year, monthIndex, day);
        }

        // Function to sort results by date (most recent first - DESCENDING)
        function sortResultsByDateDescending(results) {
            // Create a copy to avoid mutating the original array
            const sortedResults = [...results];
            
            sortedResults.sort((a, b) => {
                const dateA = parseDateFromResult(a);
                const dateB = parseDateFromResult(b);
                
                // Sort descending (most recent first)
                return dateB - dateA;
            });
            
            return sortedResults;
        }

        fetch('/api/results')
            .then(res => res.json())
            .then(results => {
                // Sort the results with most recent first (considering year)
                const sortedResults = sortResultsByDateDescending(results);
                
                const list = document.querySelector('.event-list');
                list.innerHTML = '';

                sortedResults.forEach((r, i) => {
                    list.innerHTML += `
                        <div class="event-item">
                            <div class="event-main" onclick="toggleEvent(${i})">
                                <div class="event-image" style="background-image:url('${r.image}')"></div>
                                <div class="event-date">
                                    <span class="event-month">${r.month}</span>
                                    <span class="event-day">${r.day}</span>
                                </div>
                                <div class="event-info">
                                    <h3 class="event-title">${r.title}</h3>
                                    <div class="event-meta">
                                        <span>📅 ${r.dateText}</span>
                                        <span>⏰ ${r.timeText}</span>
                                    </div>
                                </div>
                                <div class="event-actions">
                                    <button class="expand-btn">▼</button>
                                </div>
                            </div>
                            <div class="event-details">
                                <div class="details-content">
                                    <div class="results-link-container">
                                        <a href="${r.link}" target="_blank">${r.link}</a>
                                    </div>
                                </div>
                            </div>
                        </div>
                    `;
                });
            });

        // Load banner when page is ready
        document.addEventListener('DOMContentLoaded', loadResultsBanner);
    </script>

</body>
</html>
