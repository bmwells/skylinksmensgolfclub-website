<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <link rel="icon" href="/favicon.ico" type="image/x-icon">
  <link rel="shortcut icon" href="/favicon.ico" type="image/x-icon">
  <title>Order Success - Skylinks Men's Golf Club</title>
  <link rel="stylesheet" href="/css/styles.css" />
  <style>
    body { 
        font-family: system-ui, sans-serif; 
        background:#fff; 
        margin:0; 
    }
    
    .success-wrap { 
        max-width:900px; 
        margin:120px auto 60px; 
        padding:0 20px; 
        text-align:center; 
    }
    
    h1 { 
        font-size:2.2rem; 
        margin-bottom:6px; 
        color:#111; 
        font-weight: 400; 
    }
    
    #subtext {
        font-size: 1.1rem;
        color: #666;
        margin-bottom: 30px;
        line-height: 1.6;
    }
    
    .order-summary { 
        margin-top:20px; 
        text-align:left; 
        border:1px solid #eee; 
        border-radius:8px; 
        padding:30px; 
        background:#fafafa; 
    }
    
    .item-row { 
        padding:12px 0; 
        border-bottom:1px solid #eaeaea; 
        display:flex; 
        justify-content:space-between; 
    }
    
    .item-row:last-child { 
        border-bottom:none; 
    }
    
    .btn { 
        display:inline-block; 
        margin-top:18px; 
        padding:12px 28px; 
        background:#000; 
        color:#fff; 
        border-radius:32px; 
        text-decoration:none; 
        font-size: 1rem;
        border: none;
        cursor: pointer;
        transition: background-color 0.3s;
    }
    
    .btn:hover {
        background: #1e3a23;
    }
    
    .btn-secondary {
        background: #6c757d;
        margin-left: 10px;
    }
    
    .btn-secondary:hover {
        background: #545b62;
    }
    
    .loading {
        color: #666;
        font-size: 1.1rem;
        text-align: center;
        padding: 20px;
    }
    
    .error {
        color: #dc3545;
        background: #f8d7da;
        padding: 20px;
        border-radius: 8px;
        margin: 20px 0;
    }
    
    .success-icon {
        font-size: 60px;
        color: #28a745;
        margin-bottom: 20px;
    }
    
    .player-details {
        background: #f0f2f5;
        padding: 15px;
        border-radius: 6px;
        margin: 15px 0;
        border-left: 4px solid #28a745;
    }
    
    .player-details h5 {
        margin-top: 0;
        color: var(--primary);
        font-size: 1.1rem;
        margin-bottom: 10px;
    }
    
    .player-details h6 {
        margin-top: 0;
        color: #555;
        font-size: 1rem;
        margin-bottom: 8px;
    }
    
    .player-info {
        display: grid;
        grid-template-columns: repeat(auto-fill, minmax(200px, 1fr));
        gap: 8px;
        margin-top: 10px;
    }
    
    .player-info div {
        font-size: 0.9rem;
    }
    
    .player-info strong {
        display: inline-block;
        min-width: 100px;
        color: #666;
    }
    
    .section-title {
        font-size: 1.2rem;
        color: var(--primary);
        margin: 25px 0 15px 0;
        padding-bottom: 8px;
        border-bottom: 1px solid #eee;
    }
    
    .receipt-items {
        background: white;
        padding: 15px;
        border-radius: 6px;
        margin: 10px 0;
    }
    
    .receipt-item {
        padding: 10px 0;
        border-bottom: 1px solid #eee;
        display: flex;
        justify-content: space-between;
        align-items: center;
    }
    
    .receipt-item:last-child {
        border-bottom: none;
    }
    
    .total-row {
        font-weight: 700;
        font-size: 1.1rem;
        margin-top: 15px;
        padding-top: 15px;
        border-top: 2px solid #ddd;
        display: flex;
        justify-content: space-between;
    }
    
    .order-meta {
        display: grid;
        grid-template-columns: repeat(auto-fill, minmax(250px, 1fr));
        gap: 15px;
        margin-bottom: 20px;
        padding-bottom: 15px;
        border-bottom: 1px solid #eee;
    }
    
    .order-meta div {
        font-size: 0.95rem;
    }
    
    .order-meta strong {
        color: #666;
        display: block;
        margin-bottom: 4px;
        font-size: 0.9rem;
    }
    
    @media (max-width: 768px) {
        .success-wrap {
            margin: 100px auto 40px;
            padding: 0 15px;
        }
        
        h1 {
            font-size: 1.8rem;
        }
        
        .order-summary {
            padding: 20px;
        }
        
        .player-info {
            grid-template-columns: 1fr;
        }
        
        .order-meta {
            grid-template-columns: 1fr;
        }
        
        .btn {
            display: block;
            width: 100%;
            margin: 10px 0;
        }
        
        .btn-secondary {
            margin-left: 0;
        }
    }
  </style>
</head>
<body>

    <!-- HEADER INJECTION -->
    <div id="header-placeholder"></div>

    <div class="success-wrap">
        <div class="success-icon">✓</div>
        <h1>Thank you — your order is complete</h1>
        <p id="subtext">A receipt has been sent to your email address with all the details below.</p>

        <div id="order-info" class="loading">
            Loading order details...
        </div>

        <div id="action-buttons" style="display: none;">
            <a class="btn" href="/">Return Home</a>
            <a class="btn btn-secondary" href="/tournament-entry">Browse Tournaments</a>
        </div>
    </div>

    <!-- FOOTER INJECTION -->
    <div id="footer-placeholder"></div>

    <!-- Scripts -->
    <script src="/js/menu.js"></script>
    <script>
      // Load header + footer on page
      fetch("/header.html")
          .then(res => res.text())
          .then(html => {
              document.getElementById("header-placeholder").innerHTML = html;
              if (typeof initMenu === "function") initMenu();
          });

      fetch("/footer.html")
          .then(res => res.text())
          .then(html => (document.getElementById("footer-placeholder").innerHTML = html));

      // Clear client cart
      try { 
          localStorage.removeItem('skylinks_cart_v1'); 
          document.dispatchEvent(new Event('cartUpdated'));
      } catch (e) { /* ignore */ }

      // Show order info by fetching session details from server
      const params = new URLSearchParams(window.location.search);
      const sessionId = params.get('session_id');

      if (!sessionId) {
        document.getElementById('order-info').innerHTML = `
            <div class="error">
                <p>We could not locate your order details.</p>
                <p><small>No session ID found in URL.</small></p>
            </div>`;
        document.getElementById('action-buttons').style.display = 'block';
      } else {
        // Use the new API endpoint for detailed order information
        fetch('/api/checkout-session/' + encodeURIComponent(sessionId))
          .then(r => {
              if (!r.ok) {
                  throw new Error('Failed to fetch order details');
              }
              return r.json();
          })
          .then(session => {
            if (session.error) {
              document.getElementById('order-info').innerHTML = `
                <div class="error">
                    <p>Unable to load order details.</p>
                    <p><small>${session.error}</small></p>
                </div>`;
              document.getElementById('action-buttons').style.display = 'block';
              return;
            }

            const container = document.getElementById('order-info');
            container.innerHTML = '';
            container.className = 'order-summary';

            // Create order details HTML
            let orderHTML = '';
            
            // Order metadata
            orderHTML += `
                <div class="order-meta">
                    <div>
                        <strong>Order ID:</strong>
                        <span>${session.id || 'N/A'}</span>
                    </div>
                    <div>
                        <strong>Date:</strong>
                        <span>${session.created ? new Date(session.created).toLocaleDateString() + ' ' + new Date(session.created).toLocaleTimeString() : 'N/A'}</span>
                    </div>
                    <div>
                        <strong>Status:</strong>
                        <span>${session.payment_status || 'N/A'}</span>
                    </div>
                    <div>
                        <strong>Email:</strong>
                        <span>${session.customer_email || 'N/A'}</span>
                    </div>
                </div>
            `;

            // Process items from metadata
            if (session.metadata && session.metadata.items && session.metadata.items.length > 0) {
                orderHTML += `<div class="section-title">Order Details</div>`;
                
                session.metadata.items.forEach((item, index) => {
                    orderHTML += `<div style="margin-bottom: 25px; padding-bottom: 20px; border-bottom: 1px solid #eee;">`;
                    orderHTML += `<h5 style="margin: 0 0 10px 0; color: var(--primary);">${item.name} - $${parseFloat(item.price || 0).toFixed(2)}</h5>`;
                    
                    if (item.type === 'tournament') {
                        // Handle both old and new metadata structures
                        let mainPlayer = item.mainPlayer || item.main_player || {};
                        let additionalPlayers = item.additionalPlayers || item.additional_players || [];
                        
                        // Fallback for old structure
                        if (!mainPlayer.fullName && item.main_fullName) {
                            mainPlayer = {
                                firstName: item.main_firstName || '',
                                lastName: item.main_lastName || '',
                                fullName: item.main_fullName || '',
                                email: item.main_email || '',
                                phone: item.main_phoneNum || '',
                                ghin: item.main_ghin || '',
                                index: item.main_index || '',
                                entryNum: item.main_entryNum || '',
                                startingTime: item.main_startingTime || '',
                                cartOption: item.main_cartOption || '',
                                sidePots: item.main_sidePots || 'false',
                                roulette: item.main_roulette || 'false'
                            };
                        }
                        
                        // Main player details
                        orderHTML += `
                            <div class="player-details">
                                <h5>Primary Player:</h5>
                                <div class="player-info">
                                    <div><strong>Name:</strong> ${mainPlayer.fullName || 'N/A'}</div>
                                    <div><strong>Email:</strong> ${mainPlayer.email || 'N/A'}</div>
                                    <div><strong>Phone:</strong> ${mainPlayer.phone || 'N/A'}</div>
                                    <div><strong>GHIN:</strong> ${mainPlayer.ghin || 'N/A'}</div>
                                    <div><strong>Handicap Index:</strong> ${mainPlayer.index || 'N/A'}</div>
                                    <div><strong>Entry #:</strong> ${mainPlayer.entryNum || 'N/A'}</div>
                                    <div><strong>Start Time:</strong> ${mainPlayer.startingTime || 'N/A'}</div>
                                    <div><strong>Cart Option:</strong> ${mainPlayer.cartOption || 'Not selected'}</div>
                                    <div><strong>Side Pots:</strong> ${mainPlayer.sidePots === 'true' ? 'Yes' : 'No'}</div>
                                    <div><strong>Roulette:</strong> ${mainPlayer.roulette === 'true' ? 'Yes' : 'No'}</div>
                                </div>
                            </div>
                        `;
                        
                        // Additional players
                        if (additionalPlayers.length > 0) {
                            orderHTML += `<h5 style="margin: 15px 0 10px 0;">Additional Players:</h5>`;
                            additionalPlayers.forEach((player, i) => {
                                orderHTML += `
                                    <div class="player-details" style="margin-bottom: 10px;">
                                        <h6>Player #${i + 2}:</h6>
                                        <div class="player-info">
                                            <div><strong>Name:</strong> ${player.fullName || 'N/A'}</div>
                                            <div><strong>Email:</strong> ${player.email || 'N/A'}</div>
                                            <div><strong>Phone:</strong> ${player.phone || 'N/A'}</div>
                                            <div><strong>GHIN:</strong> ${player.ghin || 'N/A'}</div>
                                            <div><strong>Index:</strong> ${player.index || 'N/A'}</div>
                                            <div><strong>Entry #:</strong> ${player.entryNum || 'N/A'}</div>
                                        </div>
                                    </div>
                                `;
                            });
                        }
                    } else if (item.type === 'membership') {
                        // Handle both old and new metadata structures
                        let member = item.member || item.member_data || {};
                        
                        // Fallback for old structure
                        if (!member.fullName && item.member_fullName) {
                            member = {
                                firstName: item.member_firstName || '',
                                lastName: item.member_lastName || '',
                                fullName: item.member_fullName || '',
                                email: item.member_email || '',
                                phone: item.member_phoneNum || '',
                                ghin: item.member_ghin || ''
                            };
                        }
                        
                        orderHTML += `
                            <div class="player-details">
                                <h5>Member Information:</h5>
                                <div class="player-info">
                                    <div><strong>Name:</strong> ${member.fullName || 'N/A'}</div>
                                    <div><strong>Email:</strong> ${member.email || 'N/A'}</div>
                                    <div><strong>Phone:</strong> ${member.phone || 'N/A'}</div>
                                    <div><strong>GHIN:</strong> ${member.ghin || 'N/A'}</div>
                                </div>
                            </div>
                        `;
                    }
                    
                    orderHTML += `</div>`;
                });
            }

            // Line items from Stripe (receipt items)
            if (session.line_items && session.line_items.length > 0) {
                orderHTML += `<div class="section-title">Receipt Items</div>`;
                orderHTML += `<div class="receipt-items">`;
                
                let subtotal = 0;
                session.line_items.forEach(item => {
                    const amount = item.amount_total / 100;
                    subtotal += amount;
                    
                    orderHTML += `
                        <div class="receipt-item">
                            <div>${item.description || 'Item'}</div>
                            <div>$${amount.toFixed(2)}</div>
                        </div>
                    `;
                });
                
                orderHTML += `<div class="total-row">
                    <div>Total</div>
                    <div>$${subtotal.toFixed(2)}</div>
                </div>`;
                orderHTML += `</div>`;
            }

            container.innerHTML = orderHTML;
            document.getElementById('action-buttons').style.display = 'block';
          })
          .catch(err => {
            console.error('Error fetching order details:', err);
            document.getElementById('order-info').innerHTML = `
                <div class="error">
                    <p>Error loading order details. Your receipt has been emailed to you.</p>
                    <p><small>${err.message}</small></p>
                </div>`;
            document.getElementById('action-buttons').style.display = 'block';
          });
      }
    </script>
</body>
</html>
