<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width,initial-scale=1" />
    <link rel="icon" href="/favicon.ico" type="image/x-icon">
    <link rel="shortcut icon" href="/favicon.ico" type="image/x-icon">
    <title>Payment Successful - Skylinks Men's Golf Club</title>
    <link rel="stylesheet" href="/css/styles.css" />
    <link rel="stylesheet" href="/css/success.css" />
</head>
<body>
    <!-- HEADER INJECTION -->
    <div id="header-placeholder"></div>

    <section class="success-page-section">
        <div class="success-container">
            <div class="success-icon">✓</div>
            <h1 class="success-title">Payment Successful!</h1>
            <p class="success-message">Thank you for your purchase. Your registration has been confirmed.</p>
            
            <div id="order-details" class="order-details">
                <p>Loading order details...</p>
            </div>
            
            <div class="success-actions">
                <a href="/" class="btn btn-primary">Return to Home</a>
                <a href="/tournament-entry" class="btn btn-secondary">View Tournaments</a>
            </div>
        </div>
    </section>

    <!-- FOOTER INJECTION -->
    <div id="footer-placeholder"></div>

    <!-- Scripts -->
    <script src="/js/cart.js"></script>
    <script src="/js/cart-count.js"></script>

    <script>
        // Load header + footer
        fetch("/header.html")
            .then(res => res.text())
            .then(html => {
                document.getElementById("header-placeholder").innerHTML = html;
                if (typeof initMenu === "function") initMenu();
            });

        fetch("/footer.html")
            .then(res => res.text())
            .then(html => (document.getElementById("footer-placeholder").innerHTML = html));

        // Function to truncate order ID
        function truncateOrderId(orderId) {
            if (!orderId) return '';
            if (orderId.length <= 20) return orderId;
            return orderId.substring(0, 10) + '...' + orderId.substring(orderId.length - 10);
        }

        // Function to copy order ID to clipboard
        function copyToClipboard(text, button) {
            navigator.clipboard.writeText(text).then(() => {
                const originalText = button.innerHTML;
                button.innerHTML = `
                    <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 20 20" fill="currentColor">
                        <path fill-rule="evenodd" d="M16.707 5.293a1 1 0 010 1.414l-8 8a1 1 0 01-1.414 0l-4-4a1 1 0 011.414-1.414L8 12.586l7.293-7.293a1 1 0 011.414 0z" clip-rule="evenodd" />
                    </svg>
                    Copied!
                `;
                button.classList.add('copied');
                
                // Revert button after 2 seconds
                setTimeout(() => {
                    button.innerHTML = originalText;
                    button.classList.remove('copied');
                }, 2000);
            }).catch(err => {
                console.error('Failed to copy: ', err);
                alert('Failed to copy order ID. Please copy it manually.');
            });
        }

        // Get session ID from URL
        const urlParams = new URLSearchParams(window.location.search);
        const sessionId = urlParams.get('session_id');
        
        if (sessionId) {
            // Fetch order details
            fetch(`/api/checkout-session/${sessionId}`)
                .then(res => res.json())
                .then(data => {
                    const orderDetails = document.getElementById('order-details');
                    
                    if (data.error) {
                        orderDetails.innerHTML = `<p class="error">Error loading order details: ${data.error}</p>`;
                        return;
                    }
                    
                    const truncatedId = truncateOrderId(data.id);
                    
                    let html = `
                        <div class="order-summary">
                            <h3>Order Summary</h3>
                            <div class="order-info-grid">
                                <div class="order-info-item">
                                    <strong>Order ID</strong>
                                    <div class="order-id-container">
                                        <div class="order-id-truncated" title="${data.id}">${truncatedId}</div>
                                        <div class="tooltip">
                                            <button class="copy-btn" onclick="copyToClipboard('${data.id}', this)">
                                                <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 20 20" fill="currentColor">
                                                    <path d="M8 3a1 1 0 011-1h2a1 1 0 110 2H9a1 1 0 01-1-1z" />
                                                    <path d="M6 3a2 2 0 00-2 2v11a2 2 0 002 2h8a2 2 0 002-2V5a2 2 0 00-2-2 3 3 0 01-3 3H9a3 3 0 01-3-3z" />
                                                </svg>
                                                Copy
                                            </button>
                                            <span class="tooltip-text">Copy Order ID</span>
                                        </div>
                                    </div>
                                    <div class="order-id-full" id="full-order-id">${data.id}</div>
                                </div>
                                <div class="order-info-item">
                                    <strong>Total Amount</strong>
                                    <span>$${(data.amount_total / 100).toFixed(2)}</span>
                                </div>
                                <div class="order-info-item">
                                    <strong>Customer Email</strong>
                                    <span>${data.customer_email || 'Not provided'}</span>
                                </div>
                                <div class="order-info-item">
                                    <strong>Payment Status</strong>
                                    <span style="color: #4CAF50; font-weight: bold;">${data.payment_status}</span>
                                </div>
                                <div class="order-info-item">
                                    <strong>Date</strong>
                                    <span>${new Date(data.created).toLocaleDateString('en-US', { 
                                        weekday: 'long', 
                                        year: 'numeric', 
                                        month: 'long', 
                                        day: 'numeric',
                                        hour: '2-digit',
                                        minute: '2-digit'
                                    })}</span>
                                </div>
                                <div class="order-info-item">
                                    <strong>Items</strong>
                                    <span>${data.metadata?.itemsCount || '0'} item(s)</span>
                                </div>
                            </div>
                    `;
                    
                    if (data.metadata && data.metadata.items && data.metadata.items.length > 0) {
                        html += '<div class="order-items"><h4>Items Purchased:</h4>';
                        
                        data.metadata.items.forEach((item, index) => {
                            html += `
                                <div class="order-item">
                                    <div class="item-name">${item.name}</div>
                                    <div class="item-price">$${parseFloat(item.price).toFixed(2)}</div>
                            `;
                            
                            // Display tournament details
                            if (item.type === 'tournament') {
                                // Main Player
                                if (item.mainPlayer) {
                                    html += `
                                        <div class="player-details">
                                            <div class="player-header">Player 1</div>
                                            <div class="player-info">
                                                <div class="player-field">
                                                    <strong>Name</strong>
                                                    <span>${item.mainPlayer.name || 'Not provided'}</span>
                                                </div>
                                                <div class="player-field">
                                                    <strong>Email</strong>
                                                    <span>${item.mainPlayer.email || 'Not provided'}</span>
                                                </div>
                                                <div class="player-field">
                                                    <strong>Phone</strong>
                                                    <span>${item.mainPlayer.phone || 'Not provided'}</span>
                                                </div>
                                                <div class="player-field">
                                                    <strong>GHIN</strong>
                                                    <span>${item.mainPlayer.ghin || 'Not provided'}</span>
                                                </div>
                                            </div>
                                    `;
                                    
                                    // Add-ons for main player
                                    const addons = [];
                                    if (item.mainPlayer.sidePots === 'true') addons.push('Side Pots');
                                    if (item.mainPlayer.roulette === 'true') addons.push('Roulette');
                                    
                                    if (addons.length > 0) {
                                        html += `<div class="add-ons">`;
                                        addons.forEach(addon => {
                                            html += `<span class="add-on-tag">${addon}</span>`;
                                        });
                                        html += `</div>`;
                                    }
                                    
                                    // Cart Option
                                    if (item.mainPlayer.cartOption) {
                                        html += `
                                            <div style="margin-top: 10px;">
                                                <span class="cart-option-tag">Cart: ${item.mainPlayer.cartOption}</span>
                                            </div>
                                        `;
                                    }
                                    
                                    // Starting Time
                                    if (item.mainPlayer.startingTime) {
                                        html += `
                                            <div style="margin-top: 10px; font-size: 14px;">
                                                <strong>Starting Time:</strong> ${item.mainPlayer.startingTime}
                                            </div>
                                        `;
                                    }
                                    
                                    html += `</div>`; // Close player-details
                                }
                                
                                // Additional Players
                                if (item.additionalPlayers && item.additionalPlayers.length > 0) {
                                    item.additionalPlayers.forEach((player, playerIndex) => {
                                        html += `
                                            <div class="player-details" style="margin-top: 15px;">
                                                <div class="player-header">Player ${playerIndex + 2}</div>
                                                <div class="player-info">
                                                    <div class="player-field">
                                                        <strong>Name</strong>
                                                        <span>${player.name || 'Not provided'}</span>
                                                    </div>
                                                    <div class="player-field">
                                                        <strong>Email</strong>
                                                        <span>${player.email || 'Not provided'}</span>
                                                    </div>
                                                    <div class="player-field">
                                                        <strong>Phone</strong>
                                                        <span>${player.phone || 'Not provided'}</span>
                                                    </div>
                                                    <div class="player-field">
                                                        <strong>GHIN</strong>
                                                        <span>${player.ghin || 'Not provided'}</span>
                                                    </div>
                                                </div>
                                            </div>
                                        `;
                                    });
                                }
                                
                                // Tournament ID
                                if (item.tournamentId) {
                                    html += `
                                        <div style="margin-top: 15px; font-size: 14px; color: #666;">
                                            <strong>Tournament ID:</strong> ${item.tournamentId}
                                        </div>
                                    `;
                                }
                                
                            } else if (item.type === 'membership' && item.member) {
                                // Membership details
                                html += `
                                    <div class="player-details">
                                        <div class="player-info">
                                            <div class="player-field">
                                                <strong>Name</strong>
                                                <span>${item.member.name || 'Not provided'}</span>
                                            </div>
                                            <div class="player-field">
                                                <strong>Email</strong>
                                                <span>${item.member.email || 'Not provided'}</span>
                                            </div>
                                            <div class="player-field">
                                                <strong>Phone</strong>
                                                <span>${item.member.phone || 'Not provided'}</span>
                                            </div>
                                            <div class="player-field">
                                                <strong>GHIN</strong>
                                                <span>${item.member.ghin || 'Not provided'}</span>
                                            </div>
                                        </div>
                                    </div>
                                `;
                            }
                            
                            html += `</div>`; // Close order-item
                        });
                        
                        html += '</div>'; // Close order-items
                    } else {
                        html += `
                            <div class="order-items">
                                <div class="no-items">No item details available</div>
                            </div>
                        `;
                    }
                    
                    html += `</div>`; // Close order-summary
                    orderDetails.innerHTML = html;
                })
                .catch(error => {
                    document.getElementById('order-details').innerHTML = 
                        `<p class="error">Error loading order details. Please contact support.</p>`;
                    console.error('Error loading order details:', error);
                });
        } else {
            document.getElementById('order-details').innerHTML = 
                `<p class="error">No session ID found. Please contact support if you believe this is an error.</p>`;
        }
        
        // Make copyToClipboard function globally available
        window.copyToClipboard = copyToClipboard;
    </script>
</body>
</html>
