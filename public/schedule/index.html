<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <link rel="icon" href="/favicon.ico" type="image/x-icon">
    <link rel="shortcut icon" href="/favicon.ico" type="image/x-icon">
    <title>Schedule - Skylinks Men's Golf Club</title>
    <link rel="stylesheet" href="/css/styles.css" />
    <link rel="stylesheet" href="/css/schedule.css" />
</head>
<body class="schedule-page">
    <!-- HEADER INJECTION -->
    <div id="header-placeholder"></div>

    <!-- Hero Section -->
    <section class="hero-section">
        <div class="hero-background" id="hero-background"></div>
        <div class="hero-content">
            <div>
                <h1>Tournament Schedule</h1>
            </div>
        </div>
    </section>

    <!-- Events Section -->
    <section class="events-section">
        <div class="events-container">
            <div class="event-list" id="events-container">
                <div class="loading" id="loading">Loading schedule...</div>
            </div>
        </div>
    </section>

    <!-- FOOTER INJECTION -->
    <div id="footer-placeholder"></div>

    <!-- Scripts -->
    <script src="/js/menu.js"></script>
    <script src="/js/cart-count.js"></script>
    
    <script>
        // Load header + footer on page
        fetch("/header.html")
            .then(res => res.text())
            .then(html => {
                document.getElementById("header-placeholder").innerHTML = html;
                if (typeof initMenu === 'function') {
                    initMenu();
                }
            });

        fetch("/footer.html")
            .then(res => res.text())
            .then(html => (document.getElementById("footer-placeholder").innerHTML = html));

        // Load schedule banner image
        async function loadScheduleBanner() {
            try {
                const response = await fetch('/api/images');
                const images = await response.json();
                const scheduleImage = images.find(img => img.id === 'schedule');
                
                const heroBackground = document.getElementById('hero-background');
                if (heroBackground && scheduleImage && scheduleImage.imageUrl) {
                    heroBackground.style.backgroundImage = `url('${scheduleImage.imageUrl}')`;
                }
            } catch (error) {
                console.error('Error loading schedule banner:', error);
                const heroBackground = document.getElementById('hero-background');
            }
        }

        // Helper function to extract day number from display day (handles ranges like "16-17")
        function getSortingDay(displayDay) {
            if (!displayDay) return 0;
            
            // If it's a range like "16-17" or "9-10", take the first number
            const rangeMatch = displayDay.match(/^(\d+)/);
            if (rangeMatch) {
                return parseInt(rangeMatch[1], 10);
            }
            
            // If it's just a single number
            const singleMatch = displayDay.match(/\d+/);
            return singleMatch ? parseInt(singleMatch[0], 10) : 0;
        }

        // Improved getMonthIndex to handle full month names
        function getMonthIndex(monthAbbr) {
            if (!monthAbbr) return 0;
            
            const monthMap = {
                'jan': 0, 'january': 0,
                'feb': 1, 'february': 1,
                'mar': 2, 'march': 2,
                'apr': 3, 'april': 3,
                'may': 4,
                'jun': 5, 'june': 5,
                'jul': 6, 'july': 6,
                'aug': 7, 'august': 7,
                'sep': 8, 'september': 8,
                'oct': 9, 'october': 9,
                'nov': 10, 'november': 10,
                'dec': 11, 'december': 11
            };
            
            const shortMonth = monthAbbr.toLowerCase().substring(0, 3);
            return monthMap[shortMonth] !== undefined ? monthMap[shortMonth] : 0;
        }

        // Simpler, more robust parseDateForSorting function
        function parseDateForSorting(event) {
            // Try to get year from date string first
            let year = new Date().getFullYear();
            const yearMatch = event.date?.match(/\b(\d{4})\b/);
            if (yearMatch) {
                year = parseInt(yearMatch[1]);
            }
            
            // Get month index from displayDate.month or date string
            let monthIndex = 0;
            if (event.displayDate?.month) {
                monthIndex = getMonthIndex(event.displayDate.month);
            } else if (event.date) {
                // Extract month from date string
                const monthMatch = event.date.match(/^(\w+)/i);
                if (monthMatch) {
                    monthIndex = getMonthIndex(monthMatch[1]);
                }
            }
            
            // Get day from displayDate.day or date string
            let dayNum = 1;
            if (event.displayDate?.day) {
                dayNum = getSortingDay(event.displayDate.day);
            } else if (event.date) {
                // Extract first day number from date string
                const dayMatch = event.date.match(/\b(\d+)(?:-\d+)?\b/);
                if (dayMatch) {
                    dayNum = parseInt(dayMatch[1]);
                }
            }
            
            // For upcoming events that appear to be in the past, check if they should be next year
            const now = new Date();
            const parsedDate = new Date(year, monthIndex, dayNum);
            
            if (event.status === 'upcoming' && parsedDate < now) {
                // Check if this is likely the same event next year
                // (e.g., it's currently December and we have a January event)
                if (parsedDate.getMonth() < now.getMonth() || 
                    (parsedDate.getMonth() === now.getMonth() && parsedDate.getDate() < now.getDate())) {
                    return new Date(year + 1, monthIndex, dayNum);
                }
            }
            
            return parsedDate;
        }

        // Sanitize HTML to prevent XSS attacks
        function sanitizeHtml(html) {
            if (!html) return '';
            
            // Create a temporary div to sanitize
            const temp = document.createElement('div');
            temp.innerHTML = html;
            
            // Remove all script tags and event handlers
            const scripts = temp.querySelectorAll('script, [onerror], [onload], [onclick], [onmouseover]');
            scripts.forEach(el => {
                if (el.tagName === 'SCRIPT') {
                    el.remove();
                } else {
                    // Remove event handler attributes
                    const attrs = Array.from(el.attributes);
                    attrs.forEach(attr => {
                        if (attr.name.startsWith('on')) {
                            el.removeAttribute(attr.name);
                        }
                    });
                }
            });
            
            return temp.innerHTML;
        }

        // Load schedule from API
        async function loadSchedule() {
            try {
                const response = await fetch('/api/schedule');
                const events = await response.json();
                
                const container = document.getElementById('events-container');
                container.innerHTML = '';
                
                if (!events || events.length === 0) {
                    container.innerHTML = '<div class="error-message">No events scheduled at this time.</div>';
                    return;
                }
                
                // Separate upcoming and past events
                const upcomingEvents = events.filter(event => event.status === 'upcoming');
                const pastEvents = events.filter(event => event.status === 'past');
                
                // Sort upcoming events by date (closest future first)
                upcomingEvents.sort((a, b) => {
                    const dateA = parseDateForSorting(a);
                    const dateB = parseDateForSorting(b);
                    return dateA - dateB; // Ascending - closest future first
                });
                
                // Sort past events by date (most recent past first)
                pastEvents.sort((a, b) => {
                    const dateA = parseDateForSorting(a);
                    const dateB = parseDateForSorting(b);
                    return dateB - dateA; // Descending - most recent past first
                });
                
                // Create upcoming events section
                if (upcomingEvents.length > 0) {
                    if (pastEvents.length > 0) {
                        const upcomingHeader = document.createElement('div');
                        upcomingHeader.className = 'events-header';
                        upcomingHeader.innerHTML = '<h2>Upcoming Tournaments</h2>';
                        container.appendChild(upcomingHeader);
                    }
                    
                    upcomingEvents.forEach((event, index) => {
                        const eventElement = createEventElement(event, index);
                        container.appendChild(eventElement);
                    });
                }
                
                // Create past events section
                if (pastEvents.length > 0) {
                    if (upcomingEvents.length > 0) {
                        const divider = document.createElement('hr');
                        divider.className = 'past-divider';
                        container.appendChild(divider);
                        
                        const pastHeader = document.createElement('div');
                        pastHeader.className = 'events-header';
                        pastHeader.innerHTML = '<h2>Past Tournaments</h2>';
                        container.appendChild(pastHeader);
                    }
                    
                    pastEvents.forEach((event, index) => {
                        const eventElement = createEventElement(event, upcomingEvents.length + index);
                        eventElement.classList.add('past-event');
                        container.appendChild(eventElement);
                    });
                }
                
            } catch (error) {
                console.error('Error loading schedule:', error);
                document.getElementById('events-container').innerHTML = 
                    '<div class="error-message">Error loading schedule. Please try again later.</div>';
            }
        }

        function createEventElement(event, index) {
            const eventItem = document.createElement('div');
            eventItem.className = 'event-item';
            
            // Use detailsHtml if available, otherwise fall back to details array
            let detailsHtml = '';
            
            if (event.detailsHtml) {
                // Sanitize the HTML from the admin editor
                detailsHtml = sanitizeHtml(event.detailsHtml);
            } else if (event.details && Array.isArray(event.details)) {
                // Fallback for older events without detailsHtml
                detailsHtml = parseDetails(event.details);
            } else {
                detailsHtml = '<p>No details available.</p>';
            }
            
            // Build the details HTML with optional rules URL
            let detailsContent = detailsHtml;
            
            // Add entry fee and format
            if (event.entryFee) {
                detailsContent += `<p><strong>Entry Fee:</strong> ${event.entryFee}</p>`;
            }
            
            if (event.format) {
                detailsContent += `<p><strong>Format:</strong> ${event.format}</p>`;
            }
            
            // Add Rules URL as a link
            if (event.rulesUrl) {
                detailsContent += `
                    <div class="rules-link">
                        <a href="${event.rulesUrl}" target="_blank">📋 Tournament Rules</a>
                    </div>
                `;
            }
            
            // Add Google Calendar link
            if (event.googleCalendarLink) {
                detailsContent += `
                    <div class="calendar-links">
                        <a href="${event.googleCalendarLink}" target="_blank">📅 Google Calendar</a>
                    </div>
                `;
            }
            
            // Add signup deadline
            if (event.signupDeadline) {
                detailsContent += `
                    <div class="signup-deadline">
                        <strong>Sign up deadline:</strong> 
                        <span class="${event.isPastDeadline ? 'date-crossed' : 'date-open'}">
                            ${event.signupDeadline}
                        </span>
                    </div>
                `;
            }
            
            eventItem.innerHTML = `
                <div class="event-main" onclick="toggleEvent(${index})">
                    <div class="event-image" style="background-image: url('${event.imageUrl || ''}')"></div>
                    <div class="event-date">
                        <span class="event-month">${event.displayDate?.month || ''}</span>
                        <span class="event-day">${event.displayDate?.day || ''}</span>
                    </div>
                    <div class="event-info">
                        <h3 class="event-title">${event.title}</h3>
                        <div class="event-meta">
                            <span class="event-time">📅 ${event.date}</span>
                            <span class="event-time">⏰ ${event.timeRange || ''}</span>
                        </div>
                    </div>
                    <div class="event-actions">
                        <span class="event-status ${event.status === 'upcoming' ? 'status-upcoming' : 'status-past'}">
                            ${event.status === 'upcoming' ? 'Upcoming' : 'Past Event'}
                        </span>
                        <button class="expand-btn">▼</button>
                    </div>
                </div>
                <div class="event-details">
                    <div class="details-content">
                        ${detailsContent}
                    </div>
                </div>
            `;
            
            return eventItem;
        }

        // Keep parseDetails as fallback for backward compatibility
        function parseDetails(detailsArray) {
            if (!detailsArray || detailsArray.length === 0) return '';
            
            let html = '';
            let inList = false;
            
            detailsArray.forEach(line => {
                const trimmed = line.trim();
                
                if (trimmed.startsWith('•')) {
                    if (!inList) {
                        html += '<ul>';
                        inList = true;
                    }
                    // Check for sub-bullet (starts with spaces before •)
                    if (line.startsWith('  •')) {
                        html += `<li style="margin-left: 20px;">${trimmed.substring(1).trim()}</li>`;
                    } else {
                        html += `<li>${trimmed.substring(1).trim()}</li>`;
                    }
                } else {
                    // Close list if we were in one
                    if (inList) {
                        html += '</ul>';
                        inList = false;
                    }
                    
                    // Check if line looks like a heading (no bullet, not empty)
                    if (trimmed && !trimmed.includes('•')) {
                        // Check if it's likely a heading (no period, might be all caps or short)
                        if (trimmed.length < 50 && !trimmed.endsWith('.') && !trimmed.endsWith(':')) {
                            html += `<h3>${trimmed}</h3>`;
                        } else {
                            html += `<p>${line}</p>`;
                        }
                    } else if (trimmed === '') {
                        // Empty line for spacing
                        html += '<br>';
                    }
                }
            });
            
            // Close list if still open
            if (inList) {
                html += '</ul>';
            }
            
            return html;
        }

        // Event expansion functionality
        function toggleEvent(index) {
            const eventItems = document.querySelectorAll('.event-item');
            const expandBtns = document.querySelectorAll('.expand-btn');
            const details = document.querySelectorAll('.event-details');
            
            if (index >= eventItems.length) return;
            
            const eventItem = eventItems[index];
            const expandBtn = expandBtns[index];
            const detail = details[index];
            
            // Toggle current event
            eventItem.classList.toggle('expanded');
            expandBtn.classList.toggle('expanded');
            detail.classList.toggle('expanded');
        }

        // Load schedule when page is ready
        document.addEventListener('DOMContentLoaded', function() {
            loadScheduleBanner();
            loadSchedule();
        });
    </script>

</body>
</html>
