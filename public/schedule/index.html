<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <link rel="icon" href="/favicon.ico" type="image/x-icon">
    <link rel="shortcut icon" href="/favicon.ico" type="image/x-icon">
    <title>Schedule - Skylinks Men's Golf Club</title>
    <link rel="stylesheet" href="/css/styles.css" />
    <style>
        /* Additional styles for schedule page */
        .schedule-page {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
        }
        
        .hero-section {
            position: relative;
            height: 50vh;
            min-height: 400px;
            overflow: hidden;
            margin-bottom: 3rem;
            margin-top: 60px;
        }
        
        .hero-background {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background-size: cover;
            background-position: 2% 60%;
        }
        
        .hero-content {
            position: relative;
            height: 100%;
            display: flex;
            align-items: center;
            justify-content: center;
            text-align: center;
        }
        
        .hero-content h1 {
            font-size: 3rem;
            font-weight: 400;
            margin-bottom: 1rem;
            color: white;
        }
        
        .events-container {
            max-width: 1200px;
            margin: 0 auto;
            padding: 0 2rem;
        }
        
        .events-header {
            text-align: center;
            margin-bottom: 0.5rem;
        }
        
        .events-header h2 {
            font-size: 2.5rem;
            color: #2c3e50;
            margin-bottom: 1rem;
        }
        
        .event-list {
            display: flex;
            flex-direction: column;
            gap: 1.5rem;
        }
        
        .event-item {
            background: white;
            border-radius: 12px;
            overflow: hidden;
            box-shadow: 0 4px 20px rgba(0,0,0,0.08);
            transition: all 0.3s ease;
            border: 1px solid #e9ecef;
        }
        
        .event-item.expanded {
            box-shadow: 0 8px 30px rgba(0,0,0,0.12);
        }

        .event-item:last-child {
            margin-bottom: 3rem; 
        }
        
        .event-main {
            display: flex;
            padding: 1rem;
            cursor: pointer;
            align-items: center;
            min-height: 120px;
        }
        
        .event-image {
            width: 160px;
            height: 90px;
            min-width: 160px;
            border-radius: 8px;
            overflow: hidden;
            margin-right: 1.5rem;
            background-size: cover;
            background-position: center;
        }
        
        .event-date {
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            min-width: 80px;
            padding: 0.75rem;
            background: #2c3e50;
            color: white;
            border-radius: 8px;
            margin-right: 1.5rem;
        }
        
        .event-month {
            font-size: 0.9rem;
            font-weight: 600;
            text-transform: uppercase;
            margin-bottom: 0.25rem;
        }
        
        .event-day {
            font-size: 2rem;
            font-weight: bold;
            line-height: 1;
        }
        
        .event-info {
            flex: 1;
            padding-right: 1rem;
        }
        
        .event-title {
            font-size: 1.25rem;
            font-weight: 600;
            color: #2c3e50;
            margin-bottom: 0.5rem;
        }
        
        .event-meta {
            display: flex;
            flex-wrap: wrap;
            gap: 1rem;
            color: #6c757d;
            font-size: 0.9rem;
        }
        
        .event-time {
            display: flex;
            align-items: center;
            gap: 0.5rem;
        }
        
        .event-actions {
            display: flex;
            align-items: center;
            gap: 1rem;
        }
        
        .expand-btn {
            background: none;
            border: none;
            color: #2c3e50;
            font-size: 1.25rem;
            cursor: pointer;
            padding: 0.5rem;
            transition: transform 0.3s ease;
            display: flex;
            align-items: center;
            justify-content: center;
            width: 36px;
            height: 36px;
            border-radius: 50%;
            background: #f8f9fa;
        }
        
        .expand-btn:hover {
            background: #e9ecef;
        }
        
        .expand-btn.expanded {
            transform: rotate(180deg);
        }
        
        .event-details {
            max-height: 0;
            overflow: hidden;
            transition: max-height 0.5s ease;
            background: #f8f9fa;
            border-top: 1px solid #e9ecef;
        }
        
        .event-details.expanded {
            max-height: 2000px;
        }
        
        .details-content {
            padding: 2rem;
        }
        
        .details-content h3 {
            color: #2c3e50;
            margin-bottom: 1rem;
            font-size: 1.25rem;
        }
        
        .details-content p {
            margin-bottom: 1rem;
            line-height: 1.6;
        }
        
        .details-content ul {
            margin-bottom: 1.5rem;
            padding-left: 1.5rem;
        }
        
        .details-content li {
            margin-bottom: 0.5rem;
            line-height: 1.6;
        }
        
        .past-event {
            opacity: 0.8;
        }
        
        .past-event .event-date {
            background: #6c757d;
        }
        
        .past-event .event-title {
            color: #6c757d;
        }
        
        .event-status {
            display: inline-flex;
            align-items: center;
            padding: 0.25rem 0.75rem;
            border-radius: 20px;
            font-size: 0.8rem;
            font-weight: 600;
            margin-left: 1rem;
        }
        
        .status-upcoming {
            background: #d4edda;
            color: #155724;
        }
        
        .status-past {
            background: #f8d7da;
            color: #721c24;
        }
        
        .date-crossed {
            text-decoration: line-through;
            color: #6c757d;
        }
        
        .date-open {
            color: #28a745;
            font-weight: 600;
        }
        
        .signup-deadline {
            display: flex;
            align-items: center;
            gap: 0.5rem;
            margin-top: 1.5rem;
            padding: 1rem;
            background: #e3f2fd;
            border-radius: 8px;
            border-left: 4px solid #2196f3;
            font-size: 0.95rem;
        }
        
        .signup-deadline strong {
            color: #1565c0;
        }
        
        .upcoming-divider {
            border: none;
            border-top: 3px solid #28a745;
            margin: 3rem 0;
            opacity: 0.5;
        }
        
        .past-divider {
            border: none;
            border-top: 3px solid #6c757d;
            margin: 3rem 0;
            opacity: 0.5;
        }
        
        @media (max-width: 768px) {
            .hero-section {
                position: relative;
                height: 20vh;
                min-height: 200px;
            }

            .event-main {
                flex-direction: column;
                align-items: stretch;
            }
            
            .event-image {
                width: 100%;
                height: 250px;
                min-width: auto;
                margin-right: 0;
                margin-bottom: 1rem;
            }
            
            .event-date {
                margin-right: 0;
                margin-bottom: 1rem;
                min-width: auto;
                width: 100%;
                flex-direction: row;
                justify-content: center;
                gap: 1rem;
            }
            
            .event-month {
                margin-bottom: 0;
                font-size: 2rem;
            }
            
            .event-meta {
                flex-direction: column;
                gap: 0.5rem;
            }
            
            .event-actions {
                margin-top: 1rem;
                justify-content: center;
            }
            
            .hero-content h1 {
                font-size: 2rem;
            }
            
            .events-header h2 {
                font-size: 1.75rem;
            }
        }
        
        .calendar-links {
            display: flex;
            gap: 1rem;
            margin-top: 1rem;
            font-size: 0.85rem;
        }
        
        .calendar-links a {
            color: #2c3e50;
            text-decoration: none;
            padding: 0.25rem 0.5rem;
            border-radius: 4px;
            background: #f8f9fa;
            border: 1px solid #dee2e6;
        }
        
        .calendar-links a:hover {
            background: #e9ecef;
        }
        
        .loading {
            text-align: center;
            padding: 4rem;
            color: #666;
        }
        
        .error-message {
            text-align: center;
            padding: 4rem;
            color: #dc3545;
        }
    </style>
</head>
<body class="schedule-page">
    <!-- HEADER INJECTION -->
    <div id="header-placeholder"></div>

    <!-- Hero Section -->
    <section class="hero-section">
        <div class="hero-background" id="hero-background"></div>
        <div class="hero-content">
            <div>
                <h1>Tournament Schedule</h1>
            </div>
        </div>
    </section>

    <!-- Events Section -->
    <section class="events-section">
        <div class="events-container">
            <div class="event-list" id="events-container">
                <div class="loading" id="loading">Loading schedule...</div>
            </div>
        </div>
    </section>

    <!-- FOOTER INJECTION -->
    <div id="footer-placeholder"></div>

    <!-- Scripts -->
    <script src="/js/menu.js"></script>
    <script src="/js/image.js"></script>
    <script src="/js/cart-count.js"></script>
    
    <script>
        // Load header + footer on page
        fetch("/header.html")
            .then(res => res.text())
            .then(html => {
                document.getElementById("header-placeholder").innerHTML = html;
                if (typeof initMenu === 'function') {
                    initMenu();
                }
            });

        fetch("/footer.html")
            .then(res => res.text())
            .then(html => (document.getElementById("footer-placeholder").innerHTML = html));

        // Load schedule from API
        async function loadSchedule() {
            try {
                const response = await fetch('/api/schedule');
                const events = await response.json();
                
                const container = document.getElementById('events-container');
                container.innerHTML = '';
                
                if (!events || events.length === 0) {
                    container.innerHTML = '<div class="error-message">No events scheduled at this time.</div>';
                    return;
                }
                
                // Separate upcoming and past events
                const upcomingEvents = events.filter(event => event.status === 'upcoming');
                const pastEvents = events.filter(event => event.status === 'past');
                
                // Sort by date (assuming date format like "December 14, 2025")
                const sortByDate = (a, b) => new Date(a.date) - new Date(b.date);
                upcomingEvents.sort(sortByDate);
                pastEvents.sort((a, b) => new Date(b.date) - new Date(a.date)); // Reverse for past events
                
                // Set hero image if available in first upcoming event
                if (upcomingEvents.length > 0 && upcomingEvents[0].heroImage) {
                    document.getElementById('hero-background').style.backgroundImage = `url('${upcomingEvents[0].heroImage}')`;
                }
                
                // Create upcoming events section
                if (upcomingEvents.length > 0) {
                    if (pastEvents.length > 0) {
                        const upcomingHeader = document.createElement('div');
                        upcomingHeader.className = 'events-header';
                        upcomingHeader.innerHTML = '<h2>Upcoming Tournament</h2>';
                        container.appendChild(upcomingHeader);
                    }
                    
                    upcomingEvents.forEach((event, index) => {
                        const eventElement = createEventElement(event, index);
                        container.appendChild(eventElement);
                    });
                }
                
                // Create past events section
                if (pastEvents.length > 0) {
                    if (upcomingEvents.length > 0) {
                        const divider = document.createElement('hr');
                        divider.className = 'past-divider';
                        container.appendChild(divider);
                        
                        const pastHeader = document.createElement('div');
                        pastHeader.className = 'events-header';
                        pastHeader.innerHTML = '<h2>Past Tournaments</h2>';
                        container.appendChild(pastHeader);
                    }
                    
                    pastEvents.forEach((event, index) => {
                        const eventElement = createEventElement(event, upcomingEvents.length + index);
                        eventElement.classList.add('past-event');
                        container.appendChild(eventElement);
                    });
                }
                
            } catch (error) {
                console.error('Error loading schedule:', error);
                document.getElementById('events-container').innerHTML = 
                    '<div class="error-message">Error loading schedule. Please try again later.</div>';
            }
        }

        function createEventElement(event, index) {
            const eventItem = document.createElement('div');
            eventItem.className = 'event-item';
            
            // Parse details into HTML
            const detailsHtml = parseDetails(event.details || []);
            
            eventItem.innerHTML = `
                <div class="event-main" onclick="toggleEvent(${index})">
                    <div class="event-image" style="background-image: url('${event.imageUrl || ''}')"></div>
                    <div class="event-date">
                        <span class="event-month">${event.displayDate?.month || ''}</span>
                        <span class="event-day">${event.displayDate?.day || ''}</span>
                    </div>
                    <div class="event-info">
                        <h3 class="event-title">${event.title}</h3>
                        <div class="event-meta">
                            <span class="event-time">📅 ${event.date}</span>
                            <span class="event-time">⏰ ${event.timeRange || ''}</span>
                        </div>
                    </div>
                    <div class="event-actions">
                        <span class="event-status ${event.status === 'upcoming' ? 'status-upcoming' : 'status-past'}">
                            ${event.status === 'upcoming' ? 'Upcoming' : 'Past Event'}
                        </span>
                        <button class="expand-btn">▼</button>
                    </div>
                </div>
                <div class="event-details">
                    <div class="details-content">
                        ${detailsHtml}
                        ${event.entryFee ? `<p><strong>Entry Fee:</strong> ${event.entryFee}</p>` : ''}
                        ${event.format ? `<p><strong>Format:</strong> ${event.format}</p>` : ''}
                        ${event.googleCalendarLink ? `
                            <div class="calendar-links">
                                <a href="${event.googleCalendarLink}" target="_blank">Google Calendar</a>
                            </div>
                        ` : ''}
                        ${event.signupDeadline ? `
                            <div class="signup-deadline">
                                <strong>Sign up deadline:</strong> 
                                <span class="${event.isPastDeadline ? 'date-crossed' : 'date-open'}">
                                    ${event.signupDeadline}
                                </span>
                            </div>
                        ` : ''}
                    </div>
                </div>
            `;
            
            return eventItem;
        }

        function parseDetails(detailsArray) {
            if (!detailsArray || detailsArray.length === 0) return '';
            
            let html = '';
            let inList = false;
            
            detailsArray.forEach(line => {
                const trimmed = line.trim();
                
                if (trimmed.startsWith('•')) {
                    if (!inList) {
                        html += '<ul>';
                        inList = true;
                    }
                    // Check for sub-bullet (starts with spaces before •)
                    if (line.startsWith('  •')) {
                        html += `<li style="margin-left: 20px;">${trimmed.substring(1).trim()}</li>`;
                    } else {
                        html += `<li>${trimmed.substring(1).trim()}</li>`;
                    }
                } else {
                    // Close list if we were in one
                    if (inList) {
                        html += '</ul>';
                        inList = false;
                    }
                    
                    // Check if line looks like a heading (no bullet, not empty)
                    if (trimmed && !trimmed.includes('•')) {
                        // Check if it's likely a heading (no period, might be all caps or short)
                        if (trimmed.length < 50 && !trimmed.endsWith('.') && !trimmed.endsWith(':')) {
                            html += `<h3>${trimmed}</h3>`;
                        } else {
                            html += `<p>${line}</p>`;
                        }
                    } else if (trimmed === '') {
                        // Empty line for spacing
                        html += '<br>';
                    }
                }
            });
            
            // Close list if still open
            if (inList) {
                html += '</ul>';
            }
            
            return html;
        }

        // Event expansion functionality
        function toggleEvent(index) {
            const eventItems = document.querySelectorAll('.event-item');
            const expandBtns = document.querySelectorAll('.expand-btn');
            const details = document.querySelectorAll('.event-details');
            
            if (index >= eventItems.length) return;
            
            const eventItem = eventItems[index];
            const expandBtn = expandBtns[index];
            const detail = details[index];
            
            // Toggle current event
            eventItem.classList.toggle('expanded');
            expandBtn.classList.toggle('expanded');
            detail.classList.toggle('expanded');
        }

        // Load schedule when page is ready
        document.addEventListener('DOMContentLoaded', loadSchedule);
    </script>

</body>
</html>
