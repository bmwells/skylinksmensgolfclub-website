<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <link rel="icon" href="/favicon.ico" type="image/x-icon">
    <link rel="shortcut icon" href="/favicon.ico" type="image/x-icon">
    <title>Schedule - Skylinks Men's Golf Club</title>
    <link rel="stylesheet" href="/css/styles.css" />
    <link rel="stylesheet" href="/css/schedule.css" />
</head>
<body class="schedule-page">
    <!-- HEADER INJECTION -->
    <div id="header-placeholder"></div>

    <!-- Hero Section -->
    <section class="hero-section">
        <div class="hero-background" id="hero-background"></div>
        <div class="hero-content">
            <div>
                <h1>Tournament Schedule</h1>
            </div>
        </div>
    </section>

    <!-- Events Section -->
    <section class="events-section">
        <div class="events-container">
            <div class="event-list" id="events-container">
                <div class="loading" id="loading">Loading schedule...</div>
            </div>
        </div>
    </section>

    <!-- FOOTER INJECTION -->
    <div id="footer-placeholder"></div>

    <!-- Scripts -->
    <script src="/js/menu.js"></script>
    <script src="/js/image.js"></script>
    <script src="/js/cart-count.js"></script>
    
    <script>
        // Load header + footer on page
        fetch("/header.html")
            .then(res => res.text())
            .then(html => {
                document.getElementById("header-placeholder").innerHTML = html;
                if (typeof initMenu === 'function') {
                    initMenu();
                }
            });

        fetch("/footer.html")
            .then(res => res.text())
            .then(html => (document.getElementById("footer-placeholder").innerHTML = html));

        // Load schedule from API
        async function loadSchedule() {
            try {
                const response = await fetch('/api/schedule');
                const events = await response.json();
                
                const container = document.getElementById('events-container');
                container.innerHTML = '';
                
                if (!events || events.length === 0) {
                    container.innerHTML = '<div class="error-message">No events scheduled at this time.</div>';
                    return;
                }
                
                // Separate upcoming and past events
                const upcomingEvents = events.filter(event => event.status === 'upcoming');
                const pastEvents = events.filter(event => event.status === 'past');
                
                // Sort by date (assuming date format like "December 14, 2025")
                const sortByDate = (a, b) => new Date(a.date) - new Date(b.date);
                upcomingEvents.sort(sortByDate);
                pastEvents.sort((a, b) => new Date(b.date) - new Date(a.date)); // Reverse for past events
                
                // Create upcoming events section
                if (upcomingEvents.length > 0) {
                    if (pastEvents.length > 0) {
                        const upcomingHeader = document.createElement('div');
                        upcomingHeader.className = 'events-header';
                        upcomingHeader.innerHTML = '<h2>Upcoming Tournament</h2>';
                        container.appendChild(upcomingHeader);
                    }
                    
                    upcomingEvents.forEach((event, index) => {
                        const eventElement = createEventElement(event, index);
                        container.appendChild(eventElement);
                    });
                }
                
                // Create past events section
                if (pastEvents.length > 0) {
                    if (upcomingEvents.length > 0) {
                        const divider = document.createElement('hr');
                        divider.className = 'past-divider';
                        container.appendChild(divider);
                        
                        const pastHeader = document.createElement('div');
                        pastHeader.className = 'events-header';
                        pastHeader.innerHTML = '<h2>Past Tournaments</h2>';
                        container.appendChild(pastHeader);
                    }
                    
                    pastEvents.forEach((event, index) => {
                        const eventElement = createEventElement(event, upcomingEvents.length + index);
                        eventElement.classList.add('past-event');
                        container.appendChild(eventElement);
                    });
                }
                
            } catch (error) {
                console.error('Error loading schedule:', error);
                document.getElementById('events-container').innerHTML = 
                    '<div class="error-message">Error loading schedule. Please try again later.</div>';
            }
        }

        function createEventElement(event, index) {
            const eventItem = document.createElement('div');
            eventItem.className = 'event-item';
            
            // Parse details into HTML
            const detailsHtml = parseDetails(event.details || []);
            
            eventItem.innerHTML = `
                <div class="event-main" onclick="toggleEvent(${index})">
                    <div class="event-image" style="background-image: url('${event.imageUrl || ''}')"></div>
                    <div class="event-date">
                        <span class="event-month">${event.displayDate?.month || ''}</span>
                        <span class="event-day">${event.displayDate?.day || ''}</span>
                    </div>
                    <div class="event-info">
                        <h3 class="event-title">${event.title}</h3>
                        <div class="event-meta">
                            <span class="event-time">📅 ${event.date}</span>
                            <span class="event-time">⏰ ${event.timeRange || ''}</span>
                        </div>
                    </div>
                    <div class="event-actions">
                        <span class="event-status ${event.status === 'upcoming' ? 'status-upcoming' : 'status-past'}">
                            ${event.status === 'upcoming' ? 'Upcoming' : 'Past Event'}
                        </span>
                        <button class="expand-btn">▼</button>
                    </div>
                </div>
                <div class="event-details">
                    <div class="details-content">
                        ${detailsHtml}
                        ${event.entryFee ? `<p><strong>Entry Fee:</strong> ${event.entryFee}</p>` : ''}
                        ${event.format ? `<p><strong>Format:</strong> ${event.format}</p>` : ''}
                        ${event.googleCalendarLink ? `
                            <div class="calendar-links">
                                <a href="${event.googleCalendarLink}" target="_blank">Google Calendar</a>
                            </div>
                        ` : ''}
                        ${event.signupDeadline ? `
                            <div class="signup-deadline">
                                <strong>Sign up deadline:</strong> 
                                <span class="${event.isPastDeadline ? 'date-crossed' : 'date-open'}">
                                    ${event.signupDeadline}
                                </span>
                            </div>
                        ` : ''}
                    </div>
                </div>
            `;
            
            return eventItem;
        }

        function parseDetails(detailsArray) {
            if (!detailsArray || detailsArray.length === 0) return '';
            
            let html = '';
            let inList = false;
            
            detailsArray.forEach(line => {
                const trimmed = line.trim();
                
                if (trimmed.startsWith('•')) {
                    if (!inList) {
                        html += '<ul>';
                        inList = true;
                    }
                    // Check for sub-bullet (starts with spaces before •)
                    if (line.startsWith('  •')) {
                        html += `<li style="margin-left: 20px;">${trimmed.substring(1).trim()}</li>`;
                    } else {
                        html += `<li>${trimmed.substring(1).trim()}</li>`;
                    }
                } else {
                    // Close list if we were in one
                    if (inList) {
                        html += '</ul>';
                        inList = false;
                    }
                    
                    // Check if line looks like a heading (no bullet, not empty)
                    if (trimmed && !trimmed.includes('•')) {
                        // Check if it's likely a heading (no period, might be all caps or short)
                        if (trimmed.length < 50 && !trimmed.endsWith('.') && !trimmed.endsWith(':')) {
                            html += `<h3>${trimmed}</h3>`;
                        } else {
                            html += `<p>${line}</p>`;
                        }
                    } else if (trimmed === '') {
                        // Empty line for spacing
                        html += '<br>';
                    }
                }
            });
            
            // Close list if still open
            if (inList) {
                html += '</ul>';
            }
            
            return html;
        }

        // Event expansion functionality
        function toggleEvent(index) {
            const eventItems = document.querySelectorAll('.event-item');
            const expandBtns = document.querySelectorAll('.expand-btn');
            const details = document.querySelectorAll('.event-details');
            
            if (index >= eventItems.length) return;
            
            const eventItem = eventItems[index];
            const expandBtn = expandBtns[index];
            const detail = details[index];
            
            // Toggle current event
            eventItem.classList.toggle('expanded');
            expandBtn.classList.toggle('expanded');
            detail.classList.toggle('expanded');
        }

        // Load schedule when page is ready
        document.addEventListener('DOMContentLoaded', loadSchedule);
    </script>

</body>
</html>
