<!-- member-modal.html -->
<!-- Modal for membership details collection -->

<div class="member-modal-backdrop" id="member-modal-backdrop" aria-hidden="true">
    <div class="member-modal" role="dialog" aria-modal="true" aria-labelledby="member-modal-title">
        <h3 id="member-modal-title" style="margin-top:0;">Membership Details</h3>
        
        <div class="row">
            <div class="col">
                <label for="modal-name">Name *</label>
                <div class="input-wrapper">
                    <input id="modal-name" placeholder="Start typing name..." required />
                    <div class="loading-spinner" id="name-loading" style="display: none;">
                        <div class="spinner"></div>
                    </div>
                </div>
            </div>
        </div>
        
        <div class="row">
            <div class="col">
                <label for="modal-email">Email *</label>
                <input id="modal-email" type="email" placeholder="" required />
            </div>
            <div class="col">
                <label for="modal-phone">Phone</label>
                <input id="modal-phone" placeholder="" />
            </div>
        </div>

         <div class="row">
            <div class="col">
                <label for="modal-ghin">GHIN # *</label>
                <input id="modal-ghin" placeholder="" />
            </div>
        </div>
        
        <div class="modal-footer">
            <p class="required-note">* Required fields</p>
            <div class="actions">
                <button id="member-modal-cancel" class="btn ghost">Cancel</button>
                <button id="member-modal-save" class="btn primary">Add To Cart</button>
            </div>
        </div>
    </div>
</div>

<style>
    /* Product Modal Styles */
    .member-modal-backdrop {
        position: fixed;
        inset: 0;
        background: rgba(0,0,0,0.45);
        display: none;
        align-items: center;
        justify-content: center;
        z-index: 2000;
        animation: fadeIn 0.2s ease-out;
    }
    
    .member-modal-backdrop.active {
        display: flex;
    }
    
    .member-modal {
        width: 680px;
        max-width: 95%;
        max-height: 90vh;
        overflow-y: auto;
        background: #fff;
        border-radius: 12px;
        padding: 30px;
        box-shadow: 0 15px 50px rgba(0,0,0,.25);
        animation: slideUp 0.3s ease-out;
    }
    
    .member-modal h3 {
        margin-top: 0;
        margin-bottom: 25px;
        font-size: 1.5rem;
        font-weight: 600;
        color: #000;
    }
    
    .member-modal label {
        display: block;
        margin-bottom: 8px;
        font-weight: 600;
        color: #333;
        font-size: 0.95rem;
    }
    
    .member-modal input,
    .member-modal textarea {
        width: 100%;
        padding: 12px 15px;
        border: 1px solid #ddd;
        border-radius: 6px;
        margin-bottom: 5px;
        box-sizing: border-box;
        font-size: 1rem;
        transition: border-color 0.2s, box-shadow 0.2s;
    }
    
    .member-modal input:focus,
    .member-modal textarea:focus {
        outline: none;
        border-color: #000;
        box-shadow: 0 0 0 3px rgba(0,0,0,0.05);
    }
    
    .member-modal input::placeholder,
    .member-modal textarea::placeholder {
        color: #999;
    }
    
    .member-modal .row {
        display: flex;
        gap: 20px;
        margin-bottom: 5px;
    }
    
    .member-modal .row .col {
        flex: 1;
        position: relative;
    }
    
    /* Input wrapper for loading spinner */
    .input-wrapper {
        position: relative;
    }
    
    .loading-spinner {
        position: absolute;
        right: 12px;
        top: 50%;
        transform: translateY(-50%);
    }
    
    .spinner {
        width: 20px;
        height: 20px;
        border: 2px solid #f3f3f3;
        border-top: 2px solid #000;
        border-radius: 50%;
        animation: spin 1s linear infinite;
    }
    
    /* Autocomplete styles */
    .autocomplete-container {
        position: absolute;
        background: white;
        border: 1px solid #ddd;
        border-radius: 6px;
        box-shadow: 0 5px 25px rgba(0,0,0,0.15);
        max-height: 300px;
        overflow-y: auto;
        z-index: 10000;
        display: none;
        width: 100%;
        margin-top: 2px;
        animation: fadeInDown 0.2s ease-out;
    }
    
    .autocomplete-item {
        padding: 12px 15px;
        cursor: pointer;
        border-bottom: 1px solid #f5f5f5;
        transition: background-color 0.2s;
        font-size: 0.95rem;
    }
    
    .autocomplete-item:hover {
        background-color: #f8f9fa;
    }
    
    .autocomplete-item:last-child {
        border-bottom: none;
    }
    
    .autocomplete-item .name {
        font-weight: 500;
        color: #000;
        margin-bottom: 3px;
    }
    
    .autocomplete-item .details {
        font-size: 0.85rem;
        color: #666;
    }
    
    .autocomplete-item .ghin-badge {
        display: inline-block;
        background: #f0f0f0;
        padding: 2px 8px;
        border-radius: 12px;
        font-size: 0.8rem;
        margin-left: 8px;
    }
    
    .no-results {
        color: #666;
        font-style: italic;
        padding: 12px 15px;
        text-align: center;
    }
    
    /* Input hint text */
    .input-hint {
        font-size: 0.85rem;
        color: #666;
        margin-top: 5px;
        margin-bottom: 15px;
        font-style: italic;
    }
    
    .member-modal .modal-footer {
        margin-top: 25px;
        padding-top: 20px;
        border-top: 1px solid #eee;
    }
    
    .member-modal .required-note {
        font-size: 0.85rem;
        color: #666;
        margin-bottom: 20px;
    }
    
    .member-modal .actions {
        display: flex;
        gap: 12px;
        justify-content: flex-end;
    }
    
    .btn {
        border-radius: 32px;
        padding: 12px 28px;
        cursor: pointer;
        border: none;
        font-size: 1rem;
        font-weight: 500;
        transition: all 0.2s ease;
        min-width: 100px;
    }
    
    .btn.primary {
        background: #000;
        color: #fff;
        text-transform: uppercase;
        letter-spacing: 0.5px;
    }
    
    .btn.primary:hover {
        background: #333;
    }
    
    .btn.ghost {
        background: transparent;
        border: 1px solid #ddd;
        color: #333;
    }
    
    .btn.ghost:hover {
        background: #f9f9f9;
        border-color: #ccc;
    }
    
    /* Animations */
    @keyframes fadeIn {
        from { opacity: 0; }
        to { opacity: 1; }
    }
    
    @keyframes slideUp {
        from {
            opacity: 0;
            transform: translateY(20px);
        }
        to {
            opacity: 1;
            transform: translateY(0);
        }
    }
    
    @keyframes spin {
        0% { transform: rotate(0deg); }
        100% { transform: rotate(360deg); }
    }
    
    @keyframes fadeInDown {
        from {
            opacity: 0;
            transform: translateY(-10px);
        }
        to {
            opacity: 1;
            transform: translateY(0);
        }
    }
    
    /* Responsive styles for modal */
    @media (max-width: 768px) {
        .member-modal {
            padding: 25px 20px;
            width: 95%;
        }
        
        .member-modal .row {
            flex-direction: column;
            gap: 0;
        }
        
        .btn {
            padding: 10px 20px;
            min-width: 80px;
        }
        
        .member-modal h3 {
            font-size: 1.3rem;
        }
        
        .autocomplete-container {
            position: fixed;
            width: calc(100% - 40px);
            left: 20px !important;
            max-width: calc(100vw - 40px);
        }
    }
    
    @media (max-width: 480px) {
        .member-modal {
            padding: 20px 15px;
        }
        
        .member-modal .actions {
            flex-direction: column;
        }
        
        .btn {
            width: 100%;
        }
        
        .autocomplete-container {
            position: fixed;
            width: calc(100% - 30px);
            left: 15px !important;
            max-width: calc(100vw - 30px);
        }
    }
</style>
