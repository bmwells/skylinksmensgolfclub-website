<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <link rel="icon" href="/favicon.ico" type="image/x-icon">
    <link rel="shortcut icon" href="/favicon.ico" type="image/x-icon">  
    <title>Monthly Tournament - Skylinks Men's Golf Club</title>
    <link rel="stylesheet" href="/css/styles.css" />
    <link rel="stylesheet" href="/css/product.css" />
    <style>
        .disabled-button {
            background-color: #cccccc !important;
            color: #666666 !important;
            cursor: not-allowed !important;
            position: relative;
            opacity: 0.7;
        }
        
        .disabled-button::after {
            content: "";
            position: absolute;
            top: 50%;
            left: 10%;
            right: 10%;
            height: 2px;
            background-color: #999999;
            transform: translateY(-50%);
        }
        
        .disabled-button:hover {
            background-color: #cccccc !important;
            transform: none !important;
        }
        
        .add-to-cart-text {
            position: relative;
            z-index: 1;
        }
    </style>
</head>
<body data-product-id="monthly-tournament">
    <!-- Added chevron back button -->
    <div class="back-to-tournaments">
        <a href="/tournament-entry/" class="back-button">
            <svg xmlns="http://www.w3.org/2000/svg" width="30" height="30" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                <path d="m15 18-6-6 6-6"/>
            </svg>
        </a>
    </div>

    <!-- HEADER INJECTION -->
    <div id="header-placeholder"></div>

    <!-- Product Page Content -->
    <section class="product-page">
        <div class="product-container">
            <div class="product-content-wrapper">
                <div class="product-image-container">
                    <img id="tournament-image" 
                         src="" 
                         alt="Monthly Tournament" 
                         class="product-image">
                </div>

                <div class="product-meta">
                    <h1 id="tournament-title" class="product-title">Loading...</h1>
                    
                    <div id="main-product-price" class="product-price" data-animation-role="content">
                        <div id="tournament-price" class="product-price-value">Loading...</div>
                        <div class="product-payment-method-messaging"></div>
                    </div>
                    
                    <div id="tournament-description" class="product-description">
                        <p>Loading tournament details...</p>
                    </div>
                    
                    <div class="product-add-to-cart">
                        <div class="product-add-to-cart-layout-wrapper">                            
                            <div class="sqs-add-to-cart-button-wrapper" data-animation-role="button" style="visibility: visible;">
                                <button id="open-member-modal" class="sqs-add-to-cart-button sqs-suppress-edit-mode sqs-editable-button sqs-button-element--primary" data-dynamic-strings="">
                                    <div class="sqs-add-to-cart-button-inner">
                                        <span class="add-to-cart-text">Add To Cart</span>
                                        <span class="cart-loader"></span>
                                        <span class="cart-added-text">Added!</span>
                                    </div>
                                </button>
                            </div>
                        </div>
                    </div>
                </div>
            </div>
        </div>
    </section>

    <!-- Modal placeholder - will be populated by JavaScript -->
    <div id="member-modal-placeholder"></div>

    <!-- FOOTER INJECTION -->
    <div id="footer-placeholder"></div>

    <!-- Scripts -->
    <script src="/js/menu.js"></script>
    <script src="/js/image.js"></script>
    <script src="/js/cart.js"></script>
    <script src="/js/member-autocomplete.js"></script>
    <script src="/js/product.js"></script>
    <script src="/js/cart-count.js"></script>

    <script>
        // Store tournament data globally for use by product.js
        window.tournamentData = null;
        
        // Load header + footer on page
        fetch("/header.html")
            .then(res => res.text())
            .then(html => {
                document.getElementById("header-placeholder").innerHTML = html;
                if (typeof initMenu === "function") initMenu();
            });

        fetch("/footer.html")
            .then(res => res.text())
            .then(html => (document.getElementById("footer-placeholder").innerHTML = html));

        // Load monthly tournament content from API
        async function loadMonthlyTournament() {
            try {
                const response = await fetch('/api/monthly-tournament');
                const data = await response.json();
                
                // Store data globally for use by product.js
                window.tournamentData = data;
                
                // Update page content
                if (data.imageUrl) {
                    document.getElementById('tournament-image').src = data.imageUrl;
                }
                if (data.title) {
                    document.getElementById('tournament-title').textContent = data.title;
                    // Update page title
                    document.title = data.title + ' - Skylinks Men\'s Golf Club';
                }
                if (data.price) {
                    // Format price with $ and .00
                    const formattedPrice = '$' + parseFloat(data.price).toFixed(2);
                    document.getElementById('tournament-price').textContent = formattedPrice;
                }
                if (data.description) {
                    // Parse description with line breaks and add schedule link at the end
                    const scheduleLink = '<br><strong>For more details check the <a href="/schedule/" style="color: #2a5c3d; text-decoration: underline;">Schedule</a></strong>';
                    
                    const descriptionHTML = data.description
                        .split('\n')
                        .map(line => line.trim() === '' ? '<br>' : `<p style="white-space:pre-wrap;" data-rte-preserve-empty="true">${line}</p>`)
                        .join('') + scheduleLink;
                    
                    document.getElementById('tournament-description').innerHTML = descriptionHTML;
                }
                
                // Handle active status
                const addToCartBtn = document.getElementById('open-member-modal');
                if (addToCartBtn) {
                    if (data.active === false) {
                        // Tournament is inactive - disable the button
                        addToCartBtn.classList.add('disabled-button');
                        addToCartBtn.disabled = true;
                        addToCartBtn.title = "Tournament entry deadline has passed";
                        
                        // Update the button text
                        const addToCartText = addToCartBtn.querySelector('.add-to-cart-text');
                        if (addToCartText) {
                            addToCartText.textContent = 'Entry Deadline Passed';
                        }
                    } else {
                        // Tournament is active - ensure button is enabled
                        addToCartBtn.classList.remove('disabled-button');
                        addToCartBtn.disabled = false;
                        addToCartBtn.title = "";
                        
                        // Update the button text
                        const addToCartText = addToCartBtn.querySelector('.add-to-cart-text');
                        if (addToCartText) {
                            addToCartText.textContent = 'Add To Cart';
                        }
                    }
                }
                
                // Pass tournament data to product modal
                if (typeof window.ProductModal !== 'undefined' && typeof window.ProductModal.setTournamentData === 'function') {
                    window.ProductModal.setTournamentData(data);
                }
            } catch (error) {
                console.error('Error loading monthly tournament:', error);
                document.getElementById('tournament-title').textContent = 'Error Loading Tournament';
                document.getElementById('tournament-description').innerHTML = 
                    '<p>Unable to load tournament details. Please try again later.</p>';
            }
        }

        // Load product modal
        // In your main page script, after loading the modal, add:
        fetch("/tournament-entry/tournament-modal.html")
            .then(res => {
                if (!res.ok) throw new Error('Modal not found');
                return res.text();
            })
            .then(html => {
                document.getElementById("member-modal-placeholder").innerHTML = html;
                console.log('Tournament modal loaded');
                
                // Initialize product modal after modal is loaded
                if (typeof window.ProductModal !== 'undefined' && typeof window.ProductModal.init === 'function') {
                    // Initialize product modal
                    window.ProductModal.init();
                    
                    // If tournament data is already loaded, pass it to the modal
                    if (window.tournamentData && typeof window.ProductModal.setTournamentData === 'function') {
                        window.ProductModal.setTournamentData(window.tournamentData);
                    }
                    
                    // Also set up tooltips immediately after modal loads
                    if (typeof window.ProductModal.setupTooltips === 'function') {
                        setTimeout(() => {
                            window.ProductModal.setupTooltips();
                        }, 100);
                    }
                }
            })
            .catch(error => {
                console.error('Product modal could not be loaded:', error);
            });

        // Initialize product detection after DOM is ready
        document.addEventListener('DOMContentLoaded', function() {
            console.log('DOM loaded, initializing product for tournament page...');
            
            // Load tournament data when page is ready
            loadMonthlyTournament();
        });
    </script>
</body>
</html>
