<!-- member-modal.html -->
<!-- Modal for membership details collection -->
 <link rel="stylesheet" href="/css/product.css" />

<div class="member-modal-backdrop" id="member-modal-backdrop" aria-hidden="true">
    <div class="member-modal" role="dialog" aria-modal="true" aria-labelledby="member-modal-title">
        <h3 id="member-modal-title" style="margin-top:0;">Membership Details</h3>
        
        <div class="row">
            <div class="col">
                <label for="modal-name">First Name *</label>
                <input id="modal-name" placeholder="" required />
            </div>
            <div class="col">
                <label for="modal-name">Last Name *</label>
                <input id="modal-name" placeholder="" required />
            </div>
        </div>
        
        <div class="row">
            <div class="col">
                <label for="modal-email">Email *</label>
                <input id="modal-email" type="email" placeholder="" required />
            </div>
            <div class="col">
                <label for="modal-phone">Phone *</label>
                <input id="modal-phone" placeholder="" />
            </div>
        </div>

         <div class="row">
            <div class="col">
                <label for="modal-ghin">GHIN Number *</label>
                <input id="modal-ghin" placeholder="" />
            </div>
        </div>
        
        <div class="modal-footer">
            <p class="required-note">* Required fields</p>
            <div class="actions">
                <button id="member-modal-cancel" class="btn ghost">Cancel</button>
                <button id="member-modal-save" class="btn primary">Add To Cart</button>
            </div>
        </div>
    </div>
</div>
