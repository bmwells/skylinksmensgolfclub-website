<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <link rel="icon" href="/favicon.ico" type="image/x-icon">
    <link rel="shortcut icon" href="/favicon.ico" type="image/x-icon">
    <title>Tournament Entry - Skylinks Men's Golf Club</title>
    <link rel="stylesheet" href="/css/styles.css" />
    <style>
        /* Tournament Entry Page Specific Styles */
        .tournament-entry-page {
            width: 100%;
        }
        
        /* Hero/Banner Section */
        .tournament-banner {
            position: relative;
            width: 100%;
            height: 45vh;
            background-color: #f5f5f5;
            display: flex;
            align-items: center;
            justify-content: center;
            text-align: center;
            overflow: hidden;
        }
        
        .tournament-banner-image {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background-image: url('https://images.squarespace-cdn.com/content/v1/678d4161123ed24a1ff89f0e/1737310564394-YG5P29UYIRVIUJP60SWK/P1099107.JPG');
            background-size: cover;
            background-position: center;
            background-repeat: no-repeat;
            background-position: 50% 63%; 
        }
        
        .tournament-banner::before {
            content: '';
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: rgba(0, 0, 0, 0);
            z-index: 1;
        }
        
        .tournament-banner h1 {
            position: relative;
            z-index: 2;
            color: white;
            font-size: 3rem;
            font-weight: 400;
            margin: 0;
            text-transform: none;
            letter-spacing: normal;
        }
        
        /* Product Grid Section */
        .tournament-products {
            background-color: white;
        }
        
        .tournament-products-container {
            max-width: 1400px;
            margin: 0 auto;
            padding: 0 20px;
        }
        
        .tournament-products-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(300px, 1fr));
            gap: 60px;
            margin-top: 40px;
        }
        
        .tournament-product-card {
            background: transparent;
            border: none;
            text-decoration: none;
            color: inherit;
            transition: transform 0.3s ease;
        }
        
        .tournament-product-card:hover {
            transform: translateY(-5px);
        }
        
        .tournament-product-image-wrapper {
            position: relative;
            width: 100%;
            aspect-ratio: 3/2;
            overflow: hidden;
            margin-bottom: 20px;
        }
        
        .tournament-product-image {
            width: 100%;
            height: 100%;
            object-fit: cover;
            transition: transform 0.3s ease;
        }
        
        .tournament-product-card:hover .tournament-product-image {
            transform: scale(1.05);
        }
        
        .tournament-product-meta {
            padding: 0 10px;
        }
        
        .tournament-product-title {
            font-size: 1.5rem;
            font-weight: 500;
            color: #333;
            margin: 0 0 10px 0;
            line-height: 1.3;
        }
        
        .tournament-product-price {
            font-size: 1.25rem;
            font-weight: 400;
            color: #666;
            padding-bottom: 40px;
        }
        
        /* Loading state */
        .loading {
            text-align: center;
            padding: 20px;
            color: #666;
        }
        
        /* Mobile Responsiveness */
        @media (max-width: 768px) {
            .tournament-banner {
                height: 35vh;
            }
            
            .tournament-banner h1 {
                font-size: 2.5rem;
            }
            
            .tournament-products {
                padding: 40px 0;
            }
            
            .tournament-products-grid {
                grid-template-columns: 1fr;
                gap: 30px;
            }
        }
        
        @media (max-width: 480px) {
            .tournament-banner h1 {
                font-size: 2rem;
            }
            
            .tournament-products {
                padding: 40px 0;
            }
        }
    </style>
</head>
<body class="tournament-entry-page">

    <!-- HEADER INJECTION -->
    <div id="header-placeholder"></div>

    <!-- Hero Banner Section -->
    <section class="tournament-banner">
        <div class="tournament-banner-image"></div>
        <h1>Tournament Entry</h1>
    </section>

    <!-- Tournament Products Section -->
    <section class="tournament-products">
        <div class="tournament-products-container">
            <div class="tournament-products-grid">
                <!-- Monthly Tournament Card - Will be populated by JavaScript -->
                <div id="monthly-tournament-card" class="loading">
                    Loading monthly tournament...
                </div>
                
                <!-- Membership Renewal Card -->
                <a href="membership-renewal/" class="tournament-product-card" aria-label="Membership Renewal">
                    <div class="tournament-product-image-wrapper">
                        <img 
                            src="https://images.squarespace-cdn.com/content/v1/678d4161123ed24a1ff89f0e/1737310564180-A6BUTVFM57WRUBYJ8836/P1099410.JPG" 
                            alt="Membership Renewal"
                            class="tournament-product-image"
                            loading="lazy"
                        />
                    </div>
                    <div class="tournament-product-meta">
                        <h3 class="tournament-product-title">Membership Renewal</h3>
                        <p class="tournament-product-price">$89.00</p>
                    </div>
                </a>

                <!-- New Membership Card -->
                <a href="new-membership/" class="tournament-product-card" aria-label="New Membership">
                    <div class="tournament-product-image-wrapper">
                        <img 
                            src="https://images.squarespace-cdn.com/content/v1/678d4161123ed24a1ff89f0e/1737310564165-5B2JME2T5UIES3LHANX0/P1099387.jpg" 
                            alt="New Membership"
                            class="tournament-product-image"
                            loading="lazy"
                        />
                    </div>
                    <div class="tournament-product-meta">
                        <h3 class="tournament-product-title">New Membership</h3>
                        <p class="tournament-product-price">$109.00</p>
                    </div>
                </a>
            </div>
        </div>
    </section>

    <!-- FOOTER INJECTION -->
    <div id="footer-placeholder"></div>

    <!-- Scripts -->
    <script src="/js/menu.js"></script>
    <script src="/js/cart-count.js"></script>

    <script>
        // Load header + footer on page
        fetch("/header.html")
            .then(res => res.text())
            .then(html => {
                document.getElementById("header-placeholder").innerHTML = html;
                if (typeof initMenu === "function") initMenu();
            });

        fetch("/footer.html")
            .then(res => res.text())
            .then(html => (document.getElementById("footer-placeholder").innerHTML = html));

        // Load monthly tournament data for the card
        async function loadMonthlyTournamentCard() {
            try {
                const response = await fetch('/api/monthly-tournament');
                const data = await response.json();
                
                const cardContainer = document.getElementById('monthly-tournament-card');
                
                if (!data || Object.keys(data).length === 0) {
                    cardContainer.innerHTML = `
                        <a href="monthly-tournament/" class="tournament-product-card" aria-label="Monthly Tournament">
                            <div class="tournament-product-image-wrapper">
                                <img 
                                    src="https://images.squarespace-cdn.com/content/v1/678d4161123ed24a1ff89f0e/1763488227617-G6Z4R2ORK7FEL2NJVU7H/202512Thumbnail.jpg" 
                                    alt="Monthly Tournament"
                                    class="tournament-product-image"
                                    loading="lazy"
                                />
                            </div>
                            <div class="tournament-product-meta">
                                <h3 class="tournament-product-title">Monthly Tournament</h3>
                                <p class="tournament-product-price">$90.00</p>
                            </div>
                        </a>
                    `;
                    return;
                }
                
                // Format price with $ and .00
                const formattedPrice = data.price ? '$' + parseFloat(data.price).toFixed(2) : '$90.00';
                const title = data.title || 'Monthly Tournament';
                const imageUrl = data.imageUrl || 'https://images.squarespace-cdn.com/content/v1/678d4161123ed24a1ff89f0e/1763488227617-G6Z4R2ORK7FEL2NJVU7H/202512Thumbnail.jpg';
                
                cardContainer.outerHTML = `
                    <a href="monthly-tournament/" class="tournament-product-card" aria-label="${title}">
                        <div class="tournament-product-image-wrapper">
                            <img 
                                src="${imageUrl}" 
                                alt="${title}"
                                class="tournament-product-image"
                                loading="lazy"
                            />
                        </div>
                        <div class="tournament-product-meta">
                            <h3 class="tournament-product-title">${title}</h3>
                            <p class="tournament-product-price">${formattedPrice}</p>
                        </div>
                    </a>
                `;
                
            } catch (error) {
                console.error('Error loading monthly tournament for card:', error);
                const cardContainer = document.getElementById('monthly-tournament-card');
                cardContainer.innerHTML = `
                    <a href="monthly-tournament/" class="tournament-product-card" aria-label="Monthly Tournament">
                        <div class="tournament-product-image-wrapper">
                            <img 
                                src="https://images.squarespace-cdn.com/content/v1/678d4161123ed24a1ff89f0e/1763488227617-G6Z4R2ORK7FEL2NJVU7H/202512Thumbnail.jpg" 
                                alt="Monthly Tournament"
                                class="tournament-product-image"
                                loading="lazy"
                            />
                        </div>
                        <div class="tournament-product-meta">
                            <h3 class="tournament-product-title">Monthly Tournament</h3>
                            <p class="tournament-product-price">$90.00</p>
                        </div>
                    </a>
                `;
            }
        }

        // Load tournament card when page is ready
        document.addEventListener('DOMContentLoaded', loadMonthlyTournamentCard);
    </script>

</body>
</html>
