<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <link rel="icon" href="/favicon.ico" type="image/x-icon">
    <link rel="shortcut icon" href="/favicon.ico" type="image/x-icon">
    <title>Tournament Entry - Skylinks Men's Golf Club</title>
    <link rel="stylesheet" href="/css/styles.css" />
    <link rel="stylesheet" href="/css/entry.css" />
    
</head>
<body class="tournament-entry-page">

    <!-- HEADER INJECTION -->
    <div id="header-placeholder"></div>

    <!-- Hero Banner Section -->
    <section class="tournament-banner">
        <div class="tournament-banner-image" id="tournament-banner-image"></div>
        <h1>Tournament Entry</h1>
    </section>

    <!-- Tournament Products Section -->
    <section class="tournament-products">
        <div class="tournament-products-container">
            <div id="tournament-grid-container">
                <!-- Grid will be populated dynamically by JavaScript -->
                <div class="loading">Loading tournaments...</div>
            </div>
        </div>
    </section>

    <!-- FOOTER INJECTION -->
    <div id="footer-placeholder"></div>

    <!-- Scripts -->
    <script src="/js/menu.js"></script>
    <script src="/js/cart-count.js"></script>

    <script>
        // Load header + footer on page
        fetch("/header.html")
            .then(res => res.text())
            .then(html => {
                document.getElementById("header-placeholder").innerHTML = html;
                if (typeof initMenu === "function") initMenu();
            });

        fetch("/footer.html")
            .then(res => res.text())
            .then(html => (document.getElementById("footer-placeholder").innerHTML = html));

        // Store loaded images globally
        let loadedImages = [];

        // Load all images from API
        async function loadAllImages() {
            try {
                const response = await fetch('/api/images');
                loadedImages = await response.json();
                
                // Set tournament entry banner
                const tournamentEntryImage = loadedImages.find(img => img.id === 'tournament-entry');
                const bannerImage = document.getElementById('tournament-banner-image');
                if (bannerImage && tournamentEntryImage && tournamentEntryImage.imageUrl) {
                    bannerImage.style.backgroundImage = `url('${tournamentEntryImage.imageUrl}')`;
                }
            } catch (error) {
                console.error('Error loading images:', error);
            }
        }

        // Get image URL from loaded images
        function getImageUrl(imageId, fallbackUrl = '') {
            const image = loadedImages.find(img => img.id === imageId);
            return image?.imageUrl || fallbackUrl;
        }

        // Load tournament cards
        async function loadTournamentCards() {
            try {
                // Load active tournaments from new API
                const response = await fetch('/api/tournaments?activePage=true');
                const tournaments = await response.json();
                
                const gridContainer = document.getElementById('tournament-grid-container');
                
                // Filter to only active tournaments
                const activeTournaments = tournaments.filter(t => t.activePage === true);
                
                // Sort: pinned first, then by creation date
                activeTournaments.sort((a, b) => {
                    if (a.pinned && !b.pinned) return -1;
                    if (!a.pinned && b.pinned) return 1;
                    return new Date(b.createdAt || 0) - new Date(a.createdAt || 0);
                });
                
                // Create grid based on number of active tournaments
                if (activeTournaments.length === 0) {
                    // No tournaments active, show just membership cards
                    gridContainer.innerHTML = `
                        <div class="tournament-products-grid">
                            <!-- Membership Renewal Card -->
                            <a href="membership-renewal/" class="tournament-product-card" aria-label="Membership Renewal">
                                <div class="tournament-product-image-wrapper">
                                    <img 
                                        src="${getImageUrl('membership-renewal', 'https://images.squarespace-cdn.com/content/v1/678d4161123ed24a1ff89f0e/1737310564180-A6BUTVFM57WRUBYJ8836/P1099410.JPG')}" 
                                        alt="Membership Renewal"
                                        class="tournament-product-image"
                                        loading="lazy"
                                        onerror="this.src='https://images.squarespace-cdn.com/content/v1/678d4161123ed24a1ff89f0e/1737310564180-A6BUTVFM57WRUBYJ8836/P1099410.JPG'"
                                    />
                                </div>
                                <div class="tournament-product-meta">
                                    <h3 class="tournament-product-title">Membership Renewal</h3>
                                    <p class="tournament-product-price">$89.00</p>
                                </div>
                            </a>

                            <!-- New Membership Card -->
                            <a href="new-membership/" class="tournament-product-card" aria-label="New Membership">
                                <div class="tournament-product-image-wrapper">
                                    <img 
                                        src="${getImageUrl('new-membership', 'https://images.squarespace-cdn.com/content/v1/678d4161123ed24a1ff89f0e/1737310564165-5B2JME2T5UIES3LHANX0/P1099387.jpg')}" 
                                        alt="New Membership"
                                        class="tournament-product-image"
                                        loading="lazy"
                                        onerror="this.src='https://images.squarespace-cdn.com/content/v1/678d4161123ed24a1ff89f0e/1737310564165-5B2JME2T5UIES3LHANX0/P1099387.jpg'"
                                    />
                                </div>
                                <div class="tournament-product-meta">
                                    <h3 class="tournament-product-title">New Membership</h3>
                                    <p class="tournament-product-price">$109.00</p>
                                </div>
                            </a>
                        </div>
                    `;
                } else {
                    // Create rows: tournaments first, then membership cards
                    let tournamentsHTML = '';
                    let membershipHTML = '';
                    
                    // Tournament cards
                    activeTournaments.forEach(tournament => {
                        tournamentsHTML += generateTournamentCard(tournament);
                    });
                    
                    // Membership cards
                    membershipHTML = `
                        <!-- Membership Renewal Card -->
                        <a href="membership-renewal/" class="tournament-product-card" aria-label="Membership Renewal">
                            <div class="tournament-product-image-wrapper">
                                <img 
                                    src="${getImageUrl('membership-renewal', 'https://images.squarespace-cdn.com/content/v1/678d4161123ed24a1ff89f0e/1737310564180-A6BUTVFM57WRUBYJ8836/P1099410.JPG')}" 
                                    alt="Membership Renewal"
                                    class="tournament-product-image"
                                    loading="lazy"
                                    onerror="this.src='https://images.squarespace-cdn.com/content/v1/678d4161123ed24a1ff89f0e/1737310564180-A6BUTVFM57WRUBYJ8836/P1099410.JPG'"
                                />
                            </div>
                            <div class="tournament-product-meta">
                                <h3 class="tournament-product-title">Membership Renewal</h3>
                                <p class="tournament-product-price">$89.00</p>
                            </div>
                        </a>

                        <!-- New Membership Card -->
                        <a href="new-membership/" class="tournament-product-card" aria-label="New Membership">
                            <div class="tournament-product-image-wrapper">
                                <img 
                                    src="${getImageUrl('new-membership', 'https://images.squarespace-cdn.com/content/v1/678d4161123ed24a1ff89f0e/1737310564165-5B2JME2T5UIES3LHANX0/P1099387.jpg')}" 
                                    alt="New Membership"
                                    class="tournament-product-image"
                                    loading="lazy"
                                    onerror="this.src='https://images.squarespace-cdn.com/content/v1/678d4161123ed24a1ff89f0e/1737310564165-5B2JME2T5UIES3LHANX0/P1099387.jpg'"
                                />
                            </div>
                            <div class="tournament-product-meta">
                                <h3 class="tournament-product-title">New Membership</h3>
                                <p class="tournament-product-price">$109.00</p>
                            </div>
                        </a>
                    `;
                    
                    // Determine grid layout based on number of tournaments
                    const tournamentCount = activeTournaments.length;
                    let tournamentsGridCols = tournamentCount === 1 ? '1fr' : 'repeat(2, 1fr)';
                    
                    gridContainer.innerHTML = `
                        <div class="tournament-products-grid" style="grid-template-columns: ${tournamentsGridCols}; margin-bottom: 40px;">
                            ${tournamentsHTML}
                        </div>
                        <div class="tournament-products-grid" style="grid-template-columns: repeat(2, 1fr);">
                            ${membershipHTML}
                        </div>
                    `;
                }
                
            } catch (error) {
                console.error('Error loading tournament cards:', error);
                const gridContainer = document.getElementById('tournament-grid-container');
                gridContainer.innerHTML = `
                    <div class="tournament-products-grid">
                        <!-- Default fallback if API fails -->
                        <div class="error-message">
                            <p>Unable to load tournaments. Please try again later.</p>
                        </div>
                    </div>
                `;
            }
        }

        function generateTournamentCard(tournament) {
            const formattedPrice = tournament.price ? '$' + parseFloat(tournament.price).toFixed(2) : '$0.00';
            const title = tournament.title || 'Tournament';
            const tournamentId = tournament.id || 'tournament';
            
            // Get image URL - try tournament's imageUrl first, then fallback
            let imageUrl = tournament.imageUrl || getImageUrl('tournament-entry', 'https://images.squarespace-cdn.com/content/v1/678d4161123ed24a1ff89f0e/1763488227617-G6Z4R2ORK7FEL2NJVU7H/202512Thumbnail.jpg');
            
            return `
                <a href="/tournament-entry/${tournamentId}/" class="tournament-product-card" aria-label="${title}">
                    <div class="tournament-product-image-wrapper">
                        <img 
                            src="${imageUrl}" 
                            alt="${title}"
                            class="tournament-product-image"
                            loading="lazy"
                            onerror="this.src='https://images.squarespace-cdn.com/content/v1/678d4161123ed24a1ff89f0e/1763488227617-G6Z4R2ORK7FEL2NJVU7H/202512Thumbnail.jpg'"
                        />
                        ${tournament.pinned ? '<div class="pinned-badge" title="Pinned tournament">📌</div>' : ''}
                    </div>
                    <div class="tournament-product-meta">
                        <h3 class="tournament-product-title">${title}</h3>
                        <p class="tournament-product-price">${formattedPrice}</p>
                    </div>
                </a>
            `;
        }

        // Load everything when page is ready
        document.addEventListener('DOMContentLoaded', async function() {
            await loadAllImages();
            await loadTournamentCards();
        });
    </script>

    <style>
        .pinned-badge {
            position: absolute;
            top: 10px;
            right: 10px;
            background: rgba(255, 193, 7, 0.9);
            color: #212529;
            padding: 4px 8px;
            border-radius: 4px;
            font-size: 0.9rem;
            font-weight: bold;
            z-index: 2;
        }
        
        .tournament-product-image-wrapper {
            position: relative;
        }
        
        .error-message {
            grid-column: 1 / -1;
            text-align: center;
            padding: 40px;
            color: #666;
        }
    </style>

</body>
</html>
