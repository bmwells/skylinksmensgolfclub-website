<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <link rel="icon" href="/favicon.ico" type="image/x-icon">
    <link rel="shortcut icon" href="/favicon.ico" type="image/x-icon">
    <title>Tournament Entry - Skylinks Men's Golf Club</title>
    <link rel="stylesheet" href="/css/styles.css" />
    <link rel="stylesheet" href="/css/entry.css" />
    
</head>
<body class="tournament-entry-page">

    <!-- HEADER INJECTION -->
    <div id="header-placeholder"></div>

    <!-- Hero Banner Section -->
    <section class="tournament-banner">
        <div class="tournament-banner-image" id="tournament-banner-image"></div>
        <h1>Tournament Entry</h1>
    </section>

    <!-- Tournament Products Section -->
    <section class="tournament-products">
        <div class="tournament-products-container">
            <div id="tournament-grid-container">
                <!-- Grid will be populated dynamically by JavaScript -->
                <div class="loading">Loading tournaments...</div>
            </div>
        </div>
    </section>

    <!-- FOOTER INJECTION -->
    <div id="footer-placeholder"></div>

    <!-- Scripts -->
    <script src="/js/menu.js"></script>
    <script src="/js/cart-count.js"></script>

    <script>
        // Load header + footer on page
        fetch("/header.html")
            .then(res => res.text())
            .then(html => {
                document.getElementById("header-placeholder").innerHTML = html;
                if (typeof initMenu === "function") initMenu();
            });

        fetch("/footer.html")
            .then(res => res.text())
            .then(html => (document.getElementById("footer-placeholder").innerHTML = html));

        // Load tournament entry banner image
        async function loadTournamentBanner() {
            try {
                const response = await fetch('/api/images');
                const images = await response.json();
                const tournamentEntryImage = images.find(img => img.id === 'tournament-entry');
                
                const bannerImage = document.getElementById('tournament-banner-image');
                if (bannerImage && tournamentEntryImage && tournamentEntryImage.imageUrl) {
                    bannerImage.style.backgroundImage = `url('${tournamentEntryImage.imageUrl}')`;
                }
                // Note: No fallback for tournament-entry as it may intentionally be empty
            } catch (error) {
                console.error('Error loading tournament banner:', error);
            }
        }

        // Load tournament cards
        async function loadTournamentCards() {
            try {
                // Load both tournaments
                const [tournament1Res, tournament2Res] = await Promise.all([
                    fetch('/api/monthly-tournament'),
                    fetch('/api/monthly-tournament2')
                ]);
                
                const tournament1Data = await tournament1Res.json();
                const tournament2Data = await tournament2Res.json();
                
                const gridContainer = document.getElementById('tournament-grid-container');
                let activeTournaments = [];
                
                // Check if tournament 1 should be shown
                if (tournament1Data && tournament1Data.activePage !== false) {
                    activeTournaments.push({
                        data: tournament1Data,
                        url: 'monthly-tournament/',
                        fallbackImage: 'https://images.squarespace-cdn.com/content/v1/678d4161123ed24a1ff89f0e/1763488227617-G6Z4R2ORK7FEL2NJVU7H/202512Thumbnail.jpg',
                        fallbackTitle: 'Monthly Tournament',
                        fallbackPrice: 90.00
                    });
                }
                
                // Check if tournament 2 should be shown
                if (tournament2Data && tournament2Data.activePage !== false) {
                    activeTournaments.push({
                        data: tournament2Data,
                        url: 'monthly-tournament2/',
                        fallbackImage: 'https://images.squarespace-cdn.com/content/v1/678d4161123ed24a1ff89f0e/1763488227617-G6Z4R2ORK7FEL2NJVU7H/202512Thumbnail.jpg',
                        fallbackTitle: 'Monthly Tournament 2',
                        fallbackPrice: 90.00
                    });
                }
                
                // Create grid based on number of active tournaments
                if (activeTournaments.length === 0) {
                    // No tournaments active, show just membership cards
                    gridContainer.innerHTML = `
                        <div class="tournament-products-grid">
                            <!-- Membership Renewal Card -->
                            <a href="membership-renewal/" class="tournament-product-card" aria-label="Membership Renewal">
                                <div class="tournament-product-image-wrapper">
                                    <img 
                                        src="https://images.squarespace-cdn.com/content/v1/678d4161123ed24a1ff89f0e/1737310564180-A6BUTVFM57WRUBYJ8836/P1099410.JPG" 
                                        alt="Membership Renewal"
                                        class="tournament-product-image"
                                        loading="lazy"
                                    />
                                </div>
                                <div class="tournament-product-meta">
                                    <h3 class="tournament-product-title">Membership Renewal</h3>
                                    <p class="tournament-product-price">$89.00</p>
                                </div>
                            </a>

                            <!-- New Membership Card -->
                            <a href="new-membership/" class="tournament-product-card" aria-label="New Membership">
                                <div class="tournament-product-image-wrapper">
                                    <img 
                                        src="https://images.squarespace-cdn.com/content/v1/678d4161123ed24a1ff89f0e/1737310564165-5B2JME2T5UIES3LHANX0/P1099387.jpg" 
                                        alt="New Membership"
                                        class="tournament-product-image"
                                        loading="lazy"
                                    />
                                </div>
                                <div class="tournament-product-meta">
                                    <h3 class="tournament-product-title">New Membership</h3>
                                    <p class="tournament-product-price">$109.00</p>
                                </div>
                            </a>
                        </div>
                    `;
                } else if (activeTournaments.length === 1) {
                    // One tournament active, show it with membership renewal
                    gridContainer.innerHTML = `
                        <div class="tournament-products-grid">
                            ${generateTournamentCard(activeTournaments[0])}
                            
                            <!-- Membership Renewal Card -->
                            <a href="membership-renewal/" class="tournament-product-card" aria-label="Membership Renewal">
                                <div class="tournament-product-image-wrapper">
                                    <img 
                                        src="https://images.squarespace-cdn.com/content/v1/678d4161123ed24a1ff89f0e/1737310564180-A6BUTVFM57WRUBYJ8836/P1099410.JPG" 
                                        alt="Membership Renewal"
                                        class="tournament-product-image"
                                        loading="lazy"
                                    />
                                </div>
                                <div class="tournament-product-meta">
                                    <h3 class="tournament-product-title">Membership Renewal</h3>
                                    <p class="tournament-product-price">$89.00</p>
                                </div>
                            </a>

                            <!-- New Membership Card -->
                            <a href="new-membership/" class="tournament-product-card" aria-label="New Membership">
                                <div class="tournament-product-image-wrapper">
                                    <img 
                                        src="https://images.squarespace-cdn.com/content/v1/678d4161123ed24a1ff89f0e/1737310564165-5B2JME2T5UIES3LHANX0/P1099387.jpg" 
                                        alt="New Membership"
                                        class="tournament-product-image"
                                        loading="lazy"
                                    />
                                </div>
                                <div class="tournament-product-meta">
                                    <h3 class="tournament-product-title">New Membership</h3>
                                    <p class="tournament-product-price">$109.00</p>
                                </div>
                            </a>
                        </div>
                    `;
                } else {
                    // Two tournaments active, show both tournaments in first row, new membership in second row
                    gridContainer.innerHTML = `
                        <div class="tournament-products-grid" style="grid-template-columns: repeat(2, 1fr);">
                            ${generateTournamentCard(activeTournaments[0])}
                            ${generateTournamentCard(activeTournaments[1])}
                        </div>
                        <div class="tournament-products-grid" style="margin-top: 40px; grid-template-columns: repeat(2, 1fr);">
                            <!-- Membership Renewal Card -->
                            <a href="membership-renewal/" class="tournament-product-card" aria-label="Membership Renewal">
                                <div class="tournament-product-image-wrapper">
                                    <img 
                                        src="https://images.squarespace-cdn.com/content/v1/678d4161123ed24a1ff89f0e/1737310564180-A6BUTVFM57WRUBYJ8836/P1099410.JPG" 
                                        alt="Membership Renewal"
                                        class="tournament-product-image"
                                        loading="lazy"
                                    />
                                </div>
                                <div class="tournament-product-meta">
                                    <h3 class="tournament-product-title">Membership Renewal</h3>
                                    <p class="tournament-product-price">$89.00</p>
                                </div>
                            </a>

                            <!-- New Membership Card -->
                            <a href="new-membership/" class="tournament-product-card" aria-label="New Membership">
                                <div class="tournament-product-image-wrapper">
                                    <img 
                                        src="https://images.squarespace-cdn.com/content/v1/678d4161123ed24a1ff89f0e/1737310564165-5B2JME2T5UIES3LHANX0/P1099387.jpg" 
                                        alt="New Membership"
                                        class="tournament-product-image"
                                        loading="lazy"
                                    />
                                </div>
                                <div class="tournament-product-meta">
                                    <h3 class="tournament-product-title">New Membership</h3>
                                    <p class="tournament-product-price">$109.00</p>
                                </div>
                            </a>
                        </div>
                    `;
                }
                
            } catch (error) {
                console.error('Error loading tournament cards:', error);
                const gridContainer = document.getElementById('tournament-grid-container');
                gridContainer.innerHTML = `
                    <div class="tournament-products-grid">
                        <!-- Default fallback if API fails -->
                        <a href="monthly-tournament/" class="tournament-product-card" aria-label="Monthly Tournament">
                            <div class="tournament-product-image-wrapper">
                                <img 
                                    src="https://images.squarespace-cdn.com/content/v1/678d4161123ed24a1ff89f0e/1763488227617-G6Z4R2ORK7FEL2NJVU7H/202512Thumbnail.jpg" 
                                    alt="Monthly Tournament"
                                    class="tournament-product-image"
                                    loading="lazy"
                                />
                            </div>
                            <div class="tournament-product-meta">
                                <h3 class="tournament-product-title">Monthly Tournament</h3>
                                <p class="tournament-product-price">$90.00</p>
                            </div>
                        </a>
                        
                        <!-- Membership Renewal Card -->
                        <a href="membership-renewal/" class="tournament-product-card" aria-label="Membership Renewal">
                            <div class="tournament-product-image-wrapper">
                                <img 
                                    src="https://images.squarespace-cdn.com/content/v1/678d4161123ed24a1ff89f0e/1737310564180-A6BUTVFM57WRUBYJ8836/P1099410.JPG" 
                                    alt="Membership Renewal"
                                    class="tournament-product-image"
                                    loading="lazy"
                                />
                            </div>
                            <div class="tournament-product-meta">
                                <h3 class="tournament-product-title">Membership Renewal</h3>
                                <p class="tournament-product-price">$89.00</p>
                            </div>
                        </a>

                        <!-- New Membership Card -->
                        <a href="new-membership/" class="tournament-product-card" aria-label="New Membership">
                            <div class="tournament-product-image-wrapper">
                                <img 
                                    src="https://images.squarespace-cdn.com/content/v1/678d4161123ed24a1ff89f0e/1737310564165-5B2JME2T5UIES3LHANX0/P1099387.jpg" 
                                    alt="New Membership"
                                    class="tournament-product-image"
                                    loading="lazy"
                                />
                            </div>
                            <div class="tournament-product-meta">
                                <h3 class="tournament-product-title">New Membership</h3>
                                <p class="tournament-product-price">$109.00</p>
                            </div>
                        </a>
                    </div>
                `;
            }
        }

        function generateTournamentCard(tournamentInfo) {
            const data = tournamentInfo.data;
            const formattedPrice = data.price ? '$' + parseFloat(data.price).toFixed(2) : '$' + tournamentInfo.fallbackPrice.toFixed(2);
            const title = data.title || tournamentInfo.fallbackTitle;
            const imageUrl = data.imageUrl || tournamentInfo.fallbackImage;
            
            return `
                <a href="${tournamentInfo.url}" class="tournament-product-card" aria-label="${title}">
                    <div class="tournament-product-image-wrapper">
                        <img 
                            src="${imageUrl}" 
                            alt="${title}"
                            class="tournament-product-image"
                            loading="lazy"
                        />
                    </div>
                    <div class="tournament-product-meta">
                        <h3 class="tournament-product-title">${title}</h3>
                        <p class="tournament-product-price">${formattedPrice}</p>
                    </div>
                </a>
            `;
        }

        // Load tournament cards when page is ready
        document.addEventListener('DOMContentLoaded', function() {
            loadTournamentBanner();
            loadTournamentCards();
        });
    </script>

</body>
</html>
