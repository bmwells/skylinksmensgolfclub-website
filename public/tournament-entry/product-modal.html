<!-- product-modal.html -->
<!-- Product Modal for membership details collection -->

<div class="product-modal-backdrop" id="product-modal-backdrop" aria-hidden="true">
    <div class="product-modal" role="dialog" aria-modal="true" aria-labelledby="product-modal-title">
        <h3 id="product-modal-title" style="margin-top:0;">Membership Details</h3>
        
        <div class="row">
            <div class="col">
                <label for="modal-name">First Name *</label>
                <input id="modal-name" placeholder="" required />
            </div>
            <div class="col">
                <label for="modal-name">Last Name *</label>
                <input id="modal-name" placeholder="" required />
            </div>
        </div>
        
        <div class="row">
            <div class="col">
                <label for="modal-email">Email *</label>
                <input id="modal-email" type="email" placeholder="" required />
            </div>
            <div class="col">
                <label for="modal-phone">Phone *</label>
                <input id="modal-phone" placeholder="" />
            </div>
        </div>

         <div class="row">
            <div class="col">
                <label for="modal-ghin">GHIN Number *</label>
                <input id="modal-ghin" placeholder="" />
            </div>
        </div>
        
        <div class="modal-footer">
            <p class="required-note">* Required fields</p>
            <div class="actions">
                <button id="product-modal-cancel" class="btn ghost">Cancel</button>
                <button id="product-modal-save" class="btn primary">Add To Cart</button>
            </div>
        </div>
    </div>
</div>

<style>
    /* Product Modal Styles */
    .product-modal-backdrop {
        position: fixed;
        inset: 0;
        background: rgba(0,0,0,0.45);
        display: none;
        align-items: center;
        justify-content: center;
        z-index: 2000;
        animation: fadeIn 0.2s ease-out;
    }
    
    .product-modal-backdrop.active {
        display: flex;
    }
    
    .product-modal {
        width: 680px;
        max-width: 95%;
        max-height: 90vh;
        overflow-y: auto;
        background: #fff;
        border-radius: 12px;
        padding: 30px;
        box-shadow: 0 15px 50px rgba(0,0,0,.25);
        animation: slideUp 0.3s ease-out;
    }
    
    .product-modal h3 {
        margin-top: 0;
        margin-bottom: 25px;
        font-size: 1.5rem;
        font-weight: 600;
        color: #000;
    }
    
    .product-modal label {
        display: block;
        margin-bottom: 8px;
        font-weight: 600;
        color: #333;
        font-size: 0.95rem;
    }
    
    .product-modal input,
    .product-modal textarea {
        width: 100%;
        padding: 12px 15px;
        border: 1px solid #ddd;
        border-radius: 6px;
        margin-bottom: 20px;
        box-sizing: border-box;
        font-size: 1rem;
        transition: border-color 0.2s, box-shadow 0.2s;
    }
    
    .product-modal input:focus,
    .product-modal textarea:focus {
        outline: none;
        border-color: #000;
        box-shadow: 0 0 0 3px rgba(0,0,0,0.05);
    }
    
    .product-modal input::placeholder,
    .product-modal textarea::placeholder {
        color: #999;
    }
    
    .product-modal .row {
        display: flex;
        gap: 20px;
        margin-bottom: 5px;
    }
    
    .product-modal .row .col {
        flex: 1;
    }
    
    .product-modal .modal-footer {
        margin-top: 25px;
        padding-top: 20px;
        border-top: 1px solid #eee;
    }
    
    .product-modal .required-note {
        font-size: 0.85rem;
        color: #666;
        margin-bottom: 20px;
    }
    
    .product-modal .actions {
        display: flex;
        gap: 12px;
        justify-content: flex-end;
    }
    
    .btn {
        border-radius: 32px;
        padding: 12px 28px;
        cursor: pointer;
        border: none;
        font-size: 1rem;
        font-weight: 500;
        transition: all 0.2s ease;
        min-width: 100px;
    }
    
    .btn.primary {
        background: #000;
        color: #fff;
        text-transform: uppercase;
        letter-spacing: 0.5px;
    }
    
    .btn.primary:hover {
        background: #333;
    }
    
    .btn.ghost {
        background: transparent;
        border: 1px solid #ddd;
        color: #333;
    }
    
    .btn.ghost:hover {
        background: #f9f9f9;
        border-color: #ccc;
    }
    
    /* Animations */
    @keyframes fadeIn {
        from { opacity: 0; }
        to { opacity: 1; }
    }
    
    @keyframes slideUp {
        from {
            opacity: 0;
            transform: translateY(20px);
        }
        to {
            opacity: 1;
            transform: translateY(0);
        }
    }
    
    /* Responsive styles for modal */
    @media (max-width: 768px) {
        .product-modal {
            padding: 25px 20px;
            width: 95%;
        }
        
        .product-modal .row {
            flex-direction: column;
            gap: 0;
        }
        
        .btn {
            padding: 10px 20px;
            min-width: 80px;
        }
        
        .product-modal h3 {
            font-size: 1.3rem;
        }
    }
    
    @media (max-width: 480px) {
        .product-modal {
            padding: 20px 15px;
        }
        
        .product-modal .actions {
            flex-direction: column;
        }
        
        .btn {
            width: 100%;
        }
    }
</style>
